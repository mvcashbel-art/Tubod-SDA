  { n: 'Peter', r: 'Matthew 14; Luke 22; Acts 2', c: ['I was a fisherman, and my brother is Andrew.', 'Jesus called me to become a fisher of men.', 'I stepped out of the boat and walked on water, then began to sink.', 'I denied my Lord three times, yet preached at Pentecost.'] },
  { n: 'Paul', r: 'Acts 9', c: ['I was born in Tarsus and trained as a Pharisee.', 'I once approved of Stephen’s death and hunted believers.', 'A blinding light stopped me on the road to Damascus.', 'I wrote many New Testament letters and carried the gospel to the Gentiles.'] },
  { n: 'Joseph (son of Jacob)', r: 'Genesis 37–45', c: ['My father gave me a special coat.', 'My brothers sold me for twenty pieces of silver.', 'I explained Pharaoh’s dreams about seven fat and seven lean cows.', 'I became second in command of Egypt and forgave my brothers.'] },
  { n: 'Ruth', r: 'Ruth 1–4', c: ['I was a Moabite woman who lost my husband.', 'I told my mother-in-law, “Whither thou goest, I will go.”', 'I gleaned grain in the fields of Boaz.', 'I became the great-grandmother of King David.'] },
  { n: 'Abraham', r: 'Genesis 12; 22', c: ['God called me to leave my homeland for a land He would show me.', 'He promised my descendants would be as many as the stars.', 'Sarah and I had a son in our old age.', 'I was ready to offer Isaac, but God provided a ram.'] },
  { n: 'Elijah', r: '1 Kings 17–18; 2 Kings 2', c: ['I came from Gilead and boldly confronted King Ahab.', 'Ravens fed me beside a brook.', 'On Mount Carmel, fire fell from heaven in answer to my prayer.', 'I never died. I was taken up in a whirlwind.'] },
  { n: 'John the Baptist', r: 'Matthew 3', c: ['My parents were Zechariah and Elizabeth.', 'I wore camel’s hair and ate locusts and wild honey.', 'I cried in the wilderness, “Prepare ye the way of the Lord.”', 'I baptized Jesus in the Jordan.'] },
  { n: 'Jonah', r: 'Jonah 1–4', c: ['God told me to go to Nineveh, but I ran the other way.', 'I boarded a ship for Tarshish.', 'I was thrown overboard in a storm and a great fish swallowed me.', 'I was angry when God showed mercy to a repentant city.'] },
  { n: 'Samuel', r: '1 Samuel 1–3; 16', c: ['My mother Hannah prayed for me and gave me to the LORD.', 'I grew up serving in the house of the LORD under Eli.', 'Three times I thought Eli called me, but it was God.', 'I anointed Israel’s first two kings.'] },
  { n: 'John the apostle', r: 'Revelation 1:9', c: ['I was a fisherman, the son of Zebedee.', 'My brother was James.', 'I am called the disciple whom Jesus loved.', 'I was exiled to Patmos and wrote Revelation.'] }
];

/* ---------- Bisaya (Cebuano) content: same order as QUIZ and WHO ---------- */
const CEB_QUIZ = [
  ["Kinsa ang nagtukod sa arka aron mabuhi sa dakong lunop?", "Noe", ["Moises", "Abraham", "Enoc"], "Gisugo sa Dios si Noe nga magtukod og arka nga kahoy nga gopher, ug gihimo ni Noe ang tanan nga gisugo sa Dios."],
  ["Unsang adlawa sa Semana sa Paglalang mipahulay ang Dios?", "Ang ikapitong adlaw", ["Ang unang adlaw", "Ang ikatulong adlaw", "Ang ikaunom nga adlaw"], "Gipanalanginan sa Dios ang ikapitong adlaw ug gibalaan kini—ang unang Igpapahulay."],
  ["Unsang timaan ang gihatag sa Dios nga saad nga dili na Siya magpadala pag-usab og lunop sa tibuok kalibotan?", "Ang balangaw", ["Ang salampati", "Ang bituon", "Ang haligi sa panganod"], "Ang balangaw mao ang timaan sa walay kataposang pakigsaad sa Dios uban sa tanang buhing linalang."],
  ["Kinsa ang gisalibay sa lungib sa mga leon tungod sa pag-ampo sa Dios?", "Daniel", ["Jeremias", "Sadrac", "Elias"], "Gipadala sa Dios ang Iyang anghel ug gisirhan ang baba sa mga leon tungod kay misalig si Daniel Kaniya."],
  ["Hain nga propeta ang tulo ka adlaw ug tulo ka gabii sa tiyan sa dakong isda?", "Jonas", ["Eliseo", "Oseas", "Amos"], "Si Jesus sa ulahi nagtumong kang Jonas isip timaan sa Iyang kaugalingong tulo ka adlaw sa lubnganan (Mateo 12:40)."],
  ["Pila ka hampak ang gipadala sa Dios sa Egipto?", "Napulo", ["Pito", "Napulo ug duha", "Lima"], "Ang ikanapulo nga hampak, ang pagkamatay sa mga panganay, nagdala sa unang Paskuwa."],
  ["Hain nga anak ni Jacob ang gibaligya sa iyang mga igsoon ug sa ulahi nahimong magmamando sa Egipto?", "Jose", ["Benjamin", "Juda", "Ruben"], "Miingon si Jose sa iyang mga igsoon nga ang dautan nga ilang gituyo, gihimo sa Dios alang sa kaayohan (Genesis 50:20)."],
  ["Unsa ang gigamit ni David sa pagpildi kang Goliat?", "Usa ka tirador ug bato", ["Usa ka espada", "Usa ka bangkaw", "Usa ka pana"], "Mianhi si David “sa ngalan sa Ginoo sa mga panon,” dili sa iyang kaugalingong gahum."],
  ["Hain nga hari ang mihangyo sa Dios og kaalam ug nagtukod sa templo sa Jerusalem?", "Solomon", ["David", "Ezequias", "Josias"], "Gihatagan sa Dios si Solomon og manggialamon ug masinabtanon nga kasingkasing."],
  ["Giunsa pagdala sa langit ang propeta nga si Elias?", "Sa alimpulos, uban sa karwahe nga kalayo", ["Namatay siya nga malinawon sa Bukid sa Carmelo", "Gidala siya sa mga uwak", "Mitabok siya sa Dagat nga Pula ug nawala"], "Si Elias usa sa duha lamang ka tawo sa Daang Kasabotan nga wala makatilaw og kamatayon. Ang usa pa mao si Enoc."],
  ["Kinsa ang nagluwas sa mga Judio pinaagi sa pagduol sa hari sa Persia nga wala gipatawag?", "Ester", ["Rut", "Debora", "Ana"], "Gipangutana ni Mardokeo kon si Ester ba nahimong rayna alang sa maong panahon."],
  ["Kinsa ang mipatay sa iyang igsoon nga si Abel—ang unang pagpatay sa Bibliya?", "Cain", ["Set", "Lamec", "Esau"], "Ang halad ni Abel gidawat tungod sa pagtuo (Hebreo 11:4)."],
  ["Hain nga tulo ka batan-ong lalaki ang gisalibay sa hudno nga nagdilaab apan wala masunog?", "Sadrac, Mesac ug Abednego", ["Pedro, Santiago ug Juan", "Esdras, Nehemias ug Hageo", "Elias, Eliseo ug Samuel"], "Nakita sa hari ang ikaupat nga hulagway sa kalayo nga “sama sa Anak sa Dios.”"],
  ["Pila ka libro ang anaa sa Daang Kasabotan?", "39", ["27", "66", "46"], "Ang 39 ka libro sa Daang Kasabotan ug 27 sa Bag-ong Kasabotan mao ang 66 ka tanan."],
  ["Hain nga maghuhukom ang kusog nalakip sa wala nagupti nga buhok?", "Samson", ["Gideon", "Ehud", "Jefte"], "Si Samson usa ka Nazareo sukad pa sa pagkahimugso."],
  ["Unsang dagat ang gibahin sa Dios aron makatabok ang Israel sa uga nga yuta?", "Ang Dagat nga Pula", ["Ang Patay nga Dagat", "Ang Dagat sa Galilea", "Ang Dagat Mediteraneo"], "Ang tubig nahimong paril alang kanila sa tuo ug sa wala."],
  ["Kinsa ang anak nga saad ni Abraham?", "Isaac", ["Ismael", "Jacob", "Esau"], "Natawo si Isaac sa dihang si Abraham 100 anyos ug si Sara 90."],
  ["Kinsa ang unang tawo nga gilalang sa Dios?", "Adan", ["Enoc", "Set", "Abel"], "Gimugna sa Dios ang tawo gikan sa abog sa yuta ug gihuypan sa gininhawa sa kinabuhi."],
  ["Asang lungsora natawo si Jesus?", "Betlehem", ["Nazaret", "Jerusalem", "Capernaum"], "Gitagna ni Miqueas ang dapit nga natawhan sa Mesiyas sa daghang siglo sa wala pa kini."],
  ["Kinsa ang nagbawtismo kang Jesus sa Suba sa Jordan?", "Juan Bautista", ["Pedro", "Felipe", "Andres"], "Usa ka tingog gikan sa langit miingon nga Siya ang hinigugma nga Anak nga nakapahimuot sa Amahan."],
  ["Pila ka apostoles ang gipili ni Jesus?", "Napulo ug duha", ["Pito", "Napulo", "Kapitoan"], "Sa ulahi nagpadala si Jesus og pitumpo pa (Lucas 10:1), apan napulo ug duha ang mga apostoles."],
  ["Unsa ang unang milagro ni Jesus nga natala?", "Gihimong bino ang tubig", ["Pagpakaon sa lima ka libo", "Pag-ayo sa buta", "Paglakaw sa ibabaw sa tubig"], "Nahitabo kini sa usa ka kasal sa Cana sa Galilea."],
  ["Hain nga tinun-an ang naglimod nga nakaila kang Jesus sa tulo ka higayon?", "Pedro", ["Juan", "Tomas", "Andres"], "Mihilak og mapait si Pedro, ug sa ulahi gipasig-uli siya ni Jesus (Juan 21:15–17)."],
  ["Kinsa ang gibanhaw ni Jesus gikan sa mga patay human sa upat ka adlaw sa lubnganan?", "Lazaro", ["Ang anak nga babaye ni Jairo", "Ang anak sa balo sa Nain", "Dorcas"], "Miingon si Jesus, “Ako mao ang pagkabanhaw ug ang kinabuhi.”"],
  ["Hain nga mubo nga maniningil sa buhis ang misaka sa kahoy nga sikomoro aron makita si Jesus?", "Zaqueo", ["Bartimeo", "Nicodemo", "Cornelio"], "Miingon si Jesus nga ang Anak sa Tawo mianhi aron sa pagpangita ug sa pagluwas sa nawala."],
  ["Unsang adlawa human sa Iyang kamatayon mibangon si Jesus gikan sa lubnganan?", "Ang ikatulo nga adlaw", ["Ang ikaduhang adlaw", "Ang ikapitong adlaw", "Ang ika-kap-atan nga adlaw"], "Mipahulay si Jesus sa lubnganan sa Igpapahulay ug mibangon sa unang adlaw sa semana."],
  ["Kinsa ang nahimamat ni Jesus sa dalan paingon sa Damasco ug nahimong bantogang apostol?", "Saulo, nga gitawag usab og Pablo", ["Bernabe", "Timoteo", "Silas"], "Si Saulo nga tigpanggukod sa iglesia nahimong magwawali ni Kristo ngadto sa mga Hentil."],
  ["Hain nga magsusulat sa Ebanghelyo ang usa ka doktor?", "Lucas", ["Mateo", "Marcos", "Juan"], "Gitawag siya ni Pablo nga “Lucas, ang hinigugma nga manggamot.” Siya usab ang nagsulat sa Binuhatan."],
  ["Pila ka libro ang anaa sa Bag-ong Kasabotan?", "27", ["39", "66", "24"], "Nagsugod kini sa Mateo ug mahuman sa Pinadayag."],
  ["Kinsa ang unang martir sa Kristiyano?", "Esteban", ["Felipe", "Bernabe", "Timoteo"], "Samtang namatay, nag-ampo si Esteban alang niadtong nagbato kaniya."],
  ["Unsa ang katapusang libro sa Bibliya?", "Pinadayag", ["Judas", "Binuhatan", "Hebreo"], "Kini mao ang “Pinadayag ni Jesukristo.”"],
  ["Asang lungsora nagdako si Jesus?", "Nazaret", ["Betlehem", "Jerico", "Betania"], "Si Jesus nailhan nga “Jesus nga taga-Nazaret.”"],
  ["Hain nga tinun-an ang nagduhaduha sa pagkabanhaw hangtod nga nakita niya ang mga samad sa lansang?", "Tomas", ["Felipe", "Andres", "Bartolome"], "Miingon si Jesus nga bulahan kadtong wala makakita apan nagtuo."],
  ["Sa Daniel 2, unsa ang gihimo sa ulo sa dakong larawan sa damgo ni Nabucodonosor?", "Bulawan", ["Salapi", "Tumbaga", "Puthaw"], "Miingon si Daniel sa hari, “Ikaw mao kining ulo nga bulawan.”"],
  ["Sa Daniel 2, unsa ang mitigbas sa larawan ug mitabon sa tibuok yuta?", "Usa ka bato nga giputol nga walay kamot", ["Usa ka dakong lunop", "Usa ka espada nga kalayo", "Usa ka kusog nga hangin"], "Ang bato nagrepresentar sa walay kataposang gingharian sa Dios nga dili gayod malaglag."],
  ["Sa Daniel 7, pila ka dagko nga mananap ang mitungha gikan sa dagat?", "Upat", ["Tulo", "Pito", "Napulo"], "Sama sa larawan sa Daniel 2, ang upat ka mananap nagpakita sa upat ka sunodsunod nga gahum sa kalibotan."],
  ["Subay sa Daniel 8:14, pila ka adlaw sa dili pa mahinloan ang santuaryo?", "2,300", ["1,260", "1,335", "490"], "Ang mga Adventista nakasabot nga kini nga taas nga tagna moabot sa 1844 ug sa buluhaton ni Kristo sa langitnong santuaryo."],
  ["Asa si Juan sa dihang nadawat niya ang mga panan-awon sa Pinadayag?", "Sa pulo sa Patmos", ["Sa Bukid sa Sinai", "Sa pulo sa Creta", "Sa Babilonia"], "Didto si Juan tungod sa pulong sa Dios ug sa pagpamatuod ni Jesukristo."],
  ["Hain niini ang DILI usa sa pito ka iglesia sa Pinadayag?", "Corinto", ["Efeso", "Smirna", "Laodicea"], "Ang pito mao ang Efeso, Smirna, Pergamo, Tiatira, Sardis, Filadelfia ug Laodicea."],
  ["Unsa ang giingon sa unang anghel sa Pinadayag 14 nga miabot na?", "Ang takna sa Iyang paghukom", ["Ang adlaw sa pahulay", "Ang kombira sa kasal", "Ang kataposan sa gutom"], "Gitawag usab sa unang anghel ang tanan sa pagkahadlok sa Dios, sa pagpasidungog Kaniya, ug sa pagsimba sa Magbubuhat."],
  ["Subay sa Pinadayag 14:12, ang mga santos nagtuman sa mga sugo sa Dios ug adunay unsa?", "Ang pagtuo ni Jesus", ["Ang bahandi sa mga hari", "Ang kaalam ni Solomon", "Ang kusog ni Samson"], "Ang pagtuman ug pagtuo magkauban diha sa mensahe sa kataposang panahon."],
  ["Sa Pinadayag 19:10, ang pagpamatuod ni Jesus mao ang espiritu sa unsa?", "Tagna", ["Kamatuoran", "Kaalam", "Grasya"], "Gihiusa usab sa Pinadayag 12:17 ang pagpamatuod ni Jesukristo sa nahibiling katawhan sa Dios."],
  ["Sumala sa Mateo 24:14, unsa ang angay mahitabo sa dili pa moabot ang kataposan?", "Ang ebanghelyo igawali sa tibuok kalibotan isip pagpamatuod sa tanang nasud", ["Ang tanang gingharian magkahiusa sa usa", "Tukoron pag-usab ang templo", "Ang matag tawo bawtismohan"], "Kini nga bersikulo mao ang nagdasig sa mga Adventista alang sa misyon sa tibuok kalibotan."],
  ["Unsang katapusang saad ang gihimo ni Jesus sa Pinadayag 22:20?", "Sa pagkamatuod moanhi ako sa madali", ["Tukoron ko ang akong iglesia", "Ania ako uban kaninyo kanunay", "Ang kalinaw akong gibilin kaninyo"], "Mitubag si Juan, “Amen. Umari ka, Ginoong Jesus.”"],
  ["Sa Binuhatan 1:11, giunsa pag-ingon sa mga anghel ang pagbalik ni Jesus?", "Sa samang paagi nga mitungas Siya sa langit", ["Isip usa ka masuso sa Betlehem", "Sa tago ngadto sa pipila", "Sa espiritu lamang pinaagi sa iglesia"], "Ang pagbalik ni Jesus personal, makita sa tanan ug mahimayaon (Pinadayag 1:7)."],
  ["Subay sa 1 Tesalonica 4:16, kinsa ang unang mabanhaw sa dihang mokanaog ang Ginoo gikan sa langit?", "Ang mga patay diha kang Kristo", ["Ang mga buhi pa sa yuta", "Ang mga anghel", "Ang mga dautan nga patay"], "Unya ang mga matarong nga buhi pa dad-on uban kanila aron mosugat sa Ginoo."],
  ["Sa Pinadayag 21, unsa ang nakita ni Juan nga mikanaog gikan sa Dios gikan sa langit?", "Ang balaang siyudad, ang Bag-ong Jerusalem", ["Usa ka gamhanang kasundalohan", "Ang arka sa pakigsaad", "Usa ka dakong puti nga trono"], "Maghimo ang Dios og usa ka bag-ong langit ug usa ka bag-ong yuta, ug pahiran ang matag luha."],
  ["Hain nga sugo ang nagsugod sa pulong nga “Handumi”?", "Ang ikaupat (ang Igpapahulay)", ["Ang una (walay laing dios)", "Ang ikalima (tahora ang inyong ginikanan)", "Ang ikanapulo (ayaw pagpangandoy)"], "Ang sugo bahin sa Igpapahulay nagtumong balik sa Paglalang: gihimo sa Dios ang tanan sulod sa unom ka adlaw ug mipahulay sa ikapito."],
  ["Kanus-a unang gipanalanginan ug gibalaan sa Dios ang ikapitong adlaw?", "Sa Paglalang, sa Eden", ["Sa Bukid sa Sinai", "Sa mga adlaw ni Nehemias", "Sa natawo si Jesus"], "Ang Igpapahulay gihatag sa wala pa ang sala ug sa wala pa ang Israel isip nasud."],
  ["Sa Marcos 2:27, para kang kinsa giingon ni Jesus nga gihimo ang Igpapahulay?", "Para sa tawo", ["Para sa Israel lamang", "Para sa mga pari", "Para sa mga anghel"], "Gidugang ni Jesus nga Siya Ginoo usab sa Igpapahulay."],
  ["Unsa ang naandan ni Jesus sa Adlaw nga Igpapahulay?", "Pagsimba sa sinagoga", ["Pagbiyahe ngadto sa Jerusalem", "Pagpuasa nga nag-inusara sa kamingawan", "Pagtrabaho isip panday-kahoy"], "Si Lucas nag-ingon nga sumala sa iyang naandan, misulod siya sa sinagoga sa adlaw nga igpapahulay."],
  ["Human gilubong si Jesus, unsa ang gibuhat sa mga babaye sa Adlaw nga Igpapahulay?", "Mipahulay sumala sa sugo", ["Gihiloan ang Iyang lawas sa lubnganan", "Mibalik sa Galilea", "Nagtudlo sa templo"], "Gituman nila ang Igpapahulay bisan sa ilang kalisod, ug miadto sa lubnganan sa unang adlaw sa semana."],
  ["Diin gisulat sa Dios ang Napulo ka Sugo?", "Sa duha ka papan nga bato", ["Sa mga linukot nga papiro", "Sa mga plato nga tumbaga", "Sa paril sa templo"], "Gisulat kini pinaagi sa tudlo sa Dios."],
  ["Subay sa 1 Mga Hari 8:9, unsa ang diha sa sulod sa arka sa pakigsaad?", "Ang duha ka papan nga bato", ["Ang bulawan nga tangkal sa suga", "Ang tinapay sa atubangan", "Ang abo sa halaran"], "Ang balaod sa Dios anaa sa kinasingkasing sa santuaryo, ilalom sa lingkoranan sa kaluoy."],
  ["Subay sa Hebreo 8:1–2, asa nag-alagad si Jesus isip atong Labawng Pari?", "Sa langitnong santuaryo", ["Sa templo sa Jerusalem", "Sa Bukid sa mga Olibo", "Sa sinagoga sa Nazaret"], "Ang yutan-ong santuaryo kopya ug landong sa mga butang sa langit (Hebreo 8:5)."],
  ["Giunsa pagbatbat ni Jesus ang kamatayon ni Lazaro sa Juan 11:11?", "Pagkatulog", ["Usa ka panaw", "Usa ka silot", "Usa ka kausaban"], "Miingon si Jesus nga ang atong higala nga si Lazaro natulog, ug moadto Siya aron pagmata kaniya."],
  ["Subay sa Ecclesiastes 9:5, unsa ang nahibaloan sa mga patay?", "Walay bisan unsa", ["Tanang butang", "Ang umaabot", "Ang gibuhat sa mga buhi"], "Gitudlo sa Bibliya nga ang mga patay nagapahulay hangtod sa pagkabanhaw sa pagbalik ni Kristo."],
  ["Unsang bahin sa atong kita ang gitawag sa Kasulatan nga ikapulo?", "Ang ikanapulo (usa sa napulo)", ["Ang ikalima", "Ang ikatulo", "Ang katunga"], "Ang ikapulo balaan sa Ginoo ug gibalik Kaniya uban sa pagkamatinud-anon."],
  ["Sa Daniel 1, unsa ang gihangyo ni Daniel nga kan-on puli sa pagkaon sa hari?", "Mga utanon ug tubig", ["Isda ug tinapay", "Dugos ug gatas", "Karnero ug bino"], "Human sa napulo ka adlaw, si Daniel ug ang iyang mga higala daw mas himsog kay sa tanan nga mikaon sa bahin sa hari."],
  ["Unsa ang gitawag ni Pablo sa imong lawas sa 1 Corinto 6:19?", "Ang templo sa Balaang Espiritu", ["Usa ka palas-anon nga dad-on", "Alagad sa hunahuna", "Usa ka tanaman sa kalingawan"], "Busa, matod ni Pablo, ipadayag ang himaya sa Dios diha sa inyong lawas."],
  ["Sa Roma 6:23, unsa ang suhol sa sala?", "Kamatayon", ["Kaulaw", "Pagkadestiyero", "Kasubo"], "Apan ang gasa sa Dios mao ang kinabuhing dayon pinaagi ni Jesukristo nga atong Ginoo."],
  ["Subay sa Roma 6:4, ang bawtismo nagpakita sa paglubong uban kang Kristo aron makalakaw kita sa unsa?", "Bag-ong kinabuhi", ["Kahadlok sa paghukom", "Ang daang pakigsaad", "Hingpit nga kahupayan"], "Ang bawtismo pinaagi sa pagpalumos nagpakita sa kamatayon sa daang kinabuhi ug pagkabanhaw ngadto sa bag-o."],
  ["Unsa nga tuiga nahitabo ang Dakong Pagkadismaya, sa dihang gipaabot sa unang mga Adventista ang pagbalik ni Kristo?", "1844", ["1798", "1863", "1888"], "Oktubre 22, 1844 kadto. Daghan ang nagtuon sa Bibliya ug sa ulahi nakasabot sa mensahe sa santuaryo."],
  ["Unsa nga tuiga pormal nga giorganisar ang Simbahan sa Seventh-day Adventist?", "1863", ["1844", "1888", "1915"], "Giorganisar ang General Conference sa Battle Creek, Michigan."],
  ["Hain nga unang pioneer, kanhi kapitan sa barko, ang nagtabang sa pagpaila sa ikapitong adlaw nga Igpapahulay sa unang mga Adventista?", "Joseph Bates", ["William Miller", "John Harvey Kellogg", "Uriah Smith"], "Si Joseph Bates usa ka co-founder sa Simbahang Adventista uban nila James ug Ellen White."],
  ["Pila ka Pundamental nga Pagtuo ang gitudlo karon sa Simbahan sa Seventh-day Adventist?", "28", ["10", "22", "36"], "Naglakip kini sa Kasulatan, Dios, kaluwasan, iglesia, Igpapahulay, santuaryo, pagbalik ni Kristo ug uban pa."],
  ["Hain nga mag-uuma nga nahimong magwawali ang mipukaw sa pagmata sa Advent sa 1840s sa Amerika?", "William Miller", ["Martin Luther", "John Wesley", "Charles Spurgeon"], "Gitun-an ni Miller ang mga tagna ni Daniel ug mipanudlo nga hapit na ang pagbalik ni Kristo."],
  ["Unsay gitumong sa Advent sa pulong nga Adventista?", "Ang pag-abot ni Kristo", ["Ang Adlaw nga Igpapahulay", "Ang mga gasa sa Espiritu", "Ang Reporma"], "Ang mga Adventista nagtinguha sa bulahan nga paglaum ug sa mahimayaong pagpadayag sa atong Dios ug Manluluwas nga si Jesukristo."],
  /* More questions */
  ["Unsa ang gipadala sa Dios aron pakan-on ang Israel sa kamingawan?", "Manna", ["Mga dulon (locust)", "Tinapay nga sebada", "Isda gikan sa dagat"], "Matag buntag mihugsak ang manna sa palibot sa kampo—tinapay gikan sa langit."],
  ["Kinsa ang unang hari sa Israel?", "Saul", ["David", "Solomon", "Samuel"], "Gidihogan siya ni Samuel sumala sa gitugyan sa Dios."],
  ["Pila ka adlaw ug gabii ang ulan sa panahon sa lunop?", "Kap-atan", ["Pito", "Napulo", "Usa ka gatos"], "Human niini, ang tubig nagpabilin sa yuta sulod sa 150 ka adlaw."],
  ["Hain nga propeta ang gitawag sa Dios isip bata pa sa dihang nadungog niya ang tingog sa kagabhion?", "Samuel", ["Isaias", "Jeremias", "Eliseo"], "Mitubag si Samuel nga mosulti na ang Ginoo kay ang Iyang sulugoon namati."],
  ["Kinsa ang nagpasabot sa sinulat sa bungbong sa kombira ni Belsasar?", "Daniel", ["Ezequiel", "Mardokeo", "Nehemias"], "Ang mga pulong mao ang “Mene, Mene, Tekel, Upharsin”—ug nahulog ang Babilonia nianang gabii."],
  ["Pila ka tinapay ug isda ang gigamit ni Jesus sa pagpakaon sa lima ka libo?", "Lima ka tinapay ug duha ka isda", ["Pito ka tinapay ug pipila ka isda", "Napulo ug duha ka tinapay ug usa ka isda", "Tulo ka tinapay ug lima ka isda"], "Napulo ug duha ka bukag ang nahibilin nga gitigom human niini."],
  ["Unsa ang hitsura sa Espiritu Santo sa dihang mikanaog kang Jesus sa Iyang bawtismo?", "Usa ka salampati", ["Usa ka agila", "Usa ka dila sa kalayo", "Usa ka panganod"], "Gikan sa langit miingon ang Amahan nga Siya ang hinigugma Niyang Anak."],
  ["Asa gisulayan sa yawa si Jesus sulod sa kap-atan ka adlaw?", "Sa kamingawan", ["Sa Tanaman sa Getsemani", "Sa Dagat sa Galilea", "Sa Bukid sa Sinai"], "Gibuntog ni Jesus ang matag pagsulay pinaagi sa pag-ingon, “Nahisulat na.”"],
  ["Unsa ang giingon ni Jesus nga labing dako nga sugo?", "Higugmaa ang Ginoo nga imong Dios sa tibuok nimong kasingkasing, kalag ug hunahuna", ["Tahora ang imong amahan ug inahan", "Handumi ang adlaw nga Igpapahulay", "Ayaw pagpanumbaling sa bakak"], "Ang ikaduha, matod ni Jesus, mao ang paghigugma sa imong silingan sama sa imong kaugalingon."],
  ["Sa Juan 14:15, miingon si Jesus, “Kon nahigugma kamo kanako…” unsa?", "tumana ang akong mga sugo", ["hatagi ako og daghang kuwarta", "tukora ako og templo", "magpuasa matag adlaw"], "Ang gugma ug pagtuman maghiusa. Ang pagtuman mao ang bunga sa gugma."],
  ["Subay sa Juan 1:1–3, kinsa ang naglalang sa tanang butang?", "Ang Pulong, nga mao si Jesus", ["Ang mga anghel", "Ang mga propeta", "Ang kinaiyahan mismo"], "Ang tanang butang gibuhat pinaagi Kaniya. Si Jesus mao ang atong Magbubuhat ug Manluluwas."],
  ["Unsa ang giingon sa Hebreo 4:9 nga nahabilin alang sa katawhan sa Dios?", "Usa ka pahulay", ["Usa ka templo", "Usa ka gingharian", "Usa ka halad"], "Daghang estudyante sa Bibliya ang nakakita niini nga bersikulo sa pagtuman sa Igpapahulay."],
  ["Kinsa nga co-founder sa Simbahang Adventista ang nagsulat sa librong “Steps to Christ”?", "Ellen G. White", ["Joseph Bates", "J. N. Andrews", "Uriah Smith"], "Kini usa ka hinigugma nga pasiuna sa gugma ni Jesus."],
  ["Unsa ang labing taas nga lebel sa organisasyon sa Simbahang Adventista?", "Ang General Conference", ["Ang Synod", "Ang Diocese", "Ang Presbytery"], "Ang mga lokal nga iglesia naghiusa sa mga conference, ug kining tanan nagkahiusa isip usa ka pamilya sa tibuok kalibotan."],
  ["Kinsa ang igsoon ni Moises nga nagsulti alang kaniya ngadto kang Faraon?", "Aaron", ["Josue", "Caleb", "Eleazar"], "Gipadala sa Dios si Aaron aron mosulti alang kang Moises, kay gibati ni Moises nga dili siya maayong manulti."],
  ["Hain nga siyudad ang mga paril nahugno human naglibot ang Israel niini sulod sa pito ka adlaw?", "Jerico", ["Ai", "Betel", "Hebron"], "Sa ikapitong adlaw pito ka higayon sila naglibot, misinggit, ug natumba ang paril."],
  ["Hain nga babaye ang nag-ampo og anak ug human niini gihatag kini sa pag-alagad sa Dios sa tabernakulo?", "Ana", ["Sara", "Raquel", "Rebeca"], "Ang iyang anak mao si Samuel, nga midako nga nag-alagad sa Ginoo."],
  ["Kinsa ang miingon kang Noemi, “Ang imong katawhan mao ang akong katawhan, ug ang imong Dios mao ang akong Dios”?", "Rut", ["Orpa", "Ester", "Rahab"], "Si Rut, usa ka Moabihanon, mipili sa pagsunod sa tinuod nga Dios ug nahimong katigulangan ni Haring David."],
  ["Pila ang mga anak nga lalaki ni Jacob?", "Napulog duha", ["Napulo", "Pito", "Napulog upat"], "Ang iyang napulog duha ka anak nahimong napulog duha ka tribo sa Israel."],
  ["Unsang tanaman ang gibutang sa Dios kang Adan ug Eva?", "Eden", ["Getsemani", "Carmelo", "Gosen"], "Gitanom sa Dios ang tanaman sa Eden sa sidlakan ug didto gibutang ang tawo."],
  ["Sa Bukid sa Carmelo, hain nga propeta ang naghagit sa mga propeta ni Baal?", "Elias", ["Eliseo", "Isaias", "Samuel"], "Mitugpa ang kalayo gikan sa langit, ug misinggit ang katawhan, “Ang Ginoo, siya mao ang Dios.”"],
  ["Kinsa ang nanguna sa pagtukod pag-usab sa mga paril sa Jerusalem, nga nahuman sulod lamang sa 52 ka adlaw?", "Nehemias", ["Esdras", "Zorobabel", "Ageo"], "Si Nehemias nag-ampo ug nagplano, ug ang katawhan nagtinabangay sa pagtrabaho sa tibuok nilang kasingkasing."],
  ["Kinsa ang nawad-an og mga anak ug bahandi apan miingon, “Ang Ginoo ang naghatag, ug ang Ginoo ang nagkuha”?", "Job", ["Jacob", "Ezequias", "Jeremias"], "Nagpabilin nga matinud-anon si Job, ug sa ulahi gibalik sa Dios ang iyang mga bahandi."],
  ["Unsay gisugo sa Dios sa Israel nga tukoron aron makapuyo Siya taliwala nila?", "Usa ka santuaryo", ["Usa ka palasyo", "Usa ka dakong paril", "Usa ka tore nga bato"], "Ang santuaryo nagtudlo sa Israel bahin sa presensya sa Dios ug sa Iyang plano sa pagluwas sa mga makasasala."],
  ["Unsay gisulayan sa katawhan nga tukoron sa Babel aron makaabot sa langit?", "Usa ka tore", ["Usa ka tulay", "Usa ka dakong paril", "Usa ka halaran"], "Gikalibog sa Dios ang ilang pinulongan, ug nagkatibulaag sila sa tibuok yuta."],
  ["Kinsa ang kaluha nga igsoon ni Jacob?", "Esau", ["Laban", "Ismael", "Ruben"], "Gibaligya ni Esau ang iyang katungod isip panganay alang sa usa ka panaksan nga sinabawan."],
  ["Hain nga propeta ang nag-ampo nga maablihan ang mga mata sa iyang sulugoon aron makita ang mga kabayo ug karwahe nga kalayo?", "Eliseo", ["Elias", "Isaias", "Jeremias"], "Miingon si Eliseo, “Mas daghan kadtong atua kanato kay kanila.”"],
  ["Uban sa 300 lamang ka tawo, unsay gidala sa mga sundalo ni Gideon batok sa Madian?", "Mga trumpeta, banga, ug sulo", ["Mga espada ug taming", "Mga tirador ug bato", "Mga karwahe ug bangkaw"], "Gihatag sa Dios ang kadaugan aron mahibalo ang Israel nga ang gahom iya Niya."],
  ["Hain nga anghel ang nagmantala kang Maria nga manganak siya kang Jesus?", "Gabriel", ["Miguel", "Rafael", "Uriel"], "Miingon si Gabriel, “Ngalanan mo siyag JESUS.”"],
  ["Unsa nga mga gasa ang gidala sa mga maalamon nga tawo ngadto sa bata nga si Jesus?", "Bulawan, insenso, ug mira", ["Plata, bino, ug lana", "Tinapay, isda, ug dugos", "Delak, mga panakot, ug asin"], "Misimba sila Kaniya ug gibuksan ang ilang mga bahandi."],
  ["Kinsa ang mibudhi kang Jesus sa Iyang mga kaaway alang sa katloan ka pirasong plata?", "Judas Iskariote", ["Tomas", "Andres", "Bartolome"], "Nagbasol si Judas sa ulahi, apan ulahi na kaayo aron mabawi pa kini."],
  ["Kinsa ang mihunong sa pagtabang sa nasamdan nga tawo sa sambingay ni Jesus bahin sa maluluy-ong Samarianhon?", "Usa ka Samarianhon", ["Usa ka pari", "Usa ka Levihanon", "Usa ka Pariseo"], "Gitapos ni Jesus ang sambingay sa pag-ingon, “Lakaw ug buhata usab kana.”"],
  ["Unsay giingon ni Jesus sa mabangis nga dagat sa Lawa sa Galilea?", "“Hilom! Pagmalinawon!”", ["“Gawas!”", "“Mahimong may kahayag”", "“Sunod kanako”"], "Mihunong ang hangin ug nahimong hilom kaayo."],
  ["Hain nga apostol ang nagsulat sa kinadak-ang gidaghanon sa mga sulat sa Bag-ong Tugon?", "Pablo", ["Pedro", "Juan", "Santiago"], "Nagsulat si Pablo sa mga iglesia ug mga higala gikan sa daghang dapit, bisan sa bilanggoan."],
  ["Hain nga tinun-an ang migawas sa sakayan ug naglakaw sa tubig padulong kang Jesus?", "Pedro", ["Juan", "Andres", "Santiago"], "Nagsugod sa paglumos si Pedro sa pagtan-aw niya sa mga balod, ug gikuptan siya ni Jesus."],
  ["Hain nga Maayong Balita ang gisulat sa usa ka kanhi maniningil og buhis?", "Mateo", ["Marcos", "Lucas", "Juan"], "Gitawag ni Jesus si Mateo gikan sa iyang lingkoranan sa buhis, ug gibiyaan niya ang tanan aron mosunod Kaniya."],
  ["Unsay nagpakita sa ibabaw sa mga ulo sa mga tinun-an sa Adlaw sa Pentekostes?", "Mga dila nga daw kalayo", ["Mga salampati nga kahayag", "Usa ka balangaw", "Usa ka haligi sa panganod"], "Napuno sila sa Balaang Espiritu ug nagsugod sa pagsulti sa ubang mga pinulongan."],
  ["Kinsa ang gobernador Romano nga nagsugo nga ilansang si Jesus?", "Poncio Pilato", ["Cesar Augusto", "Felix", "Festo"], "Naghugas si Pilato sa iyang mga kamot, apan gihatag gihapon niya ang sugo."],
  ["Hain nga kauban ni Pablo ang miawit og pagdayeg uban niya sa bilanggoan sa Filipos?", "Silas", ["Timoteo", "Bernabe", "Lucas"], "Gibukhad sa linog ang mga pultahan, ug mituo ang magbalantay sa bilanggoan."],
  ["Pila ka higayon giingon ni Jesus nga kinahanglan natong pasayloon ang nakasala kanato?", "Kapitoan ka higayon nga kapito", ["Pito ka higayon", "Tulo ka higayon", "Kausa lang"], "Walay kinutoban ang pagpasaylo."],
  ["Unsay gihimo sa amahan sa pagkakita niya sa iyang nawala nga anak nga mopauli?", "Midagan siya ug gigakos ang iyang anak", ["Gipapahawa niya ang iyang anak", "Naghulat siya sa balay", "Mihangyo siya og bayad"], "Gidawat sa amahan ang iyang anak uban ang bisti, singsing, ug salo-salo."],
  ["Kinsa ang nagsulat sa libro sa Binuhatan?", "Lucas", ["Pedro", "Pablo", "Juan"], "Gisulatan ni Lucas si Teofilo sa iyang Maayong Balita ug sa Binuhatan."],
  ["Kinsa ang amahan ni Juan Bautista?", "Zacarias", ["Jose", "Simeon", "Nicodemo"], "Gisultihan sa anghel si Zacarias nga manganak ang iyang asawa nga si Elisabet og usa ka anak nga lalaki."],
  ["Sa Daniel 3, unsay gisugo sa tanan sa pagpatugtog sa musika?", "Moluhod sa bulawanong larawan", ["Maghalad og nating karnero sa halaran", "Moawit sa awit sa adlawng natawhan sa hari", "Magdala og mga gasa sa rayna"], "Si Sadrac, Mesac, ug Abednego mibalibad sa pagluhod ug gisalibay sa hudno."],
  ["Sa Daniel 4, unsay nahitabo kang Haring Nabucodonosor tungod sa iyang garbo?", "Nagpuyo siya nga daw mananap sa kapatagan", ["Gibilanggo siya sa Ehipto", "Nabuta siya sa iyang palasyo", "Nawala ang iyang gingharian ngadto sa iyang anak"], "Nahibalik ang iyang pangatarungan human sa pipila ka panahon, ug iyang gidayeg ang Labing Hataas."],
  ["Sa Daniel 6, kinsa ang nanglimbong kang Haring Dario aron pirmahan ang sugo batok sa pag-ampo?", "Mga opisyal nga naimbidoso", ["Ang tulo ka higala ni Daniel", "Ang inahan sa rayna", "Ang mga pari sa templo sa Juda"], "Wala silay nakitang sayop kang Daniel gawas sa iyang pagkamatinud-anon sa Dios."],
  ["Sa Daniel 2, unsay gihimo sa tiil sa dakong larawan?", "Puthaw nga gisagolan og lapok", ["Lunsay nga bulawan", "Tumbaga ug plata", "Kahoy ug bato"], "Ang gisagol nga mga tiil nagpakita sa gibahin nga kalibotan hangtod moabot ang gingharian sa Dios."],
  ["Sa Daniel 2, unsang gingharian ang girepresentahan sa dughan ug mga bukton nga plata?", "Medo-Persia", ["Babilonia", "Gresya", "Roma"], "Gingalanan sa Daniel 8:20 ang mga hari sa Media ug Persia."],
  ["Unsang adlawa miingon si Juan nga siya “diha sa Espiritu” sa dihang nadawat niya ang Pinadayag?", "Ang adlaw sa Ginoo", ["Ang Paskuwa", "Ang Pentekostes", "Ang Adlaw sa Pagpasaylo"], "Nakita sa mga Adventista nga mao kini ang Igpapahulay, nga gitawag sa Kasulatan nga adlaw sa Ginoo (Isaias 58:13)."],
  ["Sa hain nga iglesia miingon si Jesus, “Tan-awa, nagatindog ako sa pultahan ug nagatuktok”?", "Laodicea", ["Efeso", "Smirna", "Sardis"], "Nanaad si Jesus nga mosulod ug mokaon uban sa si bisan kinsa nga moabli sa pultahan."],
  ["Pila ang gisilyohan gikan sa mga tribo sa Israel sa Pinadayag 7?", "144,000", ["7,000", "24,000", "1,000"], "Gimarkahan sila sa silyo sa Dios sa ilang agtang."],
  ["Sa Pinadayag 21:4, unsay papahawaon sa Dios gikan sa atong mga mata?", "Ang tanang luha", ["Ang tanang abog", "Ang tanang katulog", "Ang tanang landong"], "Wala na ang kamatayon, kasubo, paghilak, o kasakit."],
  ["Sa Pinadayag 22:1, unsay nakita ni Juan nga migawas gikan sa trono sa Dios?", "Usa ka lunsay nga suba sa tubig nga nagahatag og kinabuhi", ["Usa ka bulawanong hagdanan", "Usa ka nagadilaab nga espada", "Usa ka kusog nga hangin"], "Sa duha ka daplin sa suba nagtindog ang kahoy sa kinabuhi."],
  ["Sa Daniel 7:13–14, kinsa ang moabot uban sa mga panganod sa langit aron modawat og walay katapusang gingharian?", "Ang usa nga sama sa Anak sa Tawo", ["Ang gamay nga sungay", "Ang ikaupat nga mananap", "Usa ka dakong agila"], "Gigamit ni Jesus ang samang titulo alang sa Iyang kaugalingon sa dihang nagsulti Siya sa Iyang pagbalik."],
  ["Kinsa ang giawhag sa unang anghel sa Pinadayag 14 nga atong simbahon?", "Siya nga naghimo sa langit, yuta, dagat, ug mga tuboran sa tubig", ["Ang mga propeta ug mga apostol", "Ang mga hari sa yuta", "Ang pito ka iglesia"], "Kini nagpahinumdom sa Paglalang ug sa sugo sa Igpapahulay."],
  ["Sa Pinadayag 5, kinsa ang nakaplagan nga takos sa pag-abli sa linukot nga basahon nga may pito ka silyo?", "Ang Kordero", ["Usa ka anghel", "Moises", "Miguel"], "Ang Leon sa Juda mao usab ang Kordero nga gihalad."],
  ["Sa Daniel 9, unsay gihimo ni Daniel sa dihang nasabtan niya nga natapos na ang kapitoan ka tuig?", "Nag-ampo siya ug miangkon sa mga sala sa iyang katawhan", ["Nagtukod siya og bag-ong templo", "Gipangulohan niya ang katawhan pagpauli", "Misulat siya kang Haring Ciro"], "Miabot ang anghel nga si Gabriel samtang nag-ampo pa si Daniel."],
  ["Unsang adlawa sa Semana sa Paglalang gibutang sa Dios ang adlaw, bulan, ug mga bituon sa langit?", "Ang ikaupat nga adlaw", ["Ang ikaduhang adlaw", "Ang ikaunom nga adlaw", "Ang unang adlaw"], "Ang kahayag unang miabot, ug sa ikaupat nga adlaw gibutang ang adlaw, bulan, ug mga bituon sa langit."],
  ["Hain nga sugo ang gitawag ni Pablo nga “unang sugo nga may saad”?", "Tahora ang imong amahan ug inahan", ["Hinumdomi ang adlaw nga Igpapahulay", "Ayaw pagpangawat", "Ayaw pagpatay"], "Ang saad mao ang kaayohan ug taas nga kinabuhi dinhi sa yuta."],
  ["Unsay gihuypan sa Dios sa mga buho sa ilong ni Adan aron mahimo siyang buhing kalag?", "Ang gininhawa sa kinabuhi", ["Ang Balaang Espiritu", "Usa ka bag-ong ngalan", "Kaalam"], "Gihimo sa Dios si Adan gikan sa abog, unya gihuypan Niya sa kinabuhi."],
  ["Sa Juan 14:3, nanaad si Jesus, “Mobalik ako ug…” unsa?", "dawaton ko kamo nganhi kanako", ["magatukod ako og templo sa Jerusalem", "hatagan ko kamo og dakong bahandi", "himoon ko kamong mga hari sa yuta"], "Ang saad ni Jesus mao ang bulahan nga paglaum sa matag Kristohanon."],
  ["Suno sa Exodo 20:11, nganong gipanalanginan sa Ginoo ang adlaw nga Igpapahulay?", "Mipahulay Siya human sa paglalang sa langit ug yuta", ["Nakasala si Adan", "Mihunong ang lunop", "Natawo si Jacob"], "Ang Igpapahulay mao ang handumanan sa Paglalang."],
  ["Suno sa Efeso 2:8, unsa ang nagluwas kanato?", "Ang grasya, pinaagi sa pagtuo", ["Ang atong maayong mga buhat", "Ang pagsunod sa tradisyon sa pamilya", "Ang pagkahimugso sa Kristohanong panimalay"], "Ang kaluwasan gasa sa Dios, dili butang nga atong makuha pinaagi sa paningkamot."],
  ["Sa Pag-ampo sa Ginoo, unsang mga pulong ang mosunod sa “Amahan namo nga atua sa langit”?", "Pagabalaanon ang imong ngalan", ["Ihatag kanamo karon ang among inadlaw-adlaw nga pagkaon", "Umabot ang imong gingharian", "Pasayloa kami sa among mga utang"], "Gitudloan kita ni Jesus sa pagsugod sa pag-ampo pinaagi sa pagpasidungog sa Dios."],
  ["Suno sa Hebreo 11:6, kon walay pagtuo dili mahimo ang unsa?", "Ang pagpahimuot sa Dios", ["Ang pagpuasa ug pag-ampo", "Ang pagbasa sa Biblia", "Ang paghatag og mga halad"], "Ang pagtuo mao ang pagsalig nga ang Dios tinuod ug nagabalus sa mga mangita Kaniya."],
  ["Suno sa Mateo 6:33, unsay unahon nato pagpangita?", "Ang gingharian sa Dios ug ang Iyang pagkamatarong", ["Bahandi ug dungog", "Kaalam ug taas nga kinabuhi", "Maayong ngalan"], "Nanaad si Jesus nga idugang kanato ang tanan nga gikinahanglan nato."],
  ["Suno sa 1 Juan 4:8, ang Dios mao ang unsa?", "Gugma", ["Natago", "Halayo", "Masuk-anon"], "Gipakita sa Dios ang Iyang gugma pinaagi sa pagpadala kang Jesus (1 Juan 4:9)."],
  ["Suno sa Salmo 119:105, ang pulong sa Dios maoy suga sa atong…?", "tiil", ["kamot", "igdulungog", "panimalay"], "Ang Biblia nagasiga sa dalan aron makita nato kon asa maglakaw."],
  ["Suno sa Malaquias 3:10, ang tibuok ikapulo kinahanglang dad-on sa unsa?", "Balay-tipiganan", ["Merkado", "Palasyo", "Kamingawan"], "Nanaad ang Dios nga abliban ang mga bintana sa langit uban ang panalangin."],
  ["Unsay giingon ni Pedro nga buhaton aron madawat ang gasa sa Balaang Espiritu?", "Maghinulsol ug magpabunyag", ["Palita kini pinaagi sa mga halad", "Mopuasa sulod sa kap-atan ka adlaw", "Motukod og simbahan"], "Mga tulo ka libo ang gibunyagan niadtong adlawa (Binuhatan 2:41)."],
  ["Unsay gihimo ni Jesus sa Iyang mga tinun-an sa Katapusang Panihapon aron ipakita ang mapaubsanong pag-alagad?", "Gihugasan Niya ang ilang mga tiil", ["Gihaplasan Niya ang ilang mga ulo og lana", "Gihatagan Niya sila og bag-ong bisti", "Gilutoan Niya sila og isda"], "Miingon si Jesus, “Naghatag ako kaninyo og panig-ingnan.” Gituman kini sa mga Adventista isip ordinansa sa pagpaubos."],
  ["Kinsa ang napili nga unang presidente sa General Conference niadtong 1863?", "John Byington", ["James White", "Joseph Bates", "J. N. Andrews"], "Si Byington usa ka ministro sa Metodista sa wala pa moapil sa mga Adventista."],
  ["Hain nga lungsod sa Michigan ang gihimong punoan sa unang mga Adventista ug adunay inila nga sanitaryum?", "Battle Creek", ["Detroit", "Lansing", "Ann Arbor"], "Ang punoan sa iglesia nagpabilin sa Battle Creek hangtod sa 1903."],
  ["Kinsa ang bana ni Ellen G. White ug usa sa mga nagtukod sa iglesia sa mga Adventista?", "James White", ["John Byington", "Hiram Edson", "Uriah Smith"], "Si James ug Ellen ang nanguna sa unang buluhatong pagmantala."],
  ["Unsa ang ngalan sa ahensya sa mga Adventista nga nagatabang sa mga biktima sa kalamidad ug kakabos?", "ADRA", ["UNICEF", "Red Cross", "Caritas"], "Ang ADRA kay Adventist Development and Relief Agency."],
  ["Unsa ang ngalan sa semana nga pagtuon sa Biblia sa mga Adventista sa buntag sa Igpapahulay?", "Sabbath School", ["Bakasyon nga Eskwelahan sa Biblia", "Tigom sa Pag-ampo", "Pathfinders"], "Ang Sabbath School adunay pagtuon sa leksyon, mga sugilanon sa misyon, ug mga awit alang sa tanang edad."],
  ["Hain nga club sa kabatan-onan sa mga Adventista alang sa edad nga 10 hangtod 15?", "Pathfinders", ["Adventurers", "Sabbath Scouts", "Youth Guard"], "Ang mga Pathfinder nagakat-on og pagpangulo, kahanas sa gawas, ug pag-alagad."],
  ["Sa unsang tuiga gipili sa unang mga Adventista ang ngalan nga “Seventh-day Adventist”?", "1860", ["1844", "1888", "1901"], "Opisyal nga natukod ang iglesia tulo ka tuig sa ulahi, niadtong 1863."],
  ["Kinsa ang nagpaambit sa ikapitong adlaw nga Igpapahulay ngadto sa grupo sa mga Adventista sa Washington, New Hampshire, niadtong 1844?", "Rachel Oakes Preston", ["Ellen G. White", "Clara Barton", "Harriet Tubman"], "Usa siya ka Seventh Day Baptist. Ang iyang pagpamatuod nakapabantay kang Pastor Frederick Wheeler sa pagtuman sa Igpapahulay."],
  ["Unsa ang ngalan sa pangkalibotang network sa telebisyon sa mga Adventista?", "Hope Channel", ["Daystar", "Trinity Broadcasting", "Family Radio"], "Ang Hope Channel nagapaambit og mga mensahe sa paglaum sa daghang pinulongan sa tibuok kalibotan."],
  ["Unsang gasa ang gituohan sa mga Adventista nga gipakita sa ministeryo ni Ellen G. White?", "Ang gasa sa panagna", ["Ang gasa sa pagpang-ayo", "Ang gasa sa mga dila", "Ang gasa sa mga milagro"], "Ang Pinadayag 19:10 nag-ingon nga ang pagpamatuod ni Jesus mao ang espiritu sa panagna."],
  ["Hain nga unibersidad sa mga Adventista sa California ang inila tungod sa medikal nga sentro niini?", "Loma Linda University", ["Andrews University", "Oakwood University", "Walla Walla University"], "Ang Loma Linda naghanas og mga propesyonal sa panglawas gikan sa tibuok kalibotan."],
  ["Kaninong kasinatian sa uma sa mais niadtong Oktubre 23, 1844 ang nagdala sa bag-ong pagsabot bahin sa santuaryo?", "Hiram Edson", ["William Miller", "Joseph Bates", "James White"], "Nasabtan niya nga si Jesus misugod sa bag-ong bahin sa Iyang ministeryo sa langitnong santuaryo, ug wala mobalik sa yuta."],
  ["Kinsa ang unang opisyal nga misyonaryo sa mga Adventista nga gipadala sa gawas sa nasud niadtong 1874?", "J. N. Andrews", ["Joseph Bates", "John Byington", "Uriah Smith"], "Miadto siya sa Switzerland."],
  ["Hain nga doktor ang nanguna sa inila nga Battle Creek Sanitarium?", "Dr. John Harvey Kellogg", ["Dr. Ben Carson", "Dr. Charles Mayo", "Dr. Jonas Salk"], "Gipasiugda sa sanitaryum ang mensahe sa mga Adventista bahin sa panglawas."],
  ["Sa unsang tuiga misugod ang buluhatong Adventista sa Pilipinas?", "1905", ["1863", "1888", "1925"], "Si Robert A. Caldwell miabot sa Manila niadtong 1905, ug ang unang simbahan sa mga Pilipino natukod niadtong 1911."]
];

/* ---------- Building a round ---------- */
function qItem(q) {
  const useC = LANG === 'ceb' && q.ceb;
  const L = useC ? q.ceb : q;
  const opts = shuffle([L.a, ...L.w]);
  return { c: q.c, q: L.q, opts, ci: opts.indexOf(L.a), r: useC ? refCeb(q.r) : q.r, n: L.n };
}

function startGame(mode, cat, names) {
  stopTimer();
  S = freshState(mode, cat, names);
  setChrome('play');
  if (mode === 'quiz' || mode === 'duel') {
    const pool = cat === 'all' ? QUIZ : QUIZ.filter(q => q.c === cat);
    let n = mode === 'duel' ? 10 : SOLO_N.quiz;
    n = Math.min(n, pool.length);
    if (mode === 'duel' && n % 2) n--;
    S.items = shuffle(pool).slice(0, n).map(qItem);
  } else if (mode === 'verse') {
    S.items = shuffle(VERSES).slice(0, SOLO_N.verse).map(v => {
      const opts = shuffle([v.a, ...v.d]);
      return Object.assign({}, v, { opts, ci: opts.indexOf(v.a) });
    });
  } else if (mode === 'who') {
    S.items = shuffle(WHO).slice(0, SOLO_N.who).map(w => {
      const idx = WHO.indexOf(w), c = LANG === 'ceb';
      const nameOf = x => c ? CEB_WHO[WHO.indexOf(x)].n : x.n;
      const others = shuffle(WHO.filter(x => x !== w)).slice(0, 3).map(nameOf);
      const name = c ? CEB_WHO[idx].n : w.n;
      const opts = shuffle([name, ...others]);
      return { n: name, r: c ? refCeb(w.r) : w.r, cl: c ? CEB_WHO[idx].c : w.c, opts, ci: opts.indexOf(name) };
    });
  } else {
    S.items = BOOK_SIZES.map(size => {
      const idx = shuffle(BOOKS_EN.map((_, i) => i)).slice(0, size).sort((a, b) => a - b);
      let tiles = shuffle(idx);
      for (let tries = 0; tries < 5 && tiles.every((b, k) => b === idx[k]); tries++) tiles = shuffle(idx);
      return { idx, tiles };
    });
  }
  renderStep();
}

/* ---------- HUD ---------- */
function hud() {
  const total = S.items.length, label = S.mode === 'books' ? t('round') : t('m_' + S.mode + '_t');
  const prog = `<div class="prog"><i style="width:${(S.i / total) * 100}%"></i></div>`;
  if (S.mode === 'duel') {
    const p = i => `<div class="pl ${S.turn === i ? 'on' : ''}"><span>${esc(S.names[i])}</span><b id="ps${i}">${S.ps[i]}</b></div>`;
    return `<div class="duelhud">${p(0)}${p(1)}</div><div class="hud"><div>${label} · <b>${S.i + 1}</b> / ${total}</div></div>${prog}`;
  }
  return `
    <div class="hud">
      <div>${label} · <b>${S.i + 1}</b> / ${total}</div>
      <div class="hs"><span>${t('score')} <b id="sc">${S.score}</b></span>${isQ() && S.streak > 1 || S.mode === 'verse' && S.streak > 1 ? `<span class="streak">${t('streak')} ×${S.streak}</span>` : ''}</div>
    </div>${prog}`;
}
function updateHud() {
  if (S.mode === 'duel') { [0, 1].forEach(i => { const e = document.getElementById('ps' + i); if (e) e.textContent = S.ps[i]; }); }
  else { const e = document.getElementById('sc'); if (e) e.textContent = S.score; }
}

function renderStep() {
  stopTimer();
  S.answered = false; S.usedFifty = false; S.clue = 0; S.gone = new Set(); S.placed = []; S.checked = false;
  S.turn = S.mode === 'duel' ? S.i % 2 : 0;
  if (S.mode === 'duel') renderPass();
  else if (S.mode === 'quiz') renderQuestion();
  else if (S.mode === 'verse') renderVerse();
  else if (S.mode === 'who') renderWho();
  else renderBooks();

function renderBooks() {
  const it = S.items[S.i], n = it.idx.length, names = BOOKS();

    const cls = S.checked ? (it.idx[k] === b ? 'slot full good' : 'slot full bad') : 'slot full';
    const label = S.checked ? `<span class="bk">${names[b]}</span>` : `<button class="slotbtn" data-act="unplace" data-k="${k}">${names[b]}</button>`;
    return `<li class="${cls}"><span class="num">${k + 1}</span>${label}</li>`;
  }).join('');

function startTimer() {
  const bar = document.getElementById('tbar'), total = 20000, t0 = Date.now();
  S.timer = setInterval(() => {
    const left = Math.max(0, total - (Date.now() - t0));
    S.timeLeft = left / 1000;
    if (bar) { bar.style.width = (left / total * 100) + '%'; bar.classList.toggle('low', left < 6000); }
    if (left <= 0) answer(-1);
  }, 100);
}

/* ---------- Answers ---------- */
function feedback(ok, pts, ref, note, timeout) {
  const last = S.i >= S.items.length - 1;
  const head = ok ? t('ok') : (timeout ? t('timeUp') : t('no'));
  return `
    <div class="fb ${ok ? 'ok' : 'no'}">
      <h3>${head} ${ok ? `<span class="pts">+${pts}</span>` : ''}</h3>
      <div class="ref">${ref}</div>
      ${note ? `<p>${note}</p>` : ''}
      <div class="row"><button class="primary" data-act="next">${last ? t('seeResults') : t('next')}</button></div>
    </div>`;
}
function lockOptions(correctK, pickedK) {
  document.querySelectorAll('#opts .opt').forEach((b, k) => {
    b.disabled = true;
    if (k === correctK) b.classList.add('right');
    else if (k === pickedK) b.classList.add('wrong');
  });
}
function showFb(html) {
  const fb = document.getElementById('fb');
  fb.innerHTML = html;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function answer(k) {
  if (S.answered) return;
  const it = S.items[S.i];

  if (S.mode === 'who') {
    if (k === it.ci) {
      S.answered = true;
      const pts = CLUE_PTS[S.clue];
      S.score += pts; S.correct++;
      revLog({ q: (it.cl || []).join(' · '), a: it.opts[it.ci], chosen: it.opts[it.ci], ok: true, ref: it.r });
      lockOptions(it.ci, -1);
      document.querySelectorAll('#opts .opt').forEach(b => b.classList.remove('gone'));
      const tl = document.querySelector('.tools'); if (tl) tl.innerHTML = '';
      updateHud();
      showFb(feedback(true, pts, it.n + ' · ' + it.r, ''));
    } else {
      S.gone.add(k);
      if (S.clue < 3) { S.clue++; renderWho(); }
      else {
        S.answered = true;
        revLog({ q: (it.cl || []).join(' · '), a: it.opts[it.ci], chosen: it.opts[k], ok: false, ref: it.r });
        lockOptions(it.ci, k);
        const tl = document.querySelector('.tools'); if (tl) tl.innerHTML = '';
        showFb(feedback(false, 0, t('itWas') + it.n + ' · ' + it.r, ''));
      }
    }
    return;
  }

  S.answered = true; stopTimer();
  const ok = k === it.ci, duel = S.mode === 'duel', p = S.turn;
  let pts = 0;
  const streak = duel ? S.pstreak[p] : S.streak;
  if (ok) {
    pts = 100 + Math.min(streak, 5) * 10;
    if (isQ()) pts += Math.round((S.timeLeft / 20) * 50);
    if (duel) { S.ps[p] += pts; S.pcorrect[p]++; S.pstreak[p]++; }
    else { S.score += pts; S.correct++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); }
  } else if (duel) S.pstreak[p] = 0; else S.streak = 0;
  lockOptions(it.ci, k);
  const f = document.getElementById('fifty'); if (f) f.disabled = true;
  updateHud();
  if (!duel) {
    if (S.mode === 'verse') revLog({ q: it.t.replace('___', '_____'), a: it.a, chosen: k === -1 ? null : it.opts[k], ok: ok, ref: it.r });
    else revLog({ q: it.q, a: it.opts[it.ci], chosen: k === -1 ? null : it.opts[k], ok: ok, ref: it.r, note: it.n });
  }

  if (isQ()) {
    showFb(feedback(ok, pts, it.r, it.n, k === -1));
  } else {
    const b = document.getElementById('blank');
    if (b) { b.textContent = it.a; b.className = 'filled'; }
    showFb(feedback(ok, pts, it.r + ' (KJV)', ''));
  }
}

function fifty() {
  if (S.answered || S.usedFifty || S.lifelines < 1 || S.mode !== 'quiz') return;
  S.usedFifty = true; S.lifelines--;
  const it = S.items[S.i];
  const wrong = shuffle(it.opts.map((_, k) => k).filter(k => k !== it.ci)).slice(0, 2);
  const btns = document.querySelectorAll('#opts .opt');
  wrong.forEach(k => { btns[k].disabled = true; btns[k].classList.add('gone'); });
  const f = document.getElementById('fifty');
  f.disabled = true; f.textContent = t('lifeLeft')(S.lifelines);
}

function checkBooks() {
  const it = S.items[S.i];
  if (S.checked || S.placed.length !== it.idx.length) return;
  const right = it.idx.filter((b, k) => S.placed[k] === b).length;
  S.lastPerfect = right === it.idx.length;
  S.lastPts = right * 20 + (S.lastPerfect ? 50 : 0);
  S.score += S.lastPts; if (S.lastPerfect) S.correct++;
  S.checked = true;
  const bn = BOOKS();
  revLog({ q: t('booksQ'), a: it.idx.map(b => bn[b]).join('  →  '), chosen: S.placed.map(b => bn[b]).join('  →  '), ok: S.lastPerfect });
  renderBooks();
}

function next() {
  S.i++;
  if (S.i >= S.items.length) (S.mode === 'duel' ? renderDuelResults : renderResults)(); else renderStep();
}

function revLog(entry) { if (S && S.log) S.log.push(entry); }
function reviewKey() { return 'reviews_' + ((GI && GI.me && GI.me.id) || 'me'); }
function reviewList() { const l = store.get(reviewKey(), []); return Array.isArray(l) ? l : []; }
function saveReview() {

}

  catch (e) { return d.toLocaleString(); }
}

const CFG = window.CHURCH_CONFIG || {};
const TOKEN = (() => { try { return localStorage.getItem('tubodToken') || ''; } catch (e) { return ''; } })();
let VIEW = 'home';
async function gapi(action, data = {}) {
  if (!CFG.API_URL || !TOKEN) { const e = new Error('signin'); e.code = 'auth'; throw e; }
  let res;
  try { res = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: TOKEN }, data)) }); }
  catch (e) { const err = new Error('network'); err.code = 'network'; throw err; }
  const j = await res.json().catch(() => ({ ok: false, error: 'bad reply' }));
  if (!j.ok) { const err = new Error(j.error || 'error'); err.code = j.code; throw err; }
  return j;
}
let GI = store.get('gi', null);
if (!TOKEN) GI = null;
const isAdmin = () => !!(GI && GI.me && GI.me.access === 'admin');
async function loadGI(rerender) {
  if (!TOKEN || !CFG.API_URL) return;
  try {
    GI = await gapi('gameInfo'); GI.at = Date.now(); store.set('gi', GI);
    if (rerender && VIEW === 'home') renderHome();
    if (rerender && VIEW === 'board') renderBoard();
  } catch (e) {
    if (e.code === 'auth' || e.code === 'pending') { GI = null; store.set('gi', null); }
  }
}

/* ---------- time in Tubod (Philippine time) ---------- */
const phd = (ms = Date.now()) => new Date(ms + 8 * 36e5);
const dayKey = (ms = Date.now()) => phd(ms).toISOString().slice(0, 10);

function sunsetMs(y, m, d) {

}
function worshipNow(now = Date.now()) {
  const list = (GI && GI.services && GI.services.length) ? GI.services : [{ name: 'Wednesday worship', day: 3, time: '19:00' }, { name: 'Friday worship', day: 5, time: '19:00' }];
  const d = phd(now), mins = d.getUTCHours() * 60 + d.getUTCMinutes(), day = d.getUTCDay();
  const at = mm => clock(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, mm) - 8 * 36e5);
  for (const s of list) {
    if (Number(s.day) !== day) continue;

}

        let fits = true;

        if (!fits) continue;

        placed.push({ word, cells: Array.from({ length: word.length }, (_, i) => (r0 + dr * i) * N + (c0 + dc * i)), found: false });
        ok = true;

function lineCells(a, b) {

}

function parseVerse(s) {

  const m = /^([\s\S]*?)[\s—–-]*\(?((?:[1-3]\s)?[A-Z][A-Za-z]+\.?\s\d+:\d+(?:[-–]\d+)?)\)?\.?\s*$/.exec(s);
  return m && m[1].trim().length > 8 ? { t: m[1].trim().replace(/^[“"]|[”"]$/g, ''), r: m[2] } : { t: s, r: '' };
}
function startMemory(which) {

  let v;

  else v = weekly && words(weekly.t).length >= 4 && words(weekly.t).length <= 60 ? weekly : list[Math.floor(Date.parse(weekKey() + 'T00:00:00Z') / (7 * 864e5)) % list.length];
  const w = words(v.t);
  S = { mode: 'memory', v, w, step: 1, hide: new Set(seededShuffle(w.map((_, i) => i), v.r + v.t).slice(0, Math.ceil(w.length / 2))), peek: new Set() };
  VIEW = 'memory'; setChrome('play'); renderMemory();
}
const firstLetters = wd => wd.replace(/([A-Za-z])([A-Za-z']*)/, (m, a, b) => a + b.replace(/[A-Za-z']/g, '_'));
function renderMemory() {
  const { v, w, step } = S;

  else if (step === 2) body = `<p class="mv-text">${w.map((wd, i) => S.hide.has(i) && !S.peek.has(i) ? `<button class="mvb" data-act="mvpeek" data-i="${i}">${'_'.repeat(Math.min(8, wd.length))}</button>` : esc(wd)).join(' ')}</p><p class="sub">${x('mvHide1')}</p>`;
  else if (step === 3) body = `<p class="mv-text mono">${w.map(wd => esc(firstLetters(wd))).join(' ')}</p><p class="sub">${x('mvHide2')}</p>`;
  else body = `<p class="sub">${x('mvType')}</p><textarea id="mvIn" class="mv-in" rows="5" placeholder="${x('mvPlaceholder')}" autocapitalize="sentences"></textarea>`;
  app.innerHTML = `<div class="card mv"><p class="eyebrow">${x('mvStep')(step)}${v.r ? ' · ' + esc(v.r) : ''}</p>${body}
    <div class="btnrow" style="margin-top:12px">${step < 4 ? `<button class="primary" data-act="mvnext">${x('mvNext')}</button>` : `<button class="primary" data-act="mvcheck">${x('mvCheck')}</button>`}

const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
function lcsMatch(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) { if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }

}

  miniResults({ mode: 'memory', title: x('mvScore')(pct), score: pct, correct: hit.size, total: want.length,

}

  document.body.classList.add('hosting'); renderHostQ();
}
function hostBoard() { return `<div class="hboard">${S.teams.map(tm => `<div><b>${esc(tm.name)}</b><span>${tm.pts}</span></div>`).join('')}</div>`; }
function renderHostQ() {
  stopTimer();
  const it = S.items[S.i], L = 'ABCD';
  app.innerHTML = `${hostBoard()}<div class="card host"><p class="eyebrow">${x('hQ')(S.i + 1, S.items.length)}${HOST.timer && !S.shown ? ' · ⏱ <span id="hT">30</span>' : ''}</p>
    <h2 class="hq">${esc(it.q)}</h2>
    <div class="hopts">${it.opts.map((o, k) => `<div class="hopt ${S.shown && k === it.ci ? 'right' : ''} ${S.shown && k !== it.ci ? 'dim' : ''}"><b>${L[k]}</b>${esc(o)}</div>`).join('')}</div>
    ${S.shown ? `${it.r ? `<p class="href">${esc(it.r)}</p>` : ''}<p class="lbl">${x('hWho')}</p><div class="hteams">${S.teams.map((tm, i) => `<button class="${S.got.has(i) ? 'on' : ''}" data-act="hgot" data-i="${i}">${esc(tm.name)} +100</button>`).join('')}</div>
      <div class="btnrow"><button class="primary" data-act="hnext">${S.i + 1 < S.items.length ? x('hNext') : x('hFinal')}</button></div>`
    : `<div class="btnrow"><button class="primary" data-act="hshow">${x('hShow')}</button><button class="secondary" data-act="hend">${x('hEnd')}</button></div>`}</div>`;
  if (HOST.timer && !S.shown) {
    const t0 = Date.now();
    S.timer = setInterval(() => { const left = Math.max(0, 30 - Math.floor((Date.now() - t0) / 1000)); const el = document.getElementById('hT'); if (el) { el.textContent = left; el.parentElement.classList.toggle('low', left <= 5); } if (!left) { stopTimer(); S.shown = true; renderHostQ(); } }, 250);
  }
}
function hostNext() {
  S.got.forEach(i => { S.teams[i].pts += 100; });
  S.got = new Set(); S.shown = false; S.i++;
  if (S.i < S.items.length) { renderHostQ(); return; }
  const top = Math.max(...S.teams.map(tm => tm.pts)), winners = S.teams.filter(tm => tm.pts === top);
  app.innerHTML = `<div class="card host res"><h2 class="hq">${winners.length > 1 ? x('hTie') : '🏆 ' + x('hWin')(esc(winners[0].name))}</h2>
    <ol class="lb big">${S.teams.slice().sort((a, b) => b.pts - a.pts).map(tm => `<li><span class="lb-name">${esc(tm.name)}</span><b>${tm.pts}</b></li>`).join('')}</ol>
    <div class="btnrow"><button class="primary" data-act="mode-host">${x('hNew')}</button><button class="secondary" data-act="home">${t('home')}</button></div></div>`;
}

/* ---------- clicks for the new parts (these run before the original handlers) ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  let a = b.dataset.act, m = b.dataset.mode;
  if (a.indexOf('mode-') === 0) { m = a.slice(5); a = 'mode'; }
  if (a === 'home') { document.body.classList.remove('hosting'); return; }
  if (a === 'lang') return;
  const stop = () => { e.stopImmediatePropagation(); e.preventDefault(); };
  if (a === 'mode' && ['quiz', 'verse', 'who', 'books', 'duel'].indexOf(m) >= 0) {
    const w = isAdmin() ? null : worshipNow(); if (w) { stop(); renderHome(); }
    return;
  }
  if (a === 'mode') {
    stop();
    if (!isAdmin() && worshipNow() && m !== 'host') { renderHome(); return; }
    if (m === 'puzzle') startPuzzle(); else if (m === 'wordsearch') startWordSearch(); else if (m === 'memory') startMemory();
    else if (m === 'kids') renderKids(); else if (m === 'host') renderHostSetup();
    return;
  }
  const acts = {
    challenge: startChallenge, board: renderBoard,
    pzchip: () => pzTap(Number(b.dataset.k), b), wstheme: () => startWordSearch(b.dataset.k), wsgive: () => { S.gave = true; renderWS(); },
    mvnext: () => { S.step++; renderMemory(); }, mvother: () => startMemory('other'), mvpeek: () => { S.peek.add(Number(b.dataset.i)); renderMemory(); setTimeout(() => { if (S.mode === 'memory' && S.step === 2) { S.peek.delete(Number(b.dataset.i)); renderMemory(); } }, 1500); }, mvcheck: checkMemory,
    kquiz: startKidsQuiz, kcards: startCards, kpick: () => kidsPick(Number(b.dataset.k)), knext: kidsNext, kcard: () => flipCard(Number(b.dataset.k)),
    hteams: () => { readHostNames(); HOST.teams = Number(b.dataset.n); renderHostSetup(); }, hcount: () => { readHostNames(); HOST.count = Number(b.dataset.n); renderHostSetup(); },
    hcat: () => startHost(b.dataset.cat), hshow: () => { stopTimer(); S.shown = true; renderHostQ(); },
    hgot: () => { const i = Number(b.dataset.i); if (S.got.has(i)) S.got.delete(i); else S.got.add(i); b.classList.toggle('on'); }, hnext: hostNext,
    hend: () => { stopTimer(); document.body.classList.remove('hosting'); renderHome(); }
  };
  if (acts[a]) { stop(); acts[a](); }
}, true);
setInterval(() => { if (VIEW === 'home' && !S.mode) renderHome(); }, 60000);
loadGI(true);

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'home') renderHome();
  else if (a === 'lang') { LANG = b.dataset.lang === 'ceb' ? 'ceb' : 'en'; store.set('lang', LANG); renderHome(); }
  else if (a === 'mode') {
    const m = b.dataset.mode;
    if (m === 'quiz') renderCats(); else if (m === 'duel') renderDuelSetup(); else startGame(m, 'all');
  }
  else if (a === 'cat') startGame('quiz', b.dataset.cat);
  else if (a === 'duelcat') {
    const n1 = (document.getElementById('n1').value || '').trim() || t('p1');
    const n2 = (document.getElementById('n2').value || '').trim() || t('p2');
    startGame('duel', b.dataset.cat, [n1, n2]);
  }
  else if (a === 'ready') renderQuestion();
  else if (a === 'pick') answer(Number(b.dataset.k));
  else if (a === 'fifty') fifty();
  else if (a === 'clue') { if (S.clue < 3 && !S.answered) { S.clue++; renderWho(); } }
  else if (a === 'place') { const it = S.items[S.i]; if (!S.checked && S.placed.length < it.idx.length) { S.placed.push(Number(b.dataset.b)); renderBooks(); } }
  else if (a === 'unplace') { if (!S.checked) { S.placed.splice(Number(b.dataset.k), 1); renderBooks(); } }
  else if (a === 'check') checkBooks();
  else if (a === 'next') next();
  else if (a === 'again') startGame(S.mode, S.cat, S.names);
  else if (a === 'review') renderReview();
  else if (a === 'revopen') renderReviewRound(b.dataset.id);
  else if (a === 'szup') resize(0.1);
  else if (a === 'szdown') resize(-0.1);
  else if (a === 'full') toggleFull();
});

renderHome();

</script>
</body>
</html>
