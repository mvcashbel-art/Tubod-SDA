<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Game · Tubod SDA Church</title>
<meta name="theme-color" content="#1D6A8A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1330; --bg2:#1a2150; --card:#fbf7ec; --ink:#1d2038; --muted:#5e6282;
  --line:#e6dec5; --gold:#d6a93f; --gold-d:#9c7620; --ok:#2e7d5b; --ok-bg:#e3f3ea;
  --bad:#b4413f; --bad-bg:#f8e4e3; --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Public Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink); min-height:100vh; min-height:100dvh;
  background:radial-gradient(1200px 700px at 50% -10%, #2b3580 0%, var(--bg2) 38%, var(--bg) 100%) fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Alegreya',Georgia,serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px;color:#e9e4d0}
.brand{display:flex;align-items:center;gap:10px;font-family:'Alegreya',serif;font-weight:700;letter-spacing:.2px;font-size:18px}
.brand svg{width:26px;height:26px}
.homebtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#f3eedb;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.homebtn:hover{background:rgba(255,255,255,.18)}

/* Home */
.hero{text-align:center;color:#f6f1de;padding:10px 6px 22px}
.hero h1{font-size:clamp(32px,8vw,46px);line-height:1.1;color:#fff}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:12px auto 0;max-width:30em;color:#cfd2ee;font-size:16px;line-height:1.5}
.verse-line{margin-top:14px;font-family:'Alegreya',serif;font-style:italic;color:#e9d9a4;font-size:15px}
.modes{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:0;border-radius:var(--radius);padding:16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode .ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#f1d98c,var(--gold));color:#3b2c06;font-family:'Alegreya',serif;font-weight:700;font-size:24px}
.mode h3{font-size:19px}
.mode p{margin:3px 0 0;color:var(--muted);font-size:14px;line-height:1.35}
.mode .best{margin-left:auto;flex:none;text-align:right;font-size:12px;color:var(--muted)}
.mode .best b{display:block;font-size:18px;color:var(--gold-d);font-family:'Alegreya',serif}
.foot{margin-top:22px;text-align:center;color:#9aa0cf;font-size:12.5px;line-height:1.5}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:20px 18px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.card h2{font-size:clamp(20px,5vw,24px);line-height:1.3}
.sub{color:var(--muted);margin:6px 0 16px;font-size:15px}
.cats{display:grid;gap:10px}
.cat{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:800;text-align:left}
.cat:hover{border-color:var(--gold)}
.cat small{font-weight:600;color:var(--muted)}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;color:#eae6d3;font-weight:700;font-size:14px;margin-bottom:8px}
.hs{display:flex;gap:12px;align-items:center}
.hs b{color:var(--gold)}
.streak{background:rgba(214,169,63,.2);color:#f2d98e;border-radius:999px;padding:3px 10px;font-size:13px}
.prog{height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#f1d98c,var(--gold));border-radius:99px;transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-d);background:#f5ecd0;border-radius:99px;padding:4px 10px;margin-bottom:10px}
.timer{height:8px;background:#ece4cb;border-radius:99px;overflow:hidden;margin:14px 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--ok);border-radius:99px}
.timer i.low{background:var(--bad)}

/* Options */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;line-height:1.3;transition:border-color .12s, background .12s, transform .12s}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f5ecd0;color:var(--gold-d);font-size:14px}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong b{background:var(--bad);color:#fff}
.opt.gone{opacity:.35;text-decoration:line-through}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ghost{background:transparent;border:2px dashed var(--gold);color:var(--gold-d);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px}
.ghost:disabled{opacity:.4;cursor:default}
.primary{background:linear-gradient(135deg,#f1d98c,var(--gold));border:0;color:#2f2305;border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--gold-d)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.secondary{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:11px 20px;font-weight:800;font-size:16px}

/* Feedback */
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;animation:pop .25s ease}
.fb.ok{background:var(--ok-bg);border:1px solid #b7e0c9}
.fb.no{background:var(--bad-bg);border:1px solid #efc1bf}
.fb h3{font-size:18px;margin-bottom:4px}
.fb .pts{font-weight:800;color:var(--gold-d)}
.fb p{margin:6px 0 0;line-height:1.45;font-size:15px}
.fb .ref{font-weight:800;color:var(--muted);font-size:13.5px}
.fb .row{display:flex;justify-content:flex-end;margin-top:12px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Verse */
.verse{font-family:'Alegreya',serif;font-size:clamp(19px,4.8vw,23px);line-height:1.6;margin:10px 0 16px;padding:14px 16px;border-left:4px solid var(--gold);background:#fff;border-radius:0 12px 12px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--gold);text-align:center;color:transparent;user-select:none}
.filled{color:var(--ok);font-weight:700;border-bottom:3px solid var(--ok);padding:0 2px}
.vref{display:block;margin-top:8px;font-family:'Public Sans',sans-serif;font-style:normal;font-weight:800;font-size:14px;color:var(--gold-d)}

/* Who am I */
.clues{list-style:none;margin:12px 0 16px;padding:0;display:grid;gap:8px}
.clues li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;line-height:1.4;animation:pop .25s ease}
.clues li span{display:inline-block;font-weight:800;color:var(--gold-d);margin-right:8px}
.worth{font-weight:800;color:var(--gold-d)}

/* Results */
.res{text-align:center}
.rank{font-family:'Alegreya',serif;font-size:clamp(26px,7vw,34px);margin:6px 0 4px}
.big{font-family:'Alegreya',serif;font-size:56px;font-weight:700;color:var(--gold-d);line-height:1}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 16px;min-width:100px}
.stat b{display:block;font-size:22px;font-family:'Alegreya',serif}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}
.newbest{display:inline-block;background:var(--gold);color:#2f2305;font-weight:800;border-radius:99px;padding:4px 12px;font-size:13px;margin-bottom:8px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.acts{font-family:'Alegreya',serif;font-style:italic;color:var(--muted);margin:10px 0 0;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Wide screens: use the width, keep the height short */
@media (min-width:900px){
  .wrap{max-width:900px}
  .opts{grid-template-columns:1fr 1fr}
  .modes{grid-template-columns:1fr 1fr}
  .modes .mode:last-child:nth-child(odd){grid-column:1/-1}
  .cats{grid-template-columns:1fr 1fr}
  .hero{padding-bottom:14px}
}

/* Fit to screen controls */
.barrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;min-height:38px}
.vctl{display:flex;gap:6px;margin-left:auto}
.vctl button{min-width:38px;height:34px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#f3eedb;font-weight:800;font-size:14px;display:grid;place-items:center}
.vctl button:hover{background:rgba(255,255,255,.22)}
.vctl svg{width:18px;height:18px}
.vctl button[hidden]{display:none}

/* Language switch */
.lang{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px}
.lang button{background:transparent;border:0;color:#d9d6c3;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.lang button.on{background:var(--gold);color:#2f2305}
.lang[hidden],.homebtn[hidden]{display:none}
/* Order the books */
.slots{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:6px 10px;background:#fffdf6}
.slot .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#f5ecd0;color:var(--gold-d);font-weight:800;font-size:13px}
.slot.full{border-style:solid;border-color:var(--gold);background:#fff}
.slot.good{border-color:var(--ok);background:var(--ok-bg)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.slotbtn,.bk{background:transparent;border:0;font-weight:800;font-size:16px;padding:6px 2px;text-align:left;flex:1}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px}
.tile:hover{border-color:var(--gold)}
.hint{color:var(--muted);font-size:14px}
/* Duel */
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.names input{font:inherit;font-weight:700;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.names input:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.duelhud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);color:#d9d6c3;font-weight:800;border:2px solid transparent}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.on{background:rgba(214,169,63,.2);border-color:var(--gold);color:#fff}
.pl b{color:var(--gold);font-family:'Alegreya',serif;font-size:18px}
.pass{text-align:center;padding:30px 18px}
.who-big{font-family:'Alegreya',serif;font-size:clamp(30px,9vw,44px);font-weight:700;color:var(--gold-d);margin:6px 0 22px;word-break:break-word}
.stat.win{border-color:var(--gold);background:#fff8e1}

/* ---- Church site theme: lake blue and paper white, gold used sparingly ---- */
:root{--bg:#EEF4F7;--card:#FFFFFF;--ink:#17324D;--muted:#5B7083;--line:#D9E4EA;--accent:#1D6A8A;--accent-d:#14516B;--gold:#D79A22;--gold-d:#8A6212;--ok:#3F8060;--ok-bg:#E3F2EA;--bad:#B0433A;--bad-bg:#F9E6E3}
body{background:linear-gradient(180deg,#CFE3EC 0,#EEF4F7 380px) #EEF4F7 fixed;color:var(--ink)}
button:focus-visible{outline-color:var(--accent)}
.churchbar{display:inline-flex;align-items:center;gap:4px;color:var(--accent-d);font-weight:700;font-size:.92rem;text-decoration:none;padding:4px 2px}
.churchbar:hover{text-decoration:underline}
.top,.brand{color:var(--ink)}
.homebtn{background:#fff;border:1px solid var(--line);color:var(--accent-d)}
.homebtn:hover{background:#F4F8FA}
.lang{background:#fff;border:1px solid var(--line)}
.lang button{color:var(--muted)}
.lang button.on{background:var(--accent);color:#fff}
.hero{color:var(--ink)}
.hero h1{color:var(--ink)}
.hero h1 em{color:var(--accent)}
.hero p{color:var(--muted)}
.verse-line{color:var(--gold-d)}
.foot{color:var(--muted)}
.hud{color:var(--ink)}
.hs b{color:var(--accent)}
.streak{background:#FBF1D9;color:#7A5A12}
.prog{background:#D9E4EA}
.prog i{background:var(--accent)}
.mode{border:1px solid var(--line);box-shadow:0 1px 3px rgba(23,50,77,.08)}
.mode:hover{border-color:var(--accent)}
.mode .ico{background:linear-gradient(135deg,#2C8AAE,#1D6A8A);color:#fff}
.mode .best b{color:var(--accent)}
.card{box-shadow:0 1px 4px rgba(23,50,77,.1);border:1px solid var(--line)}
.tag{background:#E3F0F5;color:var(--accent-d)}
.timer{background:#E3EDF2}
.opt b{background:#E3F0F5;color:var(--accent-d)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.ghost{border-color:var(--accent);color:var(--accent-d)}
.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.primary:active{box-shadow:0 2px 0 var(--accent-d)}
.cat:hover,.tile:hover{border-color:var(--accent)}
.verse{border-left-color:var(--accent)}
.blank{border-bottom-color:var(--accent)}
.vref{color:var(--accent-d)}
.clues li span{color:var(--accent-d)}
.big{color:var(--accent)}
.newbest{background:var(--gold);color:#2f2305}
.stat.win{background:#FBF1D9;border-color:var(--gold)}
.pl{background:#fff;color:var(--ink);border-color:var(--line)}
.pl.on{background:#E3F0F5;border-color:var(--accent);color:var(--ink)}
.pl b{color:var(--accent)}
.names input:focus{outline-color:var(--accent);border-color:var(--accent)}
.slot .num{background:#E3F0F5;color:var(--accent-d)}
.slot.full{border-color:var(--accent)}
.slot.good{border-color:var(--ok)}.slot.bad{border-color:var(--bad)}
.who-big{color:var(--accent)}
.fb .pts{color:var(--gold-d)}
.vctl button{background:#fff;border:1px solid var(--line);color:var(--accent-d)}
.vctl button:hover{background:#F4F8FA}
</style>
</head>
<body>
<div class="wrap">
  <div class="barrow"><a class="churchbar" href="index.html">&#8249; Tubod SDA Church</a><div class="vctl"><button id="szDown" data-act="szdown" aria-label="Smaller">A&#8722;</button><button id="szUp" data-act="szup" aria-label="Bigger">A+</button><button id="fsBtn" data-act="full" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div></div>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 7c-2.6-2.2-6.6-3-11-2.2v18.4c4.4-.8 8.4 0 11 2.2 2.6-2.2 6.6-3 11-2.2V4.8C22.600 4 18.600 4.800 16 7z" fill="#1D6A8A"/><path d="M16 7v18.400" stroke="#EEF4F7" stroke-width="1.600" fill="none"/></svg>
      Scripture Quest
    </div>
    <button class="homebtn" id="homeTop" data-act="home" hidden>Home</button>
    <div class="lang" id="langBox"><button data-act="lang" data-lang="en">English</button><button data-act="lang" data-lang="ceb">Bisaya</button></div>
  </div>
  <main id="app"></main>
</div>

<script>
/* ---------- Helpers ---------- */
const app = document.getElementById('app');
const homeTop = document.getElementById('homeTop');
const langBox = document.getElementById('langBox');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('sq_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sq_' + k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Content ---------- */

const CAT = { ot: 'Old Testament', nt: 'New Testament', pr: 'Daniel & Revelation', sb: 'Sabbath & Beliefs', ah: 'Adventist Heritage' };
const Q = (c, q, a, w, r, n) => ({ c, q, a, w, r, n });

const QUIZ = [
  /* Old Testament */
  Q('ot', 'Who built the ark to survive the great flood?', 'Noah', ['Moses', 'Abraham', 'Enoch'], 'Genesis 6:13–22', 'God told Noah to build an ark of gopher wood, and Noah did everything God commanded.'),
  Q('ot', 'On which day of Creation Week did God rest?', 'The seventh day', ['The first day', 'The third day', 'The sixth day'], 'Genesis 2:2–3', 'God blessed the seventh day and sanctified it, the first Sabbath.'),
  Q('ot', 'What sign did God give as His promise never to flood the whole earth again?', 'A rainbow', ['A dove', 'A star', 'A pillar of cloud'], 'Genesis 9:12–16', 'The rainbow is the token of God’s everlasting covenant with every living creature.'),
  Q('ot', 'Who was thrown into the den of lions for praying to God?', 'Daniel', ['Jeremiah', 'Shadrach', 'Elijah'], 'Daniel 6:10–23', 'God sent His angel and shut the lions’ mouths because Daniel trusted in Him.'),
  Q('ot', 'Which prophet spent three days and nights inside a great fish?', 'Jonah', ['Elisha', 'Hosea', 'Amos'], 'Jonah 1:17', 'Jesus later pointed to Jonah as a sign of His own three days in the grave (Matthew 12:40).'),
  Q('ot', 'How many plagues did God send on Egypt?', 'Ten', ['Seven', 'Twelve', 'Five'], 'Exodus 7–12', 'The tenth plague, the death of the firstborn, led to the first Passover.'),
  Q('ot', 'Which son of Jacob was sold by his brothers and later became ruler in Egypt?', 'Joseph', ['Benjamin', 'Judah', 'Reuben'], 'Genesis 37; 41:41–43', 'Joseph told his brothers, “Ye thought evil against me; but God meant it unto good” (Genesis 50:20).'),
  Q('ot', 'What did David use to defeat Goliath?', 'A sling and a stone', ['A sword', 'A spear', 'A bow and arrow'], '1 Samuel 17:45–50', 'David came “in the name of the LORD of hosts,” not in his own strength.'),
  Q('ot', 'Which king asked God for wisdom and built the temple in Jerusalem?', 'Solomon', ['David', 'Hezekiah', 'Josiah'], '1 Kings 3:9–12; 6:1', 'God gave Solomon a wise and understanding heart.'),
  Q('ot', 'How was the prophet Elijah taken to heaven?', 'In a whirlwind, with a chariot of fire', ['He died peacefully at Mount Carmel', 'He was carried off by ravens', 'He crossed the Red Sea and vanished'], '2 Kings 2:11', 'Elijah is one of only two people in the Old Testament who did not see death. Enoch is the other.'),
  Q('ot', 'Who saved the Jewish people by approaching the Persian king without being summoned?', 'Esther', ['Ruth', 'Deborah', 'Hannah'], 'Esther 4:14–16; 5:1–2', 'Mordecai asked whether Esther had come to the kingdom “for such a time as this.”'),
  Q('ot', 'Who killed his brother Abel, the first murder in the Bible?', 'Cain', ['Seth', 'Lamech', 'Esau'], 'Genesis 4:8', 'Abel’s offering was accepted by faith (Hebrews 11:4).'),
  Q('ot', 'Which three young men were thrown into the fiery furnace but were not burned?', 'Shadrach, Meshach and Abednego', ['Peter, James and John', 'Ezra, Nehemiah and Haggai', 'Elijah, Elisha and Samuel'], 'Daniel 3:19–27', 'The king saw a fourth figure in the fire “like the Son of God.”'),
  Q('ot', 'How many books are in the Old Testament?', '39', ['27', '66', '46'], 'Bible overview', '39 Old Testament books plus 27 New Testament books make 66 in all.'),
  Q('ot', 'Which judge’s great strength was tied to his uncut hair?', 'Samson', ['Gideon', 'Ehud', 'Jephthah'], 'Judges 16:17', 'Samson was a Nazarite from birth.'),
  Q('ot', 'Which sea did God part so Israel could cross on dry ground?', 'The Red Sea', ['The Dead Sea', 'The Sea of Galilee', 'The Mediterranean Sea'], 'Exodus 14:21–22', 'The waters were a wall to them on their right hand and on their left.'),
  Q('ot', 'Who was Abraham’s son of promise?', 'Isaac', ['Ishmael', 'Jacob', 'Esau'], 'Genesis 21:1–3, 12', 'Isaac was born when Abraham was 100 years old and Sarah was 90.'),
  Q('ot', 'Who was the first man God created?', 'Adam', ['Enoch', 'Seth', 'Abel'], 'Genesis 2:7', 'God formed man of the dust of the ground and breathed into him the breath of life.'),

  /* New Testament */
  Q('nt', 'In which town was Jesus born?', 'Bethlehem', ['Nazareth', 'Jerusalem', 'Capernaum'], 'Luke 2:4–7; Micah 5:2', 'Micah foretold the birthplace of the Messiah centuries earlier.'),
  Q('nt', 'Who baptized Jesus in the Jordan River?', 'John the Baptist', ['Peter', 'Philip', 'Andrew'], 'Matthew 3:13–17', 'A voice from heaven said, “This is my beloved Son, in whom I am well pleased.”'),
  Q('nt', 'How many apostles did Jesus choose?', 'Twelve', ['Seven', 'Ten', 'Seventy'], 'Luke 6:13', 'Jesus later sent out seventy others as well (Luke 10:1), but the apostles numbered twelve.'),
  Q('nt', 'What was Jesus’ first recorded miracle?', 'Turning water into wine', ['Feeding the five thousand', 'Healing a blind man', 'Walking on water'], 'John 2:1–11', 'It happened at a wedding in Cana of Galilee.'),
  Q('nt', 'Which disciple denied knowing Jesus three times?', 'Peter', ['John', 'Thomas', 'Andrew'], 'Luke 22:54–62', 'Peter wept bitterly, and Jesus later restored him (John 21:15–17).'),
  Q('nt', 'Whom did Jesus raise from the dead after four days in the tomb?', 'Lazarus', ['The daughter of Jairus', 'The widow’s son at Nain', 'Dorcas'], 'John 11:38–44', 'Jesus said, “I am the resurrection, and the life.”'),
  Q('nt', 'Which short tax collector climbed a sycamore tree to see Jesus?', 'Zacchaeus', ['Bartimaeus', 'Nicodemus', 'Cornelius'], 'Luke 19:1–10', 'Jesus said, “The Son of man is come to seek and to save that which was lost.”'),
  Q('nt', 'On what day after His death did Jesus rise from the grave?', 'The third day', ['The second day', 'The seventh day', 'The fortieth day'], '1 Corinthians 15:3–4', 'Jesus rested in the tomb over the Sabbath and rose on the first day of the week.'),
  Q('nt', 'Who met Jesus on the road to Damascus and became a great apostle?', 'Saul, also called Paul', ['Barnabas', 'Timothy', 'Silas'], 'Acts 9:1–19', 'Saul went from persecuting the church to preaching Christ to the Gentiles.'),
  Q('nt', 'Which Gospel writer was a physician?', 'Luke', ['Matthew', 'Mark', 'John'], 'Colossians 4:14', 'Paul called him “Luke, the beloved physician.” He also wrote the book of Acts.'),
  Q('nt', 'How many books are in the New Testament?', '27', ['39', '66', '24'], 'Bible overview', 'It runs from Matthew to Revelation.'),
  Q('nt', 'Who was the first Christian martyr?', 'Stephen', ['Philip', 'Barnabas', 'Timothy'], 'Acts 7:54–60', 'As he died, Stephen prayed for those who stoned him.'),
  Q('nt', 'What is the last book of the Bible?', 'Revelation', ['Jude', 'Acts', 'Hebrews'], 'Revelation 1:1', 'It is “the Revelation of Jesus Christ.”'),
  Q('nt', 'In which town did Jesus grow up?', 'Nazareth', ['Bethlehem', 'Jericho', 'Bethany'], 'Luke 2:39–40, 51', 'Jesus was known as “Jesus of Nazareth.”'),
  Q('nt', 'Which disciple doubted the resurrection until he saw the nail prints?', 'Thomas', ['Philip', 'Andrew', 'Bartholomew'], 'John 20:24–29', 'Jesus said, “Blessed are they that have not seen, and yet have believed.”'),

  /* Daniel & Revelation */
  Q('pr', 'In Daniel 2, what was the head of the great image in Nebuchadnezzar’s dream made of?', 'Gold', ['Silver', 'Brass', 'Iron'], 'Daniel 2:32, 38', 'Daniel told the king, “Thou art this head of gold.”'),
  Q('pr', 'In Daniel 2, what struck the image and filled the whole earth?', 'A stone cut without hands', ['A great flood', 'A fiery sword', 'A mighty wind'], 'Daniel 2:34–35, 44–45', 'The stone represents God’s everlasting kingdom that will never be destroyed.'),
  Q('pr', 'In Daniel 7, how many great beasts rose up out of the sea?', 'Four', ['Three', 'Seven', 'Ten'], 'Daniel 7:3', 'Like the image of Daniel 2, the four beasts picture four successive world powers.'),
  Q('pr', 'According to Daniel 8:14, how many days until the sanctuary would be cleansed?', '2,300', ['1,260', '1,335', '490'], 'Daniel 8:14', 'Adventists understand this long prophecy to reach to 1844 and to the work of Christ in the heavenly sanctuary.'),
  Q('pr', 'Where was John when he received the visions of Revelation?', 'The isle of Patmos', ['Mount Sinai', 'The island of Crete', 'Babylon'], 'Revelation 1:9', 'John was there “for the word of God, and for the testimony of Jesus Christ.”'),
  Q('pr', 'Which of these was NOT one of the seven churches of Revelation?', 'Corinth', ['Ephesus', 'Smyrna', 'Laodicea'], 'Revelation 1:11', 'The seven were Ephesus, Smyrna, Pergamos, Thyatira, Sardis, Philadelphia and Laodicea.'),
  Q('pr', 'What does the first angel of Revelation 14 say has come?', 'The hour of His judgment', ['The day of rest', 'The marriage supper', 'The end of famine'], 'Revelation 14:6–7', 'The first angel also calls everyone to “fear God, and give glory to him” and to worship the Creator.'),
  Q('pr', 'Revelation 14:12 says the saints keep the commandments of God and have what?', 'The faith of Jesus', ['The wealth of kings', 'The wisdom of Solomon', 'The strength of Samson'], 'Revelation 14:12', 'Obedience and faith go together in the last-day message.'),
  Q('pr', 'In Revelation 19:10, “the testimony of Jesus is the spirit of” what?', 'Prophecy', ['Truth', 'Wisdom', 'Grace'], 'Revelation 19:10', 'Revelation 12:17 links “the testimony of Jesus Christ” with God’s remnant people.'),
  Q('pr', 'In Matthew 24:14, what must happen before the end comes?', 'The gospel preached in all the world as a witness to all nations', ['All kingdoms unite into one', 'The temple is rebuilt', 'Every person is baptized'], 'Matthew 24:14', 'This verse drives the Adventist passion for world mission.'),
  Q('pr', 'What final promise does Jesus make in Revelation 22:20?', 'Surely I come quickly', ['I will build My church', 'I am with you always', 'Peace I leave with you'], 'Revelation 22:20', 'John answers, “Even so, come, Lord Jesus.”'),
  Q('pr', 'In Acts 1:11, how did the angels say Jesus will return?', 'In the same way He went into heaven', ['As a baby in Bethlehem', 'In secret to a few', 'Only in spirit through the church'], 'Acts 1:9–11', 'Jesus’ return will be personal, visible and glorious (Revelation 1:7).'),
  Q('pr', 'According to 1 Thessalonians 4:16, who rises first when the Lord descends from heaven?', 'The dead in Christ', ['Those still alive on earth', 'The angels', 'The wicked dead'], '1 Thessalonians 4:16–17', 'Then the living righteous are caught up together with them to meet the Lord.'),
  Q('pr', 'In Revelation 21, what does John see coming down from God out of heaven?', 'The holy city, New Jerusalem', ['A mighty army', 'The ark of the covenant', 'A great white throne'], 'Revelation 21:1–2', 'God will make “a new heaven and a new earth,” and wipe away every tear.'),

  /* Sabbath & Beliefs */
  Q('sb', 'Which commandment begins with the word “Remember”?', 'The fourth (the Sabbath)', ['The first (no other gods)', 'The fifth (honour parents)', 'The tenth (do not covet)'], 'Exodus 20:8–11', 'The Sabbath commandment points back to Creation: God made all things in six days and rested on the seventh.'),
  Q('sb', 'When did God first bless and sanctify the seventh day?', 'At Creation, in Eden', ['At Mount Sinai', 'In the days of Nehemiah', 'When Jesus was born'], 'Genesis 2:2–3', 'The Sabbath was given before sin and before Israel as a nation.'),
  Q('sb', 'In Mark 2:27, Jesus said the Sabbath was made for whom?', 'Man', ['Israel only', 'The priests', 'The angels'], 'Mark 2:27–28', 'Jesus added that He is “Lord also of the sabbath.”'),
  Q('sb', 'What was Jesus’ custom on the Sabbath day?', 'Worshipping in the synagogue', ['Travelling to Jerusalem', 'Fasting alone in the desert', 'Working as a carpenter'], 'Luke 4:16', 'Luke says that, “as his custom was, he went into the synagogue on the sabbath day.”'),
  Q('sb', 'After Jesus was buried, what did the women do on the Sabbath?', 'Rested according to the commandment', ['Anointed His body at the tomb', 'Travelled back to Galilee', 'Taught in the temple'], 'Luke 23:55–56', 'They kept the Sabbath even in their grief, and came to the tomb on the first day of the week.'),
  Q('sb', 'On what did God write the Ten Commandments?', 'Two tables of stone', ['Scrolls of papyrus', 'Bronze plates', 'A wall of the temple'], 'Exodus 31:18', 'They were written “with the finger of God.”'),
  Q('sb', 'According to 1 Kings 8:9, what was inside the ark of the covenant?', 'The two tables of stone', ['The golden lampstand', 'The bread of the presence', 'The altar’s ashes'], '1 Kings 8:9', 'The law of God sat at the very heart of the sanctuary, beneath the mercy seat.'),
  Q('sb', 'According to Hebrews 8:1–2, where does Jesus minister as our High Priest?', 'In the heavenly sanctuary', ['In the Jerusalem temple', 'On the Mount of Olives', 'In the synagogue at Nazareth'], 'Hebrews 8:1–2', 'The earthly sanctuary was a copy and shadow of heavenly things (Hebrews 8:5).'),
  Q('sb', 'How did Jesus describe Lazarus’s death in John 11:11?', 'Sleep', ['A journey', 'A punishment', 'A transformation'], 'John 11:11–14', 'Jesus said, “Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep.”'),
  Q('sb', 'According to Ecclesiastes 9:5, what do the dead know?', 'Nothing (“not any thing”)', ['All things', 'The future', 'What the living are doing'], 'Ecclesiastes 9:5–6', 'The Bible teaches that the dead rest until the resurrection at Christ’s return.'),
  Q('sb', 'What portion of our increase does Scripture call the tithe?', 'A tenth', ['A fifth', 'A third', 'A half'], 'Leviticus 27:30; Malachi 3:10', 'The tithe is holy to the LORD and is returned to Him in faithfulness.'),
  Q('sb', 'In Daniel 1, what did Daniel ask to eat in place of the king’s food?', 'Pulse (vegetables) and water', ['Fish and bread', 'Honey and milk', 'Lamb and wine'], 'Daniel 1:8–16', 'After ten days Daniel and his friends looked healthier than all who ate the king’s portion.'),
  Q('sb', 'What does Paul call your body in 1 Corinthians 6:19?', 'The temple of the Holy Ghost', ['A burden to bear', 'A servant of the mind', 'A garden of delights'], '1 Corinthians 6:19–20', 'Therefore, Paul says, “glorify God in your body.”'),
  Q('sb', 'In Romans 6:23, what are “the wages of sin”?', 'Death', ['Shame', 'Exile', 'Sorrow'], 'Romans 6:23', '“But the gift of God is eternal life through Jesus Christ our Lord.”'),
  Q('sb', 'According to Romans 6:4, baptism pictures being buried with Christ so we can walk in what?', 'Newness of life', ['Fear of judgment', 'The old covenant', 'Perfect comfort'], 'Romans 6:4', 'Baptism by immersion pictures death to the old life and resurrection to the new.'),

  /* Adventist Heritage */
  Q('ah', 'In what year did the Great Disappointment take place, when early Adventists expected Christ to return?', '1844', ['1798', '1863', '1888'], 'Adventist history', 'It was October 22, 1844. Many studied the Bible and came to understand the sanctuary message afterward.'),
  Q('ah', 'In what year was the Seventh-day Adventist Church formally organized?', '1863', ['1844', '1888', '1915'], 'Adventist history', 'The General Conference was organized in Battle Creek, Michigan.'),
  Q('ah', 'Which early pioneer, a former sea captain, helped introduce the seventh-day Sabbath to early Adventists?', 'Joseph Bates', ['William Miller', 'John Harvey Kellogg', 'Uriah Smith'], 'Adventist history', 'Joseph Bates was a co-founder of the Adventist Church along with James and Ellen White.'),
  Q('ah', 'How many Fundamental Beliefs does the Seventh-day Adventist Church currently teach?', '28', ['10', '22', '36'], 'Adventist beliefs', 'They cover Scripture, God, salvation, the church, the Sabbath, the sanctuary, Christ’s return and more.'),
  Q('ah', 'Which farmer-turned-preacher sparked the 1840s Advent awakening in America?', 'William Miller', ['Martin Luther', 'John Wesley', 'Charles Spurgeon'], 'Adventist history', 'Miller studied Daniel’s prophecies and preached that Christ’s return was near.'),
  Q('ah', 'What does the “Advent” in Adventist point to?', 'The coming of Christ', ['The Sabbath day', 'The gifts of the Spirit', 'The Reformation'], 'Titus 2:13', 'Adventists look for “that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ.”')
  ,
  /* More questions */
  Q('ot', 'What did God send to feed Israel in the wilderness?', 'Manna', ['Locusts', 'Barley loaves', 'Fish from the sea'], 'Exodus 16:14–15', 'Each morning manna lay on the ground around the camp, “bread from heaven.”'),
  Q('ot', 'Who was the first king of Israel?', 'Saul', ['David', 'Solomon', 'Samuel'], '1 Samuel 10:1', 'Samuel anointed Saul at God’s direction.'),
  Q('ot', 'For how many days and nights did the rain fall during the flood?', 'Forty', ['Seven', 'Ten', 'One hundred'], 'Genesis 7:12', 'The waters then stayed on the earth for 150 days.'),
  Q('ot', 'Which prophet did God call as a boy when he heard a voice in the night?', 'Samuel', ['Isaiah', 'Jeremiah', 'Elisha'], '1 Samuel 3:1–10', 'Samuel answered, “Speak; for thy servant heareth.”'),
  Q('pr', 'Who explained the writing on the wall at Belshazzar’s feast?', 'Daniel', ['Ezekiel', 'Mordecai', 'Nehemiah'], 'Daniel 5:5, 25–28', 'The words were “Mene, Mene, Tekel, Upharsin,” and Babylon fell that very night.'),
  Q('nt', 'How many loaves and fish did Jesus use to feed the five thousand?', 'Five loaves and two fish', ['Seven loaves and a few fish', 'Twelve loaves and one fish', 'Three loaves and five fish'], 'Matthew 14:17–21', 'Twelve baskets of leftovers were gathered afterward.'),
  Q('nt', 'What did the Holy Spirit look like when it came down on Jesus at His baptism?', 'A dove', ['An eagle', 'A tongue of fire', 'A cloud'], 'Matthew 3:16–17', 'From heaven the Father said, “This is my beloved Son.”'),
  Q('nt', 'Where was Jesus tempted by the devil for forty days?', 'In the wilderness', ['In the Garden of Gethsemane', 'On the Sea of Galilee', 'On Mount Sinai'], 'Matthew 4:1–11', 'Jesus defeated every temptation by saying, “It is written.”'),
  Q('nt', 'What did Jesus say is the greatest commandment?', 'Love the Lord your God with all your heart, soul and mind', ['Honour your father and mother', 'Remember the Sabbath day', 'Do not bear false witness'], 'Matthew 22:36–39', 'The second, Jesus said, is to love your neighbour as yourself.'),
  Q('sb', 'In John 14:15, Jesus says, “If ye love me…” what?', 'Keep my commandments', ['Give much money', 'Build a temple', 'Fast every day'], 'John 14:15', 'Love and obedience go hand in hand. Obedience is the fruit of love.'),
  Q('sb', 'According to John 1:1–3, who made all things?', 'The Word, who is Jesus', ['The angels', 'The prophets', 'Nature itself'], 'John 1:1–3', '“All things were made by him.” Jesus is our Creator and our Saviour.'),
  Q('sb', 'What does Hebrews 4:9 say remains for the people of God?', 'A rest', ['A temple', 'A kingdom', 'A sacrifice'], 'Hebrews 4:9', 'Many Bible students see Sabbath-keeping in this verse, a rest that still remains.'),
  Q('ah', 'Which co-founder of the Adventist Church wrote the book “Steps to Christ”?', 'Ellen G. White', ['Joseph Bates', 'J. N. Andrews', 'Uriah Smith'], 'Adventist history', 'It is a much-loved introduction to the love of Jesus.'),
  Q('ah', 'What is the highest level of Seventh-day Adventist church organization called?', 'The General Conference', ['The Synod', 'The Diocese', 'The Presbytery'], 'Adventist history', 'Local churches unite in conferences, and together they form one worldwide family.'),
  /* Even more questions */
  Q('ot', 'Who was Moses’ brother, who spoke to Pharaoh for him?', 'Aaron', ['Joshua', 'Caleb', 'Eleazar'], 'Exodus 4:14–16', 'God sent Aaron to speak for Moses, because Moses felt he did not speak well.'),
  Q('ot', 'Which city’s walls fell after Israel marched around it for seven days?', 'Jericho', ['Ai', 'Bethel', 'Hebron'], 'Joshua 6:15–20', 'On the seventh day they marched seven times, shouted, and the wall fell flat.'),
  Q('ot', 'Which woman prayed for a son and then gave him to serve God at the tabernacle?', 'Hannah', ['Sarah', 'Rachel', 'Rebekah'], '1 Samuel 1:10–11, 27–28', 'Her son was Samuel, who grew up serving the LORD.'),
  Q('ot', 'Who said to Naomi, “Thy people shall be my people, and thy God my God”?', 'Ruth', ['Orpah', 'Esther', 'Rahab'], 'Ruth 1:16', 'Ruth, a Moabite, chose to follow the true God and became an ancestor of King David.'),
  Q('ot', 'How many sons did Jacob have?', 'Twelve', ['Ten', 'Seven', 'Fourteen'], 'Genesis 35:22–26', 'His twelve sons became the twelve tribes of Israel.'),
  Q('ot', 'In which garden did God place Adam and Eve?', 'Eden', ['Gethsemane', 'Carmel', 'Goshen'], 'Genesis 2:8', 'God planted the garden eastward in Eden and put the man there.'),
  Q('ot', 'On Mount Carmel, which prophet challenged the prophets of Baal?', 'Elijah', ['Elisha', 'Isaiah', 'Samuel'], '1 Kings 18:36–39', 'Fire fell from heaven, and the people cried, “The LORD, he is the God.”'),
  Q('ot', 'Who led the rebuilding of Jerusalem’s walls, finished in just 52 days?', 'Nehemiah', ['Ezra', 'Zerubbabel', 'Haggai'], 'Nehemiah 6:15', 'Nehemiah prayed and planned, and the people worked together with all their heart.'),
  Q('ot', 'Who lost his children and wealth, yet said, “The LORD gave, and the LORD hath taken away”?', 'Job', ['Jacob', 'Hezekiah', 'Jeremiah'], 'Job 1:21', 'Job kept his faith, and God later restored his fortunes.'),
  Q('ot', 'What did God ask Israel to build so that He could live among them?', 'A sanctuary', ['A palace', 'A great wall', 'A stone tower'], 'Exodus 25:8', 'The sanctuary taught Israel about God’s presence and His plan to save sinners.'),
  Q('ot', 'What did the people try to build at Babel to reach heaven?', 'A tower', ['A bridge', 'A great wall', 'An altar'], 'Genesis 11:4–8', 'God confused their language, and they scattered over the whole earth.'),
  Q('ot', 'Who was Jacob’s twin brother?', 'Esau', ['Laban', 'Ishmael', 'Reuben'], 'Genesis 25:24–26', 'Esau sold his birthright for a bowl of stew.'),
  Q('ot', 'Which prophet prayed that his servant’s eyes would be opened to see horses and chariots of fire?', 'Elisha', ['Elijah', 'Isaiah', 'Jeremiah'], '2 Kings 6:15–17', 'Elisha said, “They that be with us are more than they that be with them.”'),
  Q('ot', 'With only 300 men, what did Gideon’s soldiers carry into battle against Midian?', 'Trumpets, pitchers, and torches', ['Swords and shields', 'Slings and stones', 'Chariots and spears'], 'Judges 7:16–21', 'God gave the victory so Israel would know the power was His.'),
  Q('nt', 'Which angel announced to Mary that she would bear Jesus?', 'Gabriel', ['Michael', 'Raphael', 'Uriel'], 'Luke 1:26–31', 'Gabriel said, “Thou shalt call his name JESUS.”'),
  Q('nt', 'What gifts did the wise men bring to the child Jesus?', 'Gold, frankincense, and myrrh', ['Silver, wine, and oil', 'Bread, fish, and honey', 'Wool, spices, and salt'], 'Matthew 2:11', 'They worshipped Him and opened their treasures.'),
  Q('nt', 'Who betrayed Jesus to His enemies for thirty pieces of silver?', 'Judas Iscariot', ['Thomas', 'Andrew', 'Bartholomew'], 'Matthew 26:14–16', 'Judas felt sorry afterward, but it was too late to undo it.'),
  Q('nt', 'Who stopped to help the wounded man in Jesus’ story of the Good Samaritan?', 'A Samaritan', ['A priest', 'A Levite', 'A Pharisee'], 'Luke 10:30–37', 'Jesus ended the story with, “Go, and do thou likewise.”'),
  Q('nt', 'What did Jesus say to the stormy sea on Lake Galilee?', '“Peace, be still”', ['“Come forth”', '“Let there be light”', '“Follow me”'], 'Mark 4:39', 'The wind stopped and there was a great calm.'),
  Q('nt', 'Which apostle wrote the most letters in the New Testament?', 'Paul', ['Peter', 'John', 'James'], 'Romans 1:1', 'Paul wrote to churches and friends from many places, even from prison.'),
  Q('nt', 'Which disciple stepped out of the boat and walked on water toward Jesus?', 'Peter', ['John', 'Andrew', 'James'], 'Matthew 14:28–31', 'Peter began to sink when he looked at the waves, and Jesus caught him.'),
  Q('nt', 'Which Gospel was written by a former tax collector?', 'Matthew', ['Mark', 'Luke', 'John'], 'Matthew 9:9', 'Jesus called Matthew from his tax booth, and he left everything to follow Him.'),
  Q('nt', 'What appeared above the disciples’ heads on the Day of Pentecost?', 'Tongues like fire', ['Doves of light', 'A rainbow', 'A pillar of cloud'], 'Acts 2:1–4', 'They were filled with the Holy Spirit and began to speak in other languages.'),
  Q('nt', 'Who was the Roman governor who ordered Jesus to be crucified?', 'Pontius Pilate', ['Caesar Augustus', 'Felix', 'Festus'], 'Matthew 27:24–26', 'Pilate washed his hands, yet he still gave the order.'),
  Q('nt', 'Which companion sang praises with Paul in the prison at Philippi?', 'Silas', ['Timothy', 'Barnabas', 'Luke'], 'Acts 16:25–26', 'An earthquake opened the doors, and the jailer believed.'),
  Q('nt', 'How many times did Jesus say we should forgive someone who wrongs us?', 'Seventy times seven', ['Seven times', 'Three times', 'Only once'], 'Matthew 18:21–22', 'Forgiveness has no limit.'),
  Q('nt', 'What did the father do when he saw his lost son coming home?', 'He ran and embraced him', ['He sent him away', 'He waited at the house', 'He asked for payment'], 'Luke 15:20', 'The father welcomed his son with a robe, a ring, and a feast.'),
  Q('nt', 'Who wrote the book of Acts?', 'Luke', ['Peter', 'Paul', 'John'], 'Acts 1:1–2', 'Luke addressed both his Gospel and Acts to Theophilus.'),
  Q('nt', 'Who was the father of John the Baptist?', 'Zacharias', ['Joseph', 'Simeon', 'Nicodemus'], 'Luke 1:13', 'The angel told Zacharias that his wife Elizabeth would bear a son.'),
  Q('pr', 'In Daniel 3, what was everyone commanded to do when the music played?', 'Bow down to the golden image', ['Offer a lamb on the altar', 'Sing the king’s birthday song', 'Bring gifts to the queen'], 'Daniel 3:4–6', 'Shadrach, Meshach, and Abednego refused to bow and were thrown into the furnace.'),
  Q('pr', 'In Daniel 4, what happened to King Nebuchadnezzar because of his pride?', 'He lived like an animal in the field', ['He was sent to prison in Egypt', 'He was struck blind in his palace', 'He lost his kingdom to his son'], 'Daniel 4:31–37', 'His reason returned after a time, and he honoured the Most High.'),
  Q('pr', 'In Daniel 6, who tricked King Darius into signing the decree against praying?', 'Jealous officials', ['Daniel’s three friends', 'The queen mother', 'The temple priests of Judah'], 'Daniel 6:4–9', 'They could find no fault in Daniel except his faithfulness to God.'),
  Q('pr', 'In Daniel 2, what were the feet of the great image made of?', 'Iron mixed with clay', ['Pure gold', 'Brass and silver', 'Wood and stone'], 'Daniel 2:33, 41–43', 'The mixed feet show a divided world, until God’s kingdom comes.'),
  Q('pr', 'In Daniel 2, which kingdom did the chest and arms of silver stand for?', 'Medo-Persia', ['Babylon', 'Greece', 'Rome'], 'Daniel 2:32, 39', 'Daniel 8:20 names the kings of Media and Persia.'),
  Q('pr', 'On which day did John say he was “in the Spirit” when he received Revelation?', 'The Lord’s day', ['The Passover', 'Pentecost', 'The Day of Atonement'], 'Revelation 1:10', 'Adventists see this as the Sabbath, which Scripture calls the Lord’s day (Isaiah 58:13).'),
  Q('pr', 'To which church did Jesus say, “Behold, I stand at the door, and knock”?', 'Laodicea', ['Ephesus', 'Smyrna', 'Sardis'], 'Revelation 3:14, 20', 'Jesus promises to come in and share a meal with anyone who opens the door.'),
  Q('pr', 'How many are sealed from the tribes of Israel in Revelation 7?', '144,000', ['7,000', '24,000', '1,000'], 'Revelation 7:4', 'They are marked with God’s seal on their foreheads.'),
  Q('pr', 'In Revelation 21:4, what will God wipe away from our eyes?', 'All tears', ['All dust', 'All sleep', 'All shadows'], 'Revelation 21:4', 'There will be no more death, sorrow, crying, or pain.'),
  Q('pr', 'In Revelation 22:1, what did John see coming out of the throne of God?', 'A pure river of the water of life', ['A golden stairway', 'A flaming sword', 'A mighty wind'], 'Revelation 22:1', 'On both sides of the river stood the tree of life.'),
  Q('pr', 'In Daniel 7:13–14, who comes with the clouds of heaven to receive an everlasting kingdom?', 'One like the Son of man', ['The little horn', 'The fourth beast', 'A great eagle'], 'Daniel 7:13–14', 'Jesus used this same title for Himself when He spoke of His return.'),
  Q('pr', 'Whom does the first angel of Revelation 14 call us to worship?', 'Him who made heaven, earth, the sea, and the springs of water', ['The prophets and apostles', 'The kings of the earth', 'The seven churches'], 'Revelation 14:6–7', 'This points back to Creation and the Sabbath commandment.'),
  Q('pr', 'In Revelation 5, who is found worthy to open the scroll with seven seals?', 'The Lamb', ['An angel', 'Moses', 'Michael'], 'Revelation 5:5–9', 'The Lion of Judah is also the Lamb who was slain.'),
  Q('pr', 'In Daniel 9, what did Daniel do when he understood that the seventy years were ending?', 'He prayed and confessed his people’s sins', ['He built a new temple', 'He led the people home', 'He wrote to King Cyrus'], 'Daniel 9:2–5', 'The angel Gabriel came while Daniel was still praying.'),
  Q('sb', 'On which day of Creation Week did God place the sun, moon, and stars in the sky?', 'The fourth day', ['The second day', 'The sixth day', 'The first day'], 'Genesis 1:14–19', 'Light came first, and on the fourth day the sun, moon, and stars were set in the heavens.'),
  Q('sb', 'Paul calls which commandment “the first commandment with promise”?', 'Honour thy father and mother', ['Remember the Sabbath day', 'Thou shalt not steal', 'Thou shalt not kill'], 'Ephesians 6:2–3', 'The promise is that it may be well with you and you may live long on the earth.'),
  Q('sb', 'What did God breathe into Adam’s nostrils to make him a living soul?', 'The breath of life', ['The Holy Spirit', 'A new name', 'Wisdom'], 'Genesis 2:7', 'God formed Adam from the dust, then breathed life into him.'),

  ["Hain niini ang DILI usa sa pito ka iglesia sa Pinadayag?", "Corinto", ["Efeso", "Smirna", "Laodicea"], "Ang pito mao ang Efeso, Smirna, Pergamo, Tiatira, Sardis, Filadelfia ug Laodicea."],
  ["Unsa ang giingon sa unang anghel sa Pinadayag 14 nga miabot na?", "Ang takna sa Iyang paghukom", ["Ang adlaw sa pahulay", "Ang kombira sa kasal", "Ang kataposan sa gutom"], "Gitawag usab sa unang anghel ang tanan sa pagkahadlok sa Dios, sa pagpasidungog Kaniya, ug sa pagsimba sa Magbubuhat."],
  ["Subay sa Pinadayag 14:12, ang mga santos nagtuman sa mga sugo sa Dios ug adunay unsa?", "Ang pagtuo ni Jesus", ["Ang bahandi sa mga hari", "Ang kaalam ni Solomon", "Ang kusog ni Samson"], "Ang pagtuman ug pagtuo magkauban diha sa mensahe sa kataposang panahon."],
  ["Sa Pinadayag 19:10, ang pagpamatuod ni Jesus mao ang espiritu sa unsa?", "Tagna", ["Kamatuoran", "Kaalam", "Grasya"], "Gihiusa usab sa Pinadayag 12:17 ang pagpamatuod ni Jesukristo sa nahibiling katawhan sa Dios."],
  ["Sumala sa Mateo 24:14, unsa ang angay mahitabo sa dili pa moabot ang kataposan?", "Ang ebanghelyo igawali sa tibuok kalibotan isip pagpamatuod sa tanang nasud", ["Ang tanang gingharian magkahiusa sa usa", "Tukoron pag-usab ang templo", "Ang matag tawo bawtismohan"], "Kini nga bersikulo mao ang nagdasig sa mga Adventista alang sa misyon sa tibuok kalibotan."],
  ["Unsang katapusang saad ang gihimo ni Jesus sa Pinadayag 22:20?", "Sa pagkamatuod moanhi ako sa madali", ["Tukoron ko ang akong iglesia", "Ania ako uban kaninyo kanunay", "Ang kalinaw akong gibilin kaninyo"], "Mitubag si Juan, “Amen. Umari ka, Ginoong Jesus.”"],
  ["Sa Binuhatan 1:11, giunsa pag-ingon sa mga anghel ang pagbalik ni Jesus?", "Sa samang paagi nga mitungas Siya sa langit", ["Isip usa ka masuso sa Betlehem", "Sa tago ngadto sa pipila", "Sa espiritu lamang pinaagi sa iglesia"], "Ang pagbalik ni Jesus personal, makita sa tanan ug mahimayaon (Pinadayag 1:7)."],
  ["Subay sa 1 Tesalonica 4:16, kinsa ang unang mabanhaw sa dihang mokanaog ang Ginoo gikan sa langit?", "Ang mga patay diha kang Kristo", ["Ang mga buhi pa sa yuta", "Ang mga anghel", "Ang mga dautan nga patay"], "Unya ang mga matarong nga buhi pa dad-on uban kanila aron mosugat sa Ginoo."],
  ["Sa Pinadayag 21, unsa ang nakita ni Juan nga mikanaog gikan sa Dios gikan sa langit?", "Ang balaang siyudad, ang Bag-ong Jerusalem", ["Usa ka gamhanang kasundalohan", "Ang arka sa pakigsaad", "Usa ka dakong puti nga trono"], "Maghimo ang Dios og usa ka bag-ong langit ug usa ka bag-ong yuta, ug pahiran ang matag luha."],
  ["Hain nga sugo ang nagsugod sa pulong nga “Handumi”?", "Ang ikaupat (ang Igpapahulay)", ["Ang una (walay laing dios)", "Ang ikalima (tahora ang inyong ginikanan)", "Ang ikanapulo (ayaw pagpangandoy)"], "Ang sugo bahin sa Igpapahulay nagtumong balik sa Paglalang: gihimo sa Dios ang tanan sulod sa unom ka adlaw ug mipahulay sa ikapito."],
  ["Kanus-a unang gipanalanginan ug gibalaan sa Dios ang ikapitong adlaw?", "Sa Paglalang, sa Eden", ["Sa Bukid sa Sinai", "Sa mga adlaw ni Nehemias", "Sa natawo si Jesus"], "Ang Igpapahulay gihatag sa wala pa ang sala ug sa wala pa ang Israel isip nasud."],
  ["Sa Marcos 2:27, para kang kinsa giingon ni Jesus nga gihimo ang Igpapahulay?", "Para sa tawo", ["Para sa Israel lamang", "Para sa mga pari", "Para sa mga anghel"], "Gidugang ni Jesus nga Siya Ginoo usab sa Igpapahulay."],
  ["Unsa ang naandan ni Jesus sa Adlaw nga Igpapahulay?", "Pagsimba sa sinagoga", ["Pagbiyahe ngadto sa Jerusalem", "Pagpuasa nga nag-inusara sa kamingawan", "Pagtrabaho isip panday-kahoy"], "Si Lucas nag-ingon nga sumala sa iyang naandan, misulod siya sa sinagoga sa adlaw nga igpapahulay."],
  ["Human gilubong si Jesus, unsa ang gibuhat sa mga babaye sa Adlaw nga Igpapahulay?", "Mipahulay sumala sa sugo", ["Gihiloan ang Iyang lawas sa lubnganan", "Mibalik sa Galilea", "Nagtudlo sa templo"], "Gituman nila ang Igpapahulay bisan sa ilang kalisod, ug miadto sa lubnganan sa unang adlaw sa semana."],
  ["Diin gisulat sa Dios ang Napulo ka Sugo?", "Sa duha ka papan nga bato", ["Sa mga linukot nga papiro", "Sa mga plato nga tumbaga", "Sa paril sa templo"], "Gisulat kini pinaagi sa tudlo sa Dios."],
  ["Subay sa 1 Mga Hari 8:9, unsa ang diha sa sulod sa arka sa pakigsaad?", "Ang duha ka papan nga bato", ["Ang bulawan nga tangkal sa suga", "Ang tinapay sa atubangan", "Ang abo sa halaran"], "Ang balaod sa Dios anaa sa kinasingkasing sa santuaryo, ilalom sa lingkoranan sa kaluoy."],
  ["Subay sa Hebreo 8:1–2, asa nag-alagad si Jesus isip atong Labawng Pari?", "Sa langitnong santuaryo", ["Sa templo sa Jerusalem", "Sa Bukid sa mga Olibo", "Sa sinagoga sa Nazaret"], "Ang yutan-ong santuaryo kopya ug landong sa mga butang sa langit (Hebreo 8:5)."],
  ["Giunsa pagbatbat ni Jesus ang kamatayon ni Lazaro sa Juan 11:11?", "Pagkatulog", ["Usa ka panaw", "Usa ka silot", "Usa ka kausaban"], "Miingon si Jesus nga ang atong higala nga si Lazaro natulog, ug moadto Siya aron pagmata kaniya."],
  ["Subay sa Ecclesiastes 9:5, unsa ang nahibaloan sa mga patay?", "Walay bisan unsa", ["Tanang butang", "Ang umaabot", "Ang gibuhat sa mga buhi"], "Gitudlo sa Bibliya nga ang mga patay nagapahulay hangtod sa pagkabanhaw sa pagbalik ni Kristo."],
  ["Unsang bahin sa atong kita ang gitawag sa Kasulatan nga ikapulo?", "Ang ikanapulo (usa sa napulo)", ["Ang ikalima", "Ang ikatulo", "Ang katunga"], "Ang ikapulo balaan sa Ginoo ug gibalik Kaniya uban sa pagkamatinud-anon."],
  ["Sa Daniel 1, unsa ang gihangyo ni Daniel nga kan-on puli sa pagkaon sa hari?", "Mga utanon ug tubig", ["Isda ug tinapay", "Dugos ug gatas", "Karnero ug bino"], "Human sa napulo ka adlaw, si Daniel ug ang iyang mga higala daw mas himsog kay sa tanan nga mikaon sa bahin sa hari."],
  ["Unsa ang gitawag ni Pablo sa imong lawas sa 1 Corinto 6:19?", "Ang templo sa Balaang Espiritu", ["Usa ka palas-anon nga dad-on", "Alagad sa hunahuna", "Usa ka tanaman sa kalingawan"], "Busa, matod ni Pablo, ipadayag ang himaya sa Dios diha sa inyong lawas."],
  ["Sa Roma 6:23, unsa ang suhol sa sala?", "Kamatayon", ["Kaulaw", "Pagkadestiyero", "Kasubo"], "Apan ang gasa sa Dios mao ang kinabuhing dayon pinaagi ni Jesukristo nga atong Ginoo."],
  ["Subay sa Roma 6:4, ang bawtismo nagpakita sa paglubong uban kang Kristo aron makalakaw kita sa unsa?", "Bag-ong kinabuhi", ["Kahadlok sa paghukom", "Ang daang pakigsaad", "Hingpit nga kahupayan"], "Ang bawtismo pinaagi sa pagpalumos nagpakita sa kamatayon sa daang kinabuhi ug pagkabanhaw ngadto sa bag-o."],
  ["Unsa nga tuiga nahitabo ang Dakong Pagkadismaya, sa dihang gipaabot sa unang mga Adventista ang pagbalik ni Kristo?", "1844", ["1798", "1863", "1888"], "Oktubre 22, 1844 kadto. Daghan ang nagtuon sa Bibliya ug sa ulahi nakasabot sa mensahe sa santuaryo."],
  ["Unsa nga tuiga pormal nga giorganisar ang Simbahan sa Seventh-day Adventist?", "1863", ["1844", "1888", "1915"], "Giorganisar ang General Conference sa Battle Creek, Michigan."],
  ["Hain nga unang pioneer, kanhi kapitan sa barko, ang nagtabang sa pagpaila sa ikapitong adlaw nga Igpapahulay sa unang mga Adventista?", "Joseph Bates", ["William Miller", "John Harvey Kellogg", "Uriah Smith"], "Si Joseph Bates usa ka co-founder sa Simbahang Adventista uban nila James ug Ellen White."],
  ["Pila ka Pundamental nga Pagtuo ang gitudlo karon sa Simbahan sa Seventh-day Adventist?", "28", ["10", "22", "36"], "Naglakip kini sa Kasulatan, Dios, kaluwasan, iglesia, Igpapahulay, santuaryo, pagbalik ni Kristo ug uban pa."],
  ["Hain nga mag-uuma nga nahimong magwawali ang mipukaw sa pagmata sa Advent sa 1840s sa Amerika?", "William Miller", ["Martin Luther", "John Wesley", "Charles Spurgeon"], "Gitun-an ni Miller ang mga tagna ni Daniel ug mipanudlo nga hapit na ang pagbalik ni Kristo."],
  ["Unsay gitumong sa Advent sa pulong nga Adventista?", "Ang pag-abot ni Kristo", ["Ang Adlaw nga Igpapahulay", "Ang mga gasa sa Espiritu", "Ang Reporma"], "Ang mga Adventista nagtinguha sa bulahan nga paglaum ug sa mahimayaong pagpadayag sa atong Dios ug Manluluwas nga si Jesukristo."],
  /* More questions */
  ["Unsa ang gipadala sa Dios aron pakan-on ang Israel sa kamingawan?", "Manna", ["Mga dulon (locust)", "Tinapay nga sebada", "Isda gikan sa dagat"], "Matag buntag mihugsak ang manna sa palibot sa kampo—tinapay gikan sa langit."],
  ["Kinsa ang unang hari sa Israel?", "Saul", ["David", "Solomon", "Samuel"], "Gidihogan siya ni Samuel sumala sa gitugyan sa Dios."],
  ["Pila ka adlaw ug gabii ang ulan sa panahon sa lunop?", "Kap-atan", ["Pito", "Napulo", "Usa ka gatos"], "Human niini, ang tubig nagpabilin sa yuta sulod sa 150 ka adlaw."],
  ["Hain nga propeta ang gitawag sa Dios isip bata pa sa dihang nadungog niya ang tingog sa kagabhion?", "Samuel", ["Isaias", "Jeremias", "Eliseo"], "Mitubag si Samuel nga mosulti na ang Ginoo kay ang Iyang sulugoon namati."],
  ["Kinsa ang nagpasabot sa sinulat sa bungbong sa kombira ni Belsasar?", "Daniel", ["Ezequiel", "Mardokeo", "Nehemias"], "Ang mga pulong mao ang “Mene, Mene, Tekel, Upharsin”—ug nahulog ang Babilonia nianang gabii."],
  ["Pila ka tinapay ug isda ang gigamit ni Jesus sa pagpakaon sa lima ka libo?", "Lima ka tinapay ug duha ka isda", ["Pito ka tinapay ug pipila ka isda", "Napulo ug duha ka tinapay ug usa ka isda", "Tulo ka tinapay ug lima ka isda"], "Napulo ug duha ka bukag ang nahibilin nga gitigom human niini."],
  ["Unsa ang hitsura sa Espiritu Santo sa dihang mikanaog kang Jesus sa Iyang bawtismo?", "Usa ka salampati", ["Usa ka agila", "Usa ka dila sa kalayo", "Usa ka panganod"], "Gikan sa langit miingon ang Amahan nga Siya ang hinigugma Niyang Anak."],
  ["Asa gisulayan sa yawa si Jesus sulod sa kap-atan ka adlaw?", "Sa kamingawan", ["Sa Tanaman sa Getsemani", "Sa Dagat sa Galilea", "Sa Bukid sa Sinai"], "Gibuntog ni Jesus ang matag pagsulay pinaagi sa pag-ingon, “Nahisulat na.”"],
  ["Unsa ang giingon ni Jesus nga labing dako nga sugo?", "Higugmaa ang Ginoo nga imong Dios sa tibuok nimong kasingkasing, kalag ug hunahuna", ["Tahora ang imong amahan ug inahan", "Handumi ang adlaw nga Igpapahulay", "Ayaw pagpanumbaling sa bakak"], "Ang ikaduha, matod ni Jesus, mao ang paghigugma sa imong silingan sama sa imong kaugalingon."],
  ["Sa Juan 14:15, miingon si Jesus, “Kon nahigugma kamo kanako…” unsa?", "tumana ang akong mga sugo", ["hatagi ako og daghang kuwarta", "tukora ako og templo", "magpuasa matag adlaw"], "Ang gugma ug pagtuman maghiusa. Ang pagtuman mao ang bunga sa gugma."],
  ["Subay sa Juan 1:1–3, kinsa ang naglalang sa tanang butang?", "Ang Pulong, nga mao si Jesus", ["Ang mga anghel", "Ang mga propeta", "Ang kinaiyahan mismo"], "Ang tanang butang gibuhat pinaagi Kaniya. Si Jesus mao ang atong Magbubuhat ug Manluluwas."],
  ["Unsa ang giingon sa Hebreo 4:9 nga nahabilin alang sa katawhan sa Dios?", "Usa ka pahulay", ["Usa ka templo", "Usa ka gingharian", "Usa ka halad"], "Daghang estudyante sa Bibliya ang nakakita niini nga bersikulo sa pagtuman sa Igpapahulay."],
  ["Kinsa nga co-founder sa Simbahang Adventista ang nagsulat sa librong “Steps to Christ”?", "Ellen G. White", ["Joseph Bates", "J. N. Andrews", "Uriah Smith"], "Kini usa ka hinigugma nga pasiuna sa gugma ni Jesus."],
  ["Unsa ang labing taas nga lebel sa organisasyon sa Simbahang Adventista?", "Ang General Conference", ["Ang Synod", "Ang Diocese", "Ang Presbytery"], "Ang mga lokal nga iglesia naghiusa sa mga conference, ug kining tanan nagkahiusa isip usa ka pamilya sa tibuok kalibotan."],
  ["Kinsa ang igsoon ni Moises nga nagsulti alang kaniya ngadto kang Faraon?", "Aaron", ["Josue", "Caleb", "Eleazar"], "Gipadala sa Dios si Aaron aron mosulti alang kang Moises, kay gibati ni Moises nga dili siya maayong manulti."],
  ["Hain nga siyudad ang mga paril nahugno human naglibot ang Israel niini sulod sa pito ka adlaw?", "Jerico", ["Ai", "Betel", "Hebron"], "Sa ikapitong adlaw pito ka higayon sila naglibot, misinggit, ug natumba ang paril."],
  ["Hain nga babaye ang nag-ampo og anak ug human niini gihatag kini sa pag-alagad sa Dios sa tabernakulo?", "Ana", ["Sara", "Raquel", "Rebeca"], "Ang iyang anak mao si Samuel, nga midako nga nag-alagad sa Ginoo."],
  ["Kinsa ang miingon kang Noemi, “Ang imong katawhan mao ang akong katawhan, ug ang imong Dios mao ang akong Dios”?", "Rut", ["Orpa", "Ester", "Rahab"], "Si Rut, usa ka Moabihanon, mipili sa pagsunod sa tinuod nga Dios ug nahimong katigulangan ni Haring David."],
  ["Pila ang mga anak nga lalaki ni Jacob?", "Napulog duha", ["Napulo", "Pito", "Napulog upat"], "Ang iyang napulog duha ka anak nahimong napulog duha ka tribo sa Israel."],
  ["Unsang tanaman ang gibutang sa Dios kang Adan ug Eva?", "Eden", ["Getsemani", "Carmelo", "Gosen"], "Gitanom sa Dios ang tanaman sa Eden sa sidlakan ug didto gibutang ang tawo."],
  ["Sa Bukid sa Carmelo, hain nga propeta ang naghagit sa mga propeta ni Baal?", "Elias", ["Eliseo", "Isaias", "Samuel"], "Mitugpa ang kalayo gikan sa langit, ug misinggit ang katawhan, “Ang Ginoo, siya mao ang Dios.”"],
  ["Kinsa ang nanguna sa pagtukod pag-usab sa mga paril sa Jerusalem, nga nahuman sulod lamang sa 52 ka adlaw?", "Nehemias", ["Esdras", "Zorobabel", "Ageo"], "Si Nehemias nag-ampo ug nagplano, ug ang katawhan nagtinabangay sa pagtrabaho sa tibuok nilang kasingkasing."],
  ["Kinsa ang nawad-an og mga anak ug bahandi apan miingon, “Ang Ginoo ang naghatag, ug ang Ginoo ang nagkuha”?", "Job", ["Jacob", "Ezequias", "Jeremias"], "Nagpabilin nga matinud-anon si Job, ug sa ulahi gibalik sa Dios ang iyang mga bahandi."],
  ["Unsay gisugo sa Dios sa Israel nga tukoron aron makapuyo Siya taliwala nila?", "Usa ka santuaryo", ["Usa ka palasyo", "Usa ka dakong paril", "Usa ka tore nga bato"], "Ang santuaryo nagtudlo sa Israel bahin sa presensya sa Dios ug sa Iyang plano sa pagluwas sa mga makasasala."],
  ["Unsay gisulayan sa katawhan nga tukoron sa Babel aron makaabot sa langit?", "Usa ka tore", ["Usa ka tulay", "Usa ka dakong paril", "Usa ka halaran"], "Gikalibog sa Dios ang ilang pinulongan, ug nagkatibulaag sila sa tibuok yuta."],
  ["Kinsa ang kaluha nga igsoon ni Jacob?", "Esau", ["Laban", "Ismael", "Ruben"], "Gibaligya ni Esau ang iyang katungod isip panganay alang sa usa ka panaksan nga sinabawan."],
  ["Hain nga propeta ang nag-ampo nga maablihan ang mga mata sa iyang sulugoon aron makita ang mga kabayo ug karwahe nga kalayo?", "Eliseo", ["Elias", "Isaias", "Jeremias"], "Miingon si Eliseo, “Mas daghan kadtong atua kanato kay kanila.”"],
  ["Uban sa 300 lamang ka tawo, unsay gidala sa mga sundalo ni Gideon batok sa Madian?", "Mga trumpeta, banga, ug sulo", ["Mga espada ug taming", "Mga tirador ug bato", "Mga karwahe ug bangkaw"], "Gihatag sa Dios ang kadaugan aron mahibalo ang Israel nga ang gahom iya Niya."],
  ["Hain nga anghel ang nagmantala kang Maria nga manganak siya kang Jesus?", "Gabriel", ["Miguel", "Rafael", "Uriel"], "Miingon si Gabriel, “Ngalanan mo siyag JESUS.”"],
  ["Unsa nga mga gasa ang gidala sa mga maalamon nga tawo ngadto sa bata nga si Jesus?", "Bulawan, insenso, ug mira", ["Plata, bino, ug lana", "Tinapay, isda, ug dugos", "Delak, mga panakot, ug asin"], "Misimba sila Kaniya ug gibuksan ang ilang mga bahandi."],
  ["Kinsa ang mibudhi kang Jesus sa Iyang mga kaaway alang sa katloan ka pirasong plata?", "Judas Iskariote", ["Tomas", "Andres", "Bartolome"], "Nagbasol si Judas sa ulahi, apan ulahi na kaayo aron mabawi pa kini."],
  ["Kinsa ang mihunong sa pagtabang sa nasamdan nga tawo sa sambingay ni Jesus bahin sa maluluy-ong Samarianhon?", "Usa ka Samarianhon", ["Usa ka pari", "Usa ka Levihanon", "Usa ka Pariseo"], "Gitapos ni Jesus ang sambingay sa pag-ingon, “Lakaw ug buhata usab kana.”"],
  ["Unsay giingon ni Jesus sa mabangis nga dagat sa Lawa sa Galilea?", "“Hilom! Pagmalinawon!”", ["“Gawas!”", "“Mahimong may kahayag”", "“Sunod kanako”"], "Mihunong ang hangin ug nahimong hilom kaayo."],
  ["Hain nga apostol ang nagsulat sa kinadak-ang gidaghanon sa mga sulat sa Bag-ong Tugon?", "Pablo", ["Pedro", "Juan", "Santiago"], "Nagsulat si Pablo sa mga iglesia ug mga higala gikan sa daghang dapit, bisan sa bilanggoan."],
  ["Hain nga tinun-an ang migawas sa sakayan ug naglakaw sa tubig padulong kang Jesus?", "Pedro", ["Juan", "Andres", "Santiago"], "Nagsugod sa paglumos si Pedro sa pagtan-aw niya sa mga balod, ug gikuptan siya ni Jesus."],
  ["Hain nga Maayong Balita ang gisulat sa usa ka kanhi maniningil og buhis?", "Mateo", ["Marcos", "Lucas", "Juan"], "Gitawag ni Jesus si Mateo gikan sa iyang lingkoranan sa buhis, ug gibiyaan niya ang tanan aron mosunod Kaniya."],
  ["Unsay nagpakita sa ibabaw sa mga ulo sa mga tinun-an sa Adlaw sa Pentekostes?", "Mga dila nga daw kalayo", ["Mga salampati nga kahayag", "Usa ka balangaw", "Usa ka haligi sa panganod"], "Napuno sila sa Balaang Espiritu ug nagsugod sa pagsulti sa ubang mga pinulongan."],
  ["Kinsa ang gobernador Romano nga nagsugo nga ilansang si Jesus?", "Poncio Pilato", ["Cesar Augusto", "Felix", "Festo"], "Naghugas si Pilato sa iyang mga kamot, apan gihatag gihapon niya ang sugo."],
  ["Hain nga kauban ni Pablo ang miawit og pagdayeg uban niya sa bilanggoan sa Filipos?", "Silas", ["Timoteo", "Bernabe", "Lucas"], "Gibukhad sa linog ang mga pultahan, ug mituo ang magbalantay sa bilanggoan."],
  ["Pila ka higayon giingon ni Jesus nga kinahanglan natong pasayloon ang nakasala kanato?", "Kapitoan ka higayon nga kapito", ["Pito ka higayon", "Tulo ka higayon", "Kausa lang"], "Walay kinutoban ang pagpasaylo."],
  ["Unsay gihimo sa amahan sa pagkakita niya sa iyang nawala nga anak nga mopauli?", "Midagan siya ug gigakos ang iyang anak", ["Gipapahawa niya ang iyang anak", "Naghulat siya sa balay", "Mihangyo siya og bayad"], "Gidawat sa amahan ang iyang anak uban ang bisti, singsing, ug salo-salo."],
  ["Kinsa ang nagsulat sa libro sa Binuhatan?", "Lucas", ["Pedro", "Pablo", "Juan"], "Gisulatan ni Lucas si Teofilo sa iyang Maayong Balita ug sa Binuhatan."],
  ["Kinsa ang amahan ni Juan Bautista?", "Zacarias", ["Jose", "Simeon", "Nicodemo"], "Gisultihan sa anghel si Zacarias nga manganak ang iyang asawa nga si Elisabet og usa ka anak nga lalaki."],
  ["Sa Daniel 3, unsay gisugo sa tanan sa pagpatugtog sa musika?", "Moluhod sa bulawanong larawan", ["Maghalad og nating karnero sa halaran", "Moawit sa awit sa adlawng natawhan sa hari", "Magdala og mga gasa sa rayna"], "Si Sadrac, Mesac, ug Abednego mibalibad sa pagluhod ug gisalibay sa hudno."],
  ["Sa Daniel 4, unsay nahitabo kang Haring Nabucodonosor tungod sa iyang garbo?", "Nagpuyo siya nga daw mananap sa kapatagan", ["Gibilanggo siya sa Ehipto", "Nabuta siya sa iyang palasyo", "Nawala ang iyang gingharian ngadto sa iyang anak"], "Nahibalik ang iyang pangatarungan human sa pipila ka panahon, ug iyang gidayeg ang Labing Hataas."],
  ["Sa Daniel 6, kinsa ang nanglimbong kang Haring Dario aron pirmahan ang sugo batok sa pag-ampo?", "Mga opisyal nga naimbidoso", ["Ang tulo ka higala ni Daniel", "Ang inahan sa rayna", "Ang mga pari sa templo sa Juda"], "Wala silay nakitang sayop kang Daniel gawas sa iyang pagkamatinud-anon sa Dios."],
  ["Sa Daniel 2, unsay gihimo sa tiil sa dakong larawan?", "Puthaw nga gisagolan og lapok", ["Lunsay nga bulawan", "Tumbaga ug plata", "Kahoy ug bato"], "Ang gisagol nga mga tiil nagpakita sa gibahin nga kalibotan hangtod moabot ang gingharian sa Dios."],
  ["Sa Daniel 2, unsang gingharian ang girepresentahan sa dughan ug mga bukton nga plata?", "Medo-Persia", ["Babilonia", "Gresya", "Roma"], "Gingalanan sa Daniel 8:20 ang mga hari sa Media ug Persia."],
  ["Unsang adlawa miingon si Juan nga siya “diha sa Espiritu” sa dihang nadawat niya ang Pinadayag?", "Ang adlaw sa Ginoo", ["Ang Paskuwa", "Ang Pentekostes", "Ang Adlaw sa Pagpasaylo"], "Nakita sa mga Adventista nga mao kini ang Igpapahulay, nga gitawag sa Kasulatan nga adlaw sa Ginoo (Isaias 58:13)."],
  ["Sa hain nga iglesia miingon si Jesus, “Tan-awa, nagatindog ako sa pultahan ug nagatuktok”?", "Laodicea", ["Efeso", "Smirna", "Sardis"], "Nanaad si Jesus nga mosulod ug mokaon uban sa si bisan kinsa nga moabli sa pultahan."],
  ["Pila ang gisilyohan gikan sa mga tribo sa Israel sa Pinadayag 7?", "144,000", ["7,000", "24,000", "1,000"], "Gimarkahan sila sa silyo sa Dios sa ilang agtang."],
  ["Sa Pinadayag 21:4, unsay papahawaon sa Dios gikan sa atong mga mata?", "Ang tanang luha", ["Ang tanang abog", "Ang tanang katulog", "Ang tanang landong"], "Wala na ang kamatayon, kasubo, paghilak, o kasakit."],
  ["Sa Pinadayag 22:1, unsay nakita ni Juan nga migawas gikan sa trono sa Dios?", "Usa ka lunsay nga suba sa tubig nga nagahatag og kinabuhi", ["Usa ka bulawanong hagdanan", "Usa ka nagadilaab nga espada", "Usa ka kusog nga hangin"], "Sa duha ka daplin sa suba nagtindog ang kahoy sa kinabuhi."],
