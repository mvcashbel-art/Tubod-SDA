    fullscreen: 'Tibuok screen', exitFull: 'Gawas sa tibuok screen', bigger: 'Mas dako', smaller: 'Mas gamay'
  }
};
let LANG = store.get('lang', 'en'); if (LANG !== 'ceb') LANG = 'en';
const t = k => { const v = T[LANG][k]; return v !== undefined ? v : T.en[k]; };
const CATN = () => LANG === 'ceb' ? { ot: 'Daang Kasabotan', nt: 'Bag-ong Kasabotan', pr: 'Daniel ug Pinadayag', sb: 'Igpapahulay ug mga Pagtu-o', ah: 'Kabilin sa mga Adventista' } : CAT;
const BOOKS = () => LANG === 'ceb' ? BOOKS_CEB : BOOKS_EN;

/* ---------- State ---------- */
const CLUE_PTS = [100, 70, 40, 20];
const BOOK_SIZES = [4, 4, 5, 5, 6, 6];
const SOLO_N = { quiz: 10, verse: 8, who: 6 };
let S = {};
function freshState(mode, cat, names) {
  return { mode, cat, names: names || [t('p1'), t('p2')], items: [], i: 0, score: 0, streak: 0, bestStreak: 0, correct: 0,
           lifelines: 2, usedFifty: false, answered: false, timer: null, timeLeft: 20, clue: 0, gone: new Set(),
           placed: [], checked: false, lastPts: 0, lastPerfect: false,
           ps: [0, 0], pstreak: [0, 0], pcorrect: [0, 0], turn: 0 };
}
const isQ = () => S.mode === 'quiz' || S.mode === 'duel';
function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

/* ---------- Chrome ---------- */
function setChrome(view) {
  const onHome = view === 'home';
  homeTop.hidden = onHome; homeTop.textContent = t('home');
  langBox.hidden = !onHome;
  langBox.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  document.documentElement.lang = LANG === 'ceb' ? 'ceb' : 'en';
  labelControls();
}

/* ---------- Fit to screen, bigger/smaller text, full screen ---------- */
const wrapEl = document.querySelector('.wrap');
const fsBtn = document.getElementById('fsBtn');
const docEl = document.documentElement;
const canFull = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
let ADJ = Number(store.get('adj', 1)); if (!(ADJ >= 0.8 && ADJ <= 1.6)) ADJ = 1;
function fit() {
  /* grow the whole game to fill big windows; phones stay as they are */
  const wide = window.innerWidth >= 900;
  const auto = Math.max(1, Math.min(window.innerWidth / (wide ? 960 : 700), window.innerHeight / 620, 2.2));
  wrapEl.style.zoom = (auto * ADJ).toFixed(3);
}
function labelControls() {
  const set = (id, key) => { const b = document.getElementById(id); if (b) { b.title = t(key); b.setAttribute('aria-label', t(key)); } };
  set('szUp', 'bigger'); set('szDown', 'smaller'); set('fsBtn', isFull() ? 'exitFull' : 'fullscreen');
}
function toggleFull() {
  try {
    if (isFull()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else { const p = (docEl.requestFullscreen || docEl.webkitRequestFullscreen).call(docEl); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
}
function resize(step) {
  ADJ = Math.min(1.6, Math.max(0.8, Math.round((ADJ + step) * 10) / 10));
  store.set('adj', ADJ); fit();
}
if (fsBtn && !canFull) fsBtn.hidden = true;
window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', () => { labelControls(); fit(); });
document.addEventListener('webkitfullscreenchange', () => { labelControls(); fit(); });
fit();

/* ---------- Home and setup ---------- */
function renderHome() {
  stopTimer(); S = {}; setChrome('home');
  const best = store.get('best', {});
  const card = (mode, ico) => `
    <button class="mode" data-act="mode" data-mode="${mode}">
      <div class="ico">${ico}</div>
      <div><h3>${t('m_' + mode + '_t')}</h3><p>${t('m_' + mode + '_d')}</p></div>
      ${mode === 'duel' ? '' : `<div class="best">${t('best')}<b>${best[mode] || 0}</b></div>`}
    </button>`;
  app.innerHTML = `
    <section class="hero">
      <h1>Scripture <em>Quest</em></h1>
      <p>${t('heroP')}</p>
      <div class="verse-line">${t('verseLine')}</div>
    </section>
    <section class="modes">
      ${card('quiz', '?')}
      ${card('verse', '“')}
      ${card('who', '☺')}
      ${card('books', '≡')}
      ${card('duel', 'VS')}
    </section>
    <p class="foot">${t('foot')}</p>`;
}

function catButtons(act) {
  const names = CATN();
  const count = k => k === 'all' ? QUIZ.length : QUIZ.filter(q => q.c === k).length;
  const cats = [['all', t('allCats')]].concat(Object.keys(CAT).map(k => [k, names[k]]));
  return `<div class="cats">${cats.map(([k, name]) => `<button class="cat" data-act="${act}" data-cat="${k}">${name}<small>${t('nQ')(count(k))}</small></button>`).join('')}</div>`;
}

function renderCats() {
  setChrome('play');
  app.innerHTML = `<div class="card"><h2>${t('chooseCat')}</h2><p class="sub">${t('catSub')}</p>${catButtons('cat')}</div>`;
}

function renderDuelSetup() {
  setChrome('play');
  app.innerHTML = `
    <div class="card">
      <h2>${t('duelTitle')}</h2>
      <p class="sub">${t('duelSub')}</p>
      <div class="names">
        <input id="n1" maxlength="14" placeholder="${t('p1')}" aria-label="${t('p1')}">
        <input id="n2" maxlength="14" placeholder="${t('p2')}" aria-label="${t('p2')}">
      </div>
      <p class="sub">${t('pickCat')}</p>
      ${catButtons('duelcat')}
    </div>`;
}

/* ---------- Building a round ---------- */
function qItem(q) {
  const useC = LANG === 'ceb' && q.ceb;
  const L = useC ? q.ceb : q;
  const opts = shuffle([L.a, ...L.w]);
  return { c: q.c, q: L.q, opts, ci: opts.indexOf(L.a), r: useC ? refCeb(q.r) : q.r, n: L.n };
}

function startGame(mode, cat, names) {
  stopTimer();
  S = freshState(mode, cat, names);
  setChrome('play');
  if (mode === 'quiz' || mode === 'duel') {
    const pool = cat === 'all' ? QUIZ : QUIZ.filter(q => q.c === cat);
    let n = mode === 'duel' ? 10 : SOLO_N.quiz;
    n = Math.min(n, pool.length);
    if (mode === 'duel' && n % 2) n--;
    S.items = shuffle(pool).slice(0, n).map(qItem);
  } else if (mode === 'verse') {
    S.items = shuffle(VERSES).slice(0, SOLO_N.verse).map(v => {
      const opts = shuffle([v.a, ...v.d]);
      return Object.assign({}, v, { opts, ci: opts.indexOf(v.a) });
    });
  } else if (mode === 'who') {
    S.items = shuffle(WHO).slice(0, SOLO_N.who).map(w => {
      const idx = WHO.indexOf(w), c = LANG === 'ceb';
      const nameOf = x => c ? CEB_WHO[WHO.indexOf(x)].n : x.n;
      const others = shuffle(WHO.filter(x => x !== w)).slice(0, 3).map(nameOf);
      const name = c ? CEB_WHO[idx].n : w.n;
      const opts = shuffle([name, ...others]);
      return { n: name, r: c ? refCeb(w.r) : w.r, cl: c ? CEB_WHO[idx].c : w.c, opts, ci: opts.indexOf(name) };
    });
  } else {
    S.items = BOOK_SIZES.map(size => {
      const idx = shuffle(BOOKS_EN.map((_, i) => i)).slice(0, size).sort((a, b) => a - b);
      let tiles = shuffle(idx);
      for (let tries = 0; tries < 5 && tiles.every((b, k) => b === idx[k]); tries++) tiles = shuffle(idx);
      return { idx, tiles };
    });
  }
  renderStep();
}

/* ---------- HUD ---------- */
function hud() {
  const total = S.items.length, label = S.mode === 'books' ? t('round') : t('m_' + S.mode + '_t');
  const prog = `<div class="prog"><i style="width:${(S.i / total) * 100}%"></i></div>`;
  if (S.mode === 'duel') {
    const p = i => `<div class="pl ${S.turn === i ? 'on' : ''}"><span>${esc(S.names[i])}</span><b id="ps${i}">${S.ps[i]}</b></div>`;
    return `<div class="duelhud">${p(0)}${p(1)}</div><div class="hud"><div>${label} · <b>${S.i + 1}</b> / ${total}</div></div>${prog}`;
  }
  return `
    <div class="hud">
      <div>${label} · <b>${S.i + 1}</b> / ${total}</div>
      <div class="hs"><span>${t('score')} <b id="sc">${S.score}</b></span>${isQ() && S.streak > 1 || S.mode === 'verse' && S.streak > 1 ? `<span class="streak">${t('streak')} ×${S.streak}</span>` : ''}</div>
    </div>${prog}`;
}
function updateHud() {
  if (S.mode === 'duel') { [0, 1].forEach(i => { const e = document.getElementById('ps' + i); if (e) e.textContent = S.ps[i]; }); }
  else { const e = document.getElementById('sc'); if (e) e.textContent = S.score; }
}

/* ---------- Steps ---------- */
function optButtons(opts) {
  return opts.map((o, k) => `<button class="opt" data-act="pick" data-k="${k}"><b>${'ABCD'[k]}</b><span>${o}</span></button>`).join('');
}

function renderStep() {
  stopTimer();
  S.answered = false; S.usedFifty = false; S.clue = 0; S.gone = new Set(); S.placed = []; S.checked = false;
  S.turn = S.mode === 'duel' ? S.i % 2 : 0;
  if (S.mode === 'duel') renderPass();
  else if (S.mode === 'quiz') renderQuestion();
  else if (S.mode === 'verse') renderVerse();
  else if (S.mode === 'who') renderWho();
  else renderBooks();
}

function renderPass() {
  app.innerHTML = hud() + `
    <div class="card pass">
      <p class="sub">${t('passTo')}</p>
      <div class="who-big">${esc(S.names[S.turn])}</div>
      <button class="primary" data-act="ready">${t('ready')}</button>
    </div>`;
}

function renderQuestion() {
  const it = S.items[S.i];
  app.innerHTML = hud() + `
    <div class="card">
      <span class="tag">${CATN()[it.c]}</span>
      <h2>${it.q}</h2>
      <div class="timer"><i id="tbar"></i></div>
      <div class="opts" id="opts">${optButtons(it.opts)}</div>
      ${S.mode === 'quiz' ? `<div class="tools"><button class="ghost" id="fifty" data-act="fifty" ${S.lifelines < 1 ? 'disabled' : ''}>${t('lifeLeft')(S.lifelines)}</button></div>` : ''}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  startTimer();
}

function renderVerse() {
  const it = S.items[S.i];
  const text = it.t.replace('___', '<span class="blank" id="blank">______</span>');
  app.innerHTML = hud() + `
    <div class="card">
      <span class="tag">${t('verseTag')}</span>
      <div class="verse">${text}<span class="vref">${it.r} (KJV)</span></div>
      <div class="opts" id="opts">${optButtons(it.opts)}</div>
      <div id="fb" aria-live="polite"></div>
    </div>`;
}

function renderWho() {
  const it = S.items[S.i];
  const clues = it.cl.slice(0, S.clue + 1).map((c, k) => `<li><span>${t('clue')(k + 1)}</span>${c}</li>`).join('');
  const opts = it.opts.map((o, k) => `<button class="opt ${S.gone.has(k) ? 'gone' : ''}" data-act="pick" data-k="${k}" ${S.gone.has(k) || S.answered ? 'disabled' : ''}><b>${'ABCD'[k]}</b><span>${o}</span></button>`).join('');
  app.innerHTML = hud() + `
    <div class="card">
      <span class="tag">${t('m_who_t')}</span>
      <h2>${t('whoQ')}</h2>
      <ul class="clues">${clues}</ul>
      <p class="sub">${t('worth')(CLUE_PTS[S.clue])}</p>
      <div class="opts" id="opts">${opts}</div>
      <div class="tools">${S.clue < 3 ? `<button class="ghost" data-act="clue">${t('revealClue')}</button>` : ''}</div>
      <div id="fb" aria-live="polite"></div>
    </div>`;
}

function renderBooks() {
  const it = S.items[S.i], n = it.idx.length, names = BOOKS();
  const slots = it.idx.map((_, k) => {
    const b = S.placed[k];
    if (b == null) return `<li class="slot empty"><span class="num">${k + 1}</span></li>`;
    const cls = S.checked ? (it.idx[k] === b ? 'slot full good' : 'slot full bad') : 'slot full';
    const label = S.checked ? `<span class="bk">${names[b]}</span>` : `<button class="slotbtn" data-act="unplace" data-k="${k}">${names[b]}</button>`;
    return `<li class="${cls}"><span class="num">${k + 1}</span>${label}</li>`;
  }).join('');
  const rest = it.tiles.filter(b => !S.placed.includes(b));
  let tail = '';
  if (S.checked) {
    const order = it.idx.map(b => names[b]).join(' → ');
    const perfect = S.lastPerfect;
    tail = `<div class="fb ${perfect ? 'ok' : 'no'}">
        <h3>${perfect ? t('ok') : t('no')} <span class="pts">+${S.lastPts}</span></h3>
        <p><span class="ref">${t('correctOrder')}</span><br>${order}</p>
        <div class="row"><button class="primary" data-act="next">${S.i >= S.items.length - 1 ? t('seeResults') : t('next')}</button></div>
      </div>`;
  } else {
    tail = `<div class="tiles">${rest.map(b => `<button class="tile" data-act="place" data-b="${b}">${names[b]}</button>`).join('')}</div>
      <div class="tools">${S.placed.length === n ? `<button class="primary" data-act="check">${t('check')}</button>` : `<span class="hint">${t('booksHint')}</span>`}</div>`;
  }
  app.innerHTML = hud() + `
    <div class="card">
      <span class="tag">${t('m_books_t')}</span>
      <h2>${t('booksQ')}</h2>
      <ol class="slots">${slots}</ol>
      ${tail}
    </div>`;
}

function startTimer() {
  const bar = document.getElementById('tbar'), total = 20000, t0 = Date.now();
  S.timer = setInterval(() => {
    const left = Math.max(0, total - (Date.now() - t0));
    S.timeLeft = left / 1000;
    if (bar) { bar.style.width = (left / total * 100) + '%'; bar.classList.toggle('low', left < 6000); }
    if (left <= 0) answer(-1);
  }, 100);
}

/* ---------- Answers ---------- */
function feedback(ok, pts, ref, note, timeout) {
  const last = S.i >= S.items.length - 1;
  const head = ok ? t('ok') : (timeout ? t('timeUp') : t('no'));
  return `
    <div class="fb ${ok ? 'ok' : 'no'}">
      <h3>${head} ${ok ? `<span class="pts">+${pts}</span>` : ''}</h3>
      <div class="ref">${ref}</div>
      ${note ? `<p>${note}</p>` : ''}
      <div class="row"><button class="primary" data-act="next">${last ? t('seeResults') : t('next')}</button></div>
    </div>`;
}
function lockOptions(correctK, pickedK) {
  document.querySelectorAll('#opts .opt').forEach((b, k) => {
    b.disabled = true;
    if (k === correctK) b.classList.add('right');
    else if (k === pickedK) b.classList.add('wrong');
  });
}
function showFb(html) {
  const fb = document.getElementById('fb');
  fb.innerHTML = html;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function answer(k) {
  if (S.answered) return;
  const it = S.items[S.i];

  if (S.mode === 'who') {
    if (k === it.ci) {
      S.answered = true;
      const pts = CLUE_PTS[S.clue];
      S.score += pts; S.correct++;
      lockOptions(it.ci, -1);
      document.querySelectorAll('#opts .opt').forEach(b => b.classList.remove('gone'));
      const tl = document.querySelector('.tools'); if (tl) tl.innerHTML = '';
      updateHud();
      showFb(feedback(true, pts, it.n + ' · ' + it.r, ''));
    } else {
      S.gone.add(k);
      if (S.clue < 3) { S.clue++; renderWho(); }
      else {
        S.answered = true;
        lockOptions(it.ci, k);
        const tl = document.querySelector('.tools'); if (tl) tl.innerHTML = '';
        showFb(feedback(false, 0, t('itWas') + it.n + ' · ' + it.r, ''));
      }
    }
    return;
  }

  S.answered = true; stopTimer();
  const ok = k === it.ci, duel = S.mode === 'duel', p = S.turn;
  let pts = 0;
  const streak = duel ? S.pstreak[p] : S.streak;
  if (ok) {
    pts = 100 + Math.min(streak, 5) * 10;
    if (isQ()) pts += Math.round((S.timeLeft / 20) * 50);
    if (duel) { S.ps[p] += pts; S.pcorrect[p]++; S.pstreak[p]++; }
    else { S.score += pts; S.correct++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); }
  } else if (duel) S.pstreak[p] = 0; else S.streak = 0;
  lockOptions(it.ci, k);
  const f = document.getElementById('fifty'); if (f) f.disabled = true;
  updateHud();

  if (isQ()) {
    showFb(feedback(ok, pts, it.r, it.n, k === -1));
  } else {
    const b = document.getElementById('blank');
    if (b) { b.textContent = it.a; b.className = 'filled'; }
    showFb(feedback(ok, pts, it.r + ' (KJV)', ''));
  }
}

function fifty() {
  if (S.answered || S.usedFifty || S.lifelines < 1 || S.mode !== 'quiz') return;
  S.usedFifty = true; S.lifelines--;
  const it = S.items[S.i];
  const wrong = shuffle(it.opts.map((_, k) => k).filter(k => k !== it.ci)).slice(0, 2);
  const btns = document.querySelectorAll('#opts .opt');
  wrong.forEach(k => { btns[k].disabled = true; btns[k].classList.add('gone'); });
  const f = document.getElementById('fifty');
  f.disabled = true; f.textContent = t('lifeLeft')(S.lifelines);
}

function checkBooks() {
  const it = S.items[S.i];
  if (S.checked || S.placed.length !== it.idx.length) return;
  const right = it.idx.filter((b, k) => S.placed[k] === b).length;
  S.lastPerfect = right === it.idx.length;
  S.lastPts = right * 20 + (S.lastPerfect ? 50 : 0);
  S.score += S.lastPts; if (S.lastPerfect) S.correct++;
  S.checked = true;
  renderBooks();
}

function next() {
  S.i++;
  if (S.i >= S.items.length) (S.mode === 'duel' ? renderDuelResults : renderResults)(); else renderStep();
}

/* ---------- Results ---------- */
function renderResults() {
  stopTimer();
  const total = S.items.length, pct = S.correct / total;
  const rank = t('ranks')[pct === 1 ? 0 : pct >= 0.8 ? 1 : pct >= 0.6 ? 2 : pct >= 0.4 ? 3 : 4];
  const best = store.get('best', {});
  const isBest = S.score > (best[S.mode] || 0);
  if (isBest) { best[S.mode] = S.score; store.set('best', best); }
  app.innerHTML = `
    <div class="card res">
      ${isBest && S.score > 0 ? `<span class="newbest">${t('newBest')}</span>` : ''}
      <div class="rank">${rank}</div>
      <div class="big">${S.score}</div>
      <div class="sub">${t('points')}</div>
      <div class="stats">
        <div class="stat"><b>${S.correct}/${total}</b><span>${t('correctL')}</span></div>
        ${S.mode === 'quiz' || S.mode === 'verse' ? `<div class="stat"><b>${S.bestStreak}</b><span>${t('bestStreakL')}</span></div>` : ''}
        <div class="stat"><b>${best[S.mode] || 0}</b><span>${t('yourBest')}</span></div>
      </div>
      <p class="acts">${t('acts')}</p>
      <div class="btnrow" style="margin-top:18px">
        <button class="primary" data-act="again">${t('playAgain')}</button>
        <button class="secondary" data-act="home">${t('home')}</button>
      </div>
    </div>`;
}

function renderDuelResults() {
  stopTimer();
  const [a, b] = S.ps;
  const head = a === b ? t('tie') : t('winner')(esc(S.names[a > b ? 0 : 1]));
  const col = i => `<div class="stat ${a !== b && (i === 0) === (a > b) ? 'win' : ''}"><span>${esc(S.names[i])}</span><b>${S.ps[i]}</b><span>${S.pcorrect[i]}/${S.items.length / 2} ${t('correctL')}</span></div>`;
  app.innerHTML = `
    <div class="card res">
      <div class="rank">${head}</div>
      <div class="stats">${col(0)}${col(1)}</div>
      <p class="acts">${t('acts')}</p>
      <div class="btnrow" style="margin-top:18px">
        <button class="primary" data-act="again">${t('playAgain')}</button>
        <button class="secondary" data-act="home">${t('home')}</button>
      </div>
    </div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'home') renderHome();
  else if (a === 'lang') { LANG = b.dataset.lang === 'ceb' ? 'ceb' : 'en'; store.set('lang', LANG); renderHome(); }
  else if (a === 'mode') {
    const m = b.dataset.mode;
    if (m === 'quiz') renderCats(); else if (m === 'duel') renderDuelSetup(); else startGame(m, 'all');
  }
  else if (a === 'cat') startGame('quiz', b.dataset.cat);
  else if (a === 'duelcat') {
    const n1 = (document.getElementById('n1').value || '').trim() || t('p1');
    const n2 = (document.getElementById('n2').value || '').trim() || t('p2');
    startGame('duel', b.dataset.cat, [n1, n2]);
  }
  else if (a === 'ready') renderQuestion();
  else if (a === 'pick') answer(Number(b.dataset.k));
  else if (a === 'fifty') fifty();
  else if (a === 'clue') { if (S.clue < 3 && !S.answered) { S.clue++; renderWho(); } }
  else if (a === 'place') { const it = S.items[S.i]; if (!S.checked && S.placed.length < it.idx.length) { S.placed.push(Number(b.dataset.b)); renderBooks(); } }
  else if (a === 'unplace') { if (!S.checked) { S.placed.splice(Number(b.dataset.k), 1); renderBooks(); } }
  else if (a === 'check') checkBooks();
  else if (a === 'next') next();
  else if (a === 'again') startGame(S.mode, S.cat, S.names);
  else if (a === 'szup') resize(0.1);
  else if (a === 'szdown') resize(-0.1);
  else if (a === 'full') toggleFull();
});

renderHome();

</script>
</body>
</html>
