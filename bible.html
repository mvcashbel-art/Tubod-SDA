<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible · Tubod SDA Church</title>
<meta name="theme-color" content="#1D6A8A">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--surface:#fff;--accent:#1D6A8A;--accent-d:color-mix(in srgb,var(--accent) 72%,#000);--bg:#EEF4F7;--card:#fff;--ink:#17324D;--muted:#5B7083;--line:#D9E4EA;--soft:color-mix(in srgb,var(--accent) 10%,#fff);--hl:#fff3c4;--sel:#d6ebf5;--fs:1.18rem}
html[data-theme=dark]{--surface:#16232f;--bg:#0f1a24;--card:#16232f;--ink:#e6eef5;--muted:#9db0c1;--line:#273847;--soft:color-mix(in srgb,var(--accent) 22%,#16232f);--hl:#5a4a12;--sel:#1f4256;--accent-d:color-mix(in srgb,var(--accent) 55%,#fff)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Public Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e3a72b;outline-offset:2px}
h1,h2,h3{font-family:'Alegreya',Georgia,serif;margin:0}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
.back{color:var(--accent-d);font-weight:700;text-decoration:none;font-size:.92rem;padding:6px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sp{flex:1}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;padding:0 10px;font-weight:700;display:inline-grid;place-items:center}
.ib:hover{border-color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 120px}
.hero{padding:6px 2px 12px}.hero h1{font-size:clamp(1.9rem,6vw,2.5rem)}.hero p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.srch{display:flex;gap:8px;margin:10px 0 14px}
.srch input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;height:46px}
.btn.q{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border:0;border-radius:16px;padding:14px 16px;margin:0 0 14px}
.cont small{display:block;opacity:.85;font-size:.8rem}.cont b{font-family:'Alegreya',serif;font-size:1.3rem}
.cont .go{margin-left:auto;font-size:1.4rem}
.sec{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:left;font-weight:600;font-size:.92rem;line-height:1.25}
.bk:hover{border-color:var(--accent);background:var(--soft)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.cg button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:1.02rem}
.cg button:hover,.cg button.on{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.crumb h2{font-size:1.7rem}
.read{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 22px}
.read h2{font-size:1.9rem;margin-bottom:12px}
.vs{font-family:'Alegreya',Georgia,serif;font-size:var(--fs);line-height:1.75}
.v{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .2s}
.v sup{font:700 .62em 'Public Sans',sans-serif;color:var(--accent-d);margin:0 3px 0 5px;vertical-align:super}
.v.sel{background:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.v.flash{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.pn{display:flex;gap:8px;margin-top:16px}.pn button{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.pn button:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}.pn button:disabled{opacity:.4;cursor:default}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;display:block;width:100%;text-align:left}
.res:hover{border-color:var(--accent)}.res b{display:block;color:var(--accent-d);font-size:.86rem;margin-bottom:3px}.res span{font-family:'Alegreya',serif;font-size:1.06rem;line-height:1.5}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.note{color:var(--muted);font-size:.88rem;line-height:1.5;margin:10px 2px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(10,30,60,.18);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .2s}
.selbar.on{transform:none}.selbar-in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.selbar .ref{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar .btn{height:42px;padding:0 14px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media print{.bar,.selbar,.pn,.srch{display:none}.wrap{padding:0}.read{border:0}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="back" id="back" href="index.html">&#8249; Tubod SDA Church</a><span class="sp"></span>
  <button class="ib" id="ver" type="button" aria-label="Bible version" hidden></button>
  <button class="ib" id="szDn" type="button" aria-label="Smaller text">A&#8722;</button>
  <button class="ib" id="szUp" type="button" aria-label="Bigger text">A+</button>
  <button class="ib" id="thm" type="button" aria-label="Dark or light"></button>
  <button class="ib" id="lng" type="button" aria-label="Language"></button>
</div></header>
<main class="wrap" id="app"></main>
<div class="selbar" id="selbar" role="region" aria-label="Selected verses"><div class="selbar-in"><span class="ref" id="selref"></span><button class="btn q" id="selCopy" type="button"></button><button class="btn" id="selShare" type="button"></button><button class="btn q" id="selClear" type="button" aria-label="Clear">&#10005;</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const BASE = 'https://mvcashbel-art.github.io/isabel-merida-district/bible/';
const KEY = 'tubod', LANGKEY = 'tubodLang';
const INDEX = {"translations":[{"id":"ceb","name":"Ang Bag-ong Maayong Balita Biblia","short":"Maayong Balita","lang":"ceb","rights":"© 1999 Philippine Bible Society"},{"id":"gnt","name":"Good News Translation","short":"GNT","lang":"en","rights":"© 1992 American Bible Society"}],"books":[{"n":1,"en":"Genesis","ceb":"Genesis","ch":50,"ot":true},{"n":2,"en":"Exodus","ceb":"Exodo","ch":40,"ot":true},{"n":3,"en":"Leviticus","ceb":"Levitico","ch":27,"ot":true},{"n":4,"en":"Numbers","ceb":"Numeros","ch":36,"ot":true},{"n":5,"en":"Deuteronomy","ceb":"Deuteronomio","ch":34,"ot":true},{"n":6,"en":"Joshua","ceb":"Josue","ch":24,"ot":true},{"n":7,"en":"Judges","ceb":"Mga Maghuhukom","ch":21,"ot":true},{"n":8,"en":"Ruth","ceb":"Rut","ch":4,"ot":true},{"n":9,"en":"1 Samuel","ceb":"1 Samuel","ch":31,"ot":true},{"n":10,"en":"2 Samuel","ceb":"2 Samuel","ch":24,"ot":true},{"n":11,"en":"1 Kings","ceb":"1 Hari","ch":22,"ot":true},{"n":12,"en":"2 Kings","ceb":"2 Hari","ch":25,"ot":true},{"n":13,"en":"1 Chronicles","ceb":"1 Cronica","ch":29,"ot":true},{"n":14,"en":"2 Chronicles","ceb":"2 Cronica","ch":36,"ot":true},{"n":15,"en":"Ezra","ceb":"Esdras","ch":10,"ot":true},{"n":16,"en":"Nehemiah","ceb":"Nehemias","ch":13,"ot":true},{"n":17,"en":"Esther","ceb":"Ester","ch":10,"ot":true},{"n":18,"en":"Job","ceb":"Job","ch":42,"ot":true},{"n":19,"en":"Psalms","ceb":"Salmo","ch":150,"ot":true},{"n":20,"en":"Proverbs","ceb":"Proverbio","ch":31,"ot":true},{"n":21,"en":"Ecclesiastes","ceb":"Magwawali","ch":12,"ot":true},{"n":22,"en":"Song of Solomon","ceb":"Awit ni Solomon","ch":8,"ot":true},{"n":23,"en":"Isaiah","ceb":"Isaias","ch":66,"ot":true},{"n":24,"en":"Jeremiah","ceb":"Jeremias","ch":52,"ot":true},{"n":25,"en":"Lamentations","ceb":"Panaghoy","ch":5,"ot":true},{"n":26,"en":"Ezekiel","ceb":"Ezekiel","ch":48,"ot":true},{"n":27,"en":"Daniel","ceb":"Daniel","ch":12,"ot":true},{"n":28,"en":"Hosea","ceb":"Oseas","ch":14,"ot":true},{"n":29,"en":"Joel","ceb":"Joel","ch":3,"ot":true},{"n":30,"en":"Amos","ceb":"Amos","ch":9,"ot":true},{"n":31,"en":"Obadiah","ceb":"Obadias","ch":1,"ot":true},{"n":32,"en":"Jonah","ceb":"Jonas","ch":4,"ot":true},{"n":33,"en":"Micah","ceb":"Miqueas","ch":7,"ot":true},{"n":34,"en":"Nahum","ceb":"Nahum","ch":3,"ot":true},{"n":35,"en":"Habakkuk","ceb":"Habacuc","ch":3,"ot":true},{"n":36,"en":"Zephaniah","ceb":"Sofonias","ch":3,"ot":true},{"n":37,"en":"Haggai","ceb":"Ageo","ch":2,"ot":true},{"n":38,"en":"Zechariah","ceb":"Zacarias","ch":14,"ot":true},{"n":39,"en":"Malachi","ceb":"Malaquias","ch":4,"ot":true},{"n":40,"en":"Matthew","ceb":"Mateo","ch":28,"ot":false},{"n":41,"en":"Mark","ceb":"Marcos","ch":16,"ot":false},{"n":42,"en":"Luke","ceb":"Lucas","ch":24,"ot":false},{"n":43,"en":"John","ceb":"Juan","ch":21,"ot":false},{"n":44,"en":"Acts","ceb":"Mga Buhat","ch":28,"ot":false},{"n":45,"en":"Romans","ceb":"Roma","ch":16,"ot":false},{"n":46,"en":"1 Corinthians","ceb":"1 Corinto","ch":16,"ot":false},{"n":47,"en":"2 Corinthians","ceb":"2 Corinto","ch":13,"ot":false},{"n":48,"en":"Galatians","ceb":"Galacia","ch":6,"ot":false},{"n":49,"en":"Ephesians","ceb":"Efeso","ch":6,"ot":false},{"n":50,"en":"Philippians","ceb":"Filipos","ch":4,"ot":false},{"n":51,"en":"Colossians","ceb":"Colosas","ch":4,"ot":false},{"n":52,"en":"1 Thessalonians","ceb":"1 Tesalonica","ch":5,"ot":false},{"n":53,"en":"2 Thessalonians","ceb":"2 Tesalonica","ch":3,"ot":false},{"n":54,"en":"1 Timothy","ceb":"1 Timoteo","ch":6,"ot":false},{"n":55,"en":"2 Timothy","ceb":"2 Timoteo","ch":4,"ot":false},{"n":56,"en":"Titus","ceb":"Tito","ch":3,"ot":false},{"n":57,"en":"Philemon","ceb":"Filemon","ch":1,"ot":false},{"n":58,"en":"Hebrews","ceb":"Hebreo","ch":13,"ot":false},{"n":59,"en":"James","ceb":"Santiago","ch":5,"ot":false},{"n":60,"en":"1 Peter","ceb":"1 Pedro","ch":5,"ot":false},{"n":61,"en":"2 Peter","ceb":"2 Pedro","ch":3,"ot":false},{"n":62,"en":"1 John","ceb":"1 Juan","ch":5,"ot":false},{"n":63,"en":"2 John","ceb":"2 Juan","ch":1,"ot":false},{"n":64,"en":"3 John","ceb":"3 Juan","ch":1,"ot":false},{"n":65,"en":"Jude","ceb":"Judas","ch":1,"ot":false},{"n":66,"en":"Revelation","ceb":"Pinadayag","ch":22,"ot":false}]};
const BOOKS = INDEX.books, TRS = INDEX.translations;
const $ = s => document.querySelector(s), app = $('#app');
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

/* ---------- words ---------- */
const TX = {
  en: { title: 'Bible', sub: 'Read, search and share the Word.', ph: 'Search a word or a verse, like John 3:16', go: 'Search', cont: 'Continue reading', ot: 'Old Testament', nt: 'New Testament', chap: 'Chapter', prev: 'Previous', next: 'Next', chs: 'Chapters', copy: 'Copy', share: 'Share', copied: 'Copied', none: 'Nothing found. Try another word.', found: n => n + ' verse' + (n === 1 ? '' : 's') + ' found', more: 'Showing the first 150. Add another word to narrow it down.',
    load: 'Loading the Bible for searching…', err: 'Could not load this. Check your internet and try again.', off: 'Save the whole Bible for offline reading', offp: 'Saving… ', offd: 'The whole Bible is saved on this phone. You can read it without internet.', offn: 'Needs about 4 MB. It is saved only on this device.', ver: 'Version', home: 'All books', sz: 'Text size' },
  ceb: { title: 'Biblia', sub: 'Basaha, pangitaa ug ipaambit ang Pulong.', ph: 'Pangitag pulong o bersikulo, sama sa Juan 3:16', go: 'Pangita', cont: 'Padayon sa pagbasa', ot: 'Daang Tugon', nt: 'Bag-ong Tugon', chap: 'Kapitulo', prev: 'Nauna', next: 'Sunod', chs: 'Mga kapitulo', copy: 'I-copy', share: 'Ipaambit', copied: 'Na-copy na', none: 'Walay nakit-an. Sulayi ang lain nga pulong.', found: n => n + ' ka bersikulo ang nakit-an', more: 'Gipakita ang unang 150. Dugangi og pulong aron paliton.',
    load: 'Gikarga ang Biblia para sa pagpangita…', err: 'Wala maablihi kini. Susiha ang internet ug sulayi pag-usab.', off: 'I-save ang tibuok Biblia para mabasa bisan walay internet', offp: 'Gi-save… ', offd: 'Na-save na ang tibuok Biblia niining telepono. Mabasa nimo bisan walay internet.', offn: 'Mga 4 MB ang kinahanglan. Sa kini nga device ra kini ma-save.', ver: 'Bersyon', home: 'Tanang libro', sz: 'Gidak-on sa letra' }
};
let UI = (() => { const u = ls.get('bibleUi', null); if (u === 'ceb' || u === 'en') return u; try { return localStorage.getItem(LANGKEY) === 'ceb' ? 'ceb' : 'en'; } catch (e) { return 'en'; } })();
const T = k => TX[UI][k];
const bname = b => UI === 'ceb' ? b.ceb : b.en;
const tname = b => (TRS.find(t => t.id === TR) || TRS[0]).lang === 'ceb' ? b.ceb : b.en;

/* ---------- look ---------- */
(() => {
  const lk = ls.get(KEY + 'Look', null); if (lk && /^#[0-9a-f]{6}$/i.test(lk.accent || '')) document.documentElement.style.setProperty('--accent', lk.accent);
  const th = ls.get('bibleTheme', null) || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;
})();
let FS = ls.get('bibleFs', 1.18); const applyFs = () => document.documentElement.style.setProperty('--fs', FS + 'rem'); applyFs();
function chrome() {
  document.documentElement.lang = UI === 'ceb' ? 'ceb' : 'en';
  $('#lng').textContent = UI === 'ceb' ? 'BIS' : 'EN'; $('#thm').textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾';
  $('#selCopy').textContent = T('copy'); $('#selShare').textContent = T('share'); $('#szDn').title = $('#szUp').title = T('sz');
  const vb = $('#ver'); vb.hidden = TRS.length < 2; vb.textContent = tr1().short.replace('Maayong Balita', 'MB'); vb.title = tr1().name;
  document.title = T('title') + ' · Tubod SDA Church';
}
$('#lng').addEventListener('click', () => { UI = UI === 'ceb' ? 'en' : 'ceb'; ls.set('bibleUi', UI); try { localStorage.setItem(LANGKEY, UI); } catch (e) {} if (!ls.get('bibleTr', null)) TR = defTr(); chrome(); route(); });
$('#ver').addEventListener('click', () => { const i = TRS.findIndex(t => t.id === TR); TR = TRS[(i + 1) % TRS.length].id; ls.set('bibleTr', TR); chrome(); route(); });
$('#thm').addEventListener('click', () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; ls.set('bibleTheme', d); chrome(); });
$('#szUp').addEventListener('click', () => { FS = Math.min(2, +(FS + .1).toFixed(2)); ls.set('bibleFs', FS); applyFs(); });
$('#szDn').addEventListener('click', () => { FS = Math.max(.9, +(FS - .1).toFixed(2)); ls.set('bibleFs', FS); applyFs(); });
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); };

/* ---------- data: one file per book, cached on the phone as it is read ---------- */
const memo = {};  /* tr:n -> { v: chapters, nv: normalised } */
const defTr = () => (TRS.find(t => t.lang === UI) || TRS[0]).id;   /* the version that matches the site language, until someone picks one */
let TR = ls.get('bibleTr', null); if (!TRS.some(t => t.id === TR)) TR = defTr();
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const urlOf = (tr, n) => BASE + tr + '/' + n + '.json';
async function cacheOpen() { try { return await caches.open('bible-v1'); } catch (e) { return null; } }
async function getBook(n, tr) {
  tr = tr || TR; const k = tr + ':' + n; if (memo[k]) return memo[k];
  const u = urlOf(tr, n), c = await cacheOpen(); let res = c && await c.match(u);
  if (!res) { res = await fetch(u); if (!res.ok) throw new Error('http ' + res.status); if (c) { try { await c.put(u, res.clone()); } catch (e) {} } }
  const v = await res.json(); return (memo[k] = { v, nv: null });
}
const verseList = (chap) => {   /* skip merged (empty) verses, label them as 1-2 */
  const out = []; for (let i = 0; i < chap.length; i++) { if (!chap[i]) continue; let j = i + 1; while (j < chap.length && !chap[j]) j++; out.push({ a: i + 1, b: j, t: chap[i] }); } return out;
};

/* ---------- book names and references ---------- */
const key = s => norm(s).replace(/ /g, '');
const ALIAS = { gn: 1, ex: 2, dt: 5, ps: 19, pr: 20, is: 23, mt: 40, mk: 41, lk: 42, jn: 43, rm: 45, rev: 66, hb: 58, jas: 59, jm: 59 };
const BK = BOOKS.map(b => ({ n: b.n, ks: [key(b.en), key(b.ceb)] }));
function findBook(s) {
  const k = key(s); if (!k) return null;
  if (ALIAS[k]) return ALIAS[k];
  let hit = BK.find(b => b.ks.includes(k)); if (hit) return hit.n;
  if (k.length < 2) return null;
  hit = BK.find(b => b.ks.some(x => x.startsWith(k))); return hit ? hit.n : null;
}
function parseRef(q) {
  const m = /^\s*((?:[1-3]\s*)?[a-zÀ-ɏ][a-zÀ-ɏ .]*?)\s*(\d{1,3})?\s*(?:[:.]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?)?\s*$/i.exec(q);
  if (!m) return null; const n = findBook(m[1]); if (!n) return null;
  const b = BOOKS[n - 1], c = m[2] ? +m[2] : 0; if (c && (c < 1 || c > b.ch)) return null;
  return { n, c, v: m[3] ? +m[3] : 0 };
}
const refLabel = (n, c, a, b) => bname(BOOKS[n - 1]) + ' ' + c + (a ? ':' + (b && b !== a ? a + '–' + b : a) : '');

/* ---------- views ---------- */
const go = h => { if (location.hash === h) route(); else location.hash = h; };
const tr1 = () => TRS.find(t => t.id === TR) || TRS[0];
function head(title, sub) { return `<div class="hero"><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>`; }
function versionPick() {
  if (TRS.length < 2) return `<p class="note" data-b>${esc(tr1().name)} · ${esc(tr1().rights || '')}</p>`;
  return `<label class="note">${esc(T('ver'))}: <select id="trSel">${TRS.map(t => `<option value="${t.id}" ${t.id === TR ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>`;
}
function viewBooks() {
  const last = ls.get('bibleLast', null), lb = last && BOOKS[last.n - 1];
  const grp = (ot) => `<div class="grid">${BOOKS.filter(b => b.ot === ot).map(b => `<button class="bk" type="button" data-bk="${b.n}">${esc(bname(b))}</button>`).join('')}</div>`;
  app.innerHTML = head(T('title'), T('sub')) +
    `<form class="srch" id="sf" role="search"><input id="q" type="search" placeholder="${esc(T('ph'))}" aria-label="${esc(T('ph'))}" autocomplete="off"><button class="btn" type="submit">${esc(T('go'))}</button></form>` +
    (lb ? `<button class="cont" type="button" data-go="#/${last.n}/${last.c}"><span><small>${esc(T('cont'))}</small><b>${esc(refLabel(last.n, last.c))}</b></span><span class="go">&#8250;</span></button>` : '') +
    `<div class="sec">${esc(T('ot'))}</div>${grp(true)}<div class="sec">${esc(T('nt'))}</div>${grp(false)}` +
    `<div class="sec">&nbsp;</div><button class="btn q" id="offBtn" type="button" style="width:100%">${esc(T('off'))}</button><div class="prog" id="offP" hidden><i></i></div><p class="note" id="offN">${esc(ls.get('bibleOff:' + TR, 0) ? T('offd') : T('offn'))}</p>` + versionPick();
  $('#sf').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (!q) return; const r = parseRef(q); if (r && r.c) go('#/' + r.n + '/' + r.c + (r.v ? '/' + r.v : '')); else if (r) go('#/' + r.n); else go('#/s/' + encodeURIComponent(q)); });
  $('#offBtn').addEventListener('click', saveOffline);
  const sel = $('#trSel'); if (sel) sel.addEventListener('change', () => { TR = sel.value; ls.set('bibleTr', TR); route(); });
  window.scrollTo(0, 0);
}
function viewChapters(n) {
  const b = BOOKS[n - 1]; if (!b) return go('#');
  app.innerHTML = `<div class="crumb"><button class="btn q" type="button" data-go="#" style="height:38px">&#8249; ${esc(T('home'))}</button></div><h2 style="font-size:2rem;margin:4px 2px 12px">${esc(bname(b))}</h2><div class="sec" style="margin-top:6px">${esc(T('chs'))}</div><div class="cg">${Array.from({ length: b.ch }, (_, i) => `<button type="button" data-go="#/${n}/${i + 1}">${i + 1}</button>`).join('')}</div>`;
  window.scrollTo(0, 0);
}
let sel = new Set(), cur = null;
async function viewRead(n, c, v) {
  const b = BOOKS[n - 1]; if (!b || c < 1 || c > b.ch) return go('#');
  app.innerHTML = `<div class="empty">…</div>`; sel = new Set(); showSel();
  let bk; try { bk = await getBook(n); } catch (e) { app.innerHTML = `<div class="empty">${esc(T('err'))}<p><button class="btn" type="button" data-retry>OK</button></p></div>`; return; }
  const chap = bk.v[c - 1] || [], vl = verseList(chap); cur = { n, c, vl };
  ls.set('bibleLast', { n, c });
  const hasPrev = !(n === 1 && c === 1), hasNext = !(n === 66 && c === BOOKS[65].ch);
  app.innerHTML = `<div class="crumb"><button class="btn q" type="button" data-go="#/${n}" style="height:38px">&#8249; ${esc(bname(b))}</button><button class="btn q" type="button" data-go="#" style="height:38px">${esc(T('home'))}</button></div>
    <article class="read"><h2>${esc(bname(b))} ${c}</h2><div class="vs">${vl.map(x => `<span class="v" data-a="${x.a}" data-b="${x.b}"><sup>${x.a === x.b ? x.a : x.a + '–' + x.b}</sup>${esc(x.t)} </span>`).join('')}</div></article>
    <div class="pn"><button type="button" id="pv" ${hasPrev ? '' : 'disabled'}>&#8249; ${esc(T('prev'))}</button><button type="button" data-go="#/${n}">${esc(T('chs'))}</button><button type="button" id="nx" ${hasNext ? '' : 'disabled'}>${esc(T('next'))} &#8250;</button></div>
    <p class="note">${esc(tr1().name)} · ${esc(tr1().rights || '')}</p>`;
  const step = d => { let nn = n, cc = c + d; if (cc < 1) { nn = n - 1; if (nn < 1) return; cc = BOOKS[nn - 1].ch; } else if (cc > b.ch) { nn = n + 1; if (nn > 66) return; cc = 1; } go('#/' + nn + '/' + cc); };
  $('#pv').addEventListener('click', () => step(-1)); $('#nx').addEventListener('click', () => step(1)); viewRead.step = step;
  if (v) { const el = [...app.querySelectorAll('.v')].find(e => +e.dataset.a <= v && v <= +e.dataset.b); if (el) { el.classList.add('flash'); setTimeout(() => el.scrollIntoView({ block: 'center' }), 60); setTimeout(() => el.classList.remove('flash'), 3500); } else window.scrollTo(0, 0); }
  else window.scrollTo(0, 0);
  /* warm the next chapter's book so reading on goes smoothly */
  if (c === b.ch && n < 66) getBook(n + 1).catch(() => {});
}
/* picking verses: tap to select, then copy or share */
function showSel() {
  const bar = $('#selbar'); if (!cur || !sel.size) { bar.classList.remove('on'); return; }
  const rows = [...sel].sort((x, y) => x - y).map(i => cur.vl[i]);
  let parts = [], s = rows[0].a, e = rows[0].b;
  for (let i = 1; i < rows.length; i++) { if (rows[i].a <= e + 1) e = Math.max(e, rows[i].b); else { parts.push([s, e]); s = rows[i].a; e = rows[i].b; } } parts.push([s, e]);
  const ref = tname(BOOKS[cur.n - 1]) + ' ' + cur.c + ':' + parts.map(p => p[0] === p[1] ? p[0] : p[0] + '–' + p[1]).join(', ');
  $('#selref').textContent = ref; bar.classList.add('on'); bar.dataset.ref = ref;
}
const selText = () => {
  const rows = [...sel].sort((x, y) => x - y).map(i => cur.vl[i]), ref = $('#selbar').dataset.ref;
  return { ref, body: rows.map(r => (rows.length > 1 ? '(' + (r.a === r.b ? r.a : r.a + '–' + r.b) + ') ' : '') + r.t).join(' '), full: '“' + rows.map(r => r.t).join(' ') + '” — ' + ref + ' (' + tr1().short + ')' };
};
app.addEventListener('click', e => {
  const sp = e.target.closest('.v');
  if (sp && cur) { const i = [...app.querySelectorAll('.v')].indexOf(sp); if (sel.has(i)) { sel.delete(i); sp.classList.remove('sel'); } else { sel.add(i); sp.classList.add('sel'); } showSel(); return; }
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const bk = e.target.closest('[data-bk]'); if (bk) { go('#/' + bk.dataset.bk); return; }
  if (e.target.closest('[data-retry]')) route();
});
function clearSel() { sel = new Set(); app.querySelectorAll('.v.sel').forEach(x => x.classList.remove('sel')); showSel(); }
$('#selClear').addEventListener('click', clearSel);
$('#selCopy').addEventListener('click', async () => { if (!sel.size) return; const t = selText().full; try { await navigator.clipboard.writeText(t); toast(T('copied')); } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(T('copied')); } catch (er) {} ta.remove(); } });
$('#selShare').addEventListener('click', async () => {
  if (!sel.size) return; const s = selText(), url = location.href.split('#')[0] + '#/' + cur.n + '/' + cur.c + '/' + cur.vl[[...sel].sort((x, y) => x - y)[0]].a;
  if (navigator.share) { try { await navigator.share({ title: s.ref, text: s.full, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  if (window.__shareBox) { window.__shareBox(s.ref, s.full, url); return; }
  try { await navigator.clipboard.writeText(s.full + '\n' + url); toast(T('copied')); } catch (e) {}
});

/* ---------- search ---------- */
let allLoaded = {};
async function loadAll(prog) {
  let done = 0; const ids = BOOKS.map(b => b.n).filter(n => !memo[TR + ':' + n]);
  const run = async () => { while (ids.length) { const n = ids.shift(); await getBook(n); done++; if (prog) prog(done, done + ids.length); } };
  await Promise.all([run(), run(), run(), run()]);
}
let searchId = 0;
async function viewSearch(q) {
  const my = ++searchId, toks = norm(q).split(' ').filter(Boolean);
  app.innerHTML = `<div class="crumb"><button class="btn q" type="button" data-go="#" style="height:38px">&#8249; ${esc(T('home'))}</button></div><form class="srch" id="sf"><input id="q" type="search" value="${esc(q)}" aria-label="${esc(T('ph'))}"><button class="btn" type="submit">${esc(T('go'))}</button></form><p class="note">${esc(T('load'))}</p><div class="prog"><i id="pg"></i></div><div id="out"></div>`;
  $('#sf').addEventListener('submit', e => { e.preventDefault(); const v = $('#q').value.trim(); if (!v) return; const r = parseRef(v); if (r && r.c) go('#/' + r.n + '/' + r.c + (r.v ? '/' + r.v : '')); else go('#/s/' + encodeURIComponent(v)); });
  try { await loadAll((d, t) => { const p = $('#pg'); if (p) p.style.width = Math.round(d / 66 * 100) + '%'; }); } catch (e) { app.querySelector('.note').textContent = T('err'); return; }
  if (my !== searchId) return;
  const out = []; let total = 0;
  for (const b of BOOKS) {
    const bk = memo[TR + ':' + b.n]; if (!bk) continue;
    if (!bk.nv) bk.nv = bk.v.map(ch => ch.map(norm));
    for (let ci = 0; ci < bk.nv.length; ci++) for (let vi = 0; vi < bk.nv[ci].length; vi++) {
      const t = bk.nv[ci][vi]; if (t && toks.every(k => t.includes(k))) { total++; if (out.length < 150) out.push([b.n, ci + 1, vi + 1, bk.v[ci][vi]]); }
    }
  }
  const rx = toks.length ? new RegExp('(' + toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi') : null;
  app.querySelector('.note').textContent = total ? T('found')(total) + (total > 150 ? ' · ' + T('more') : '') : T('none'); const pr = app.querySelector('.prog'); if (pr) pr.remove();
  $('#out').innerHTML = out.map(r => `<button class="res" type="button" data-go="#/${r[0]}/${r[1]}/${r[2]}"><b>${esc(refLabel(r[0], r[1], r[2]))}</b><span>${rx ? esc(r[3]).replace(rx, '<mark>$1</mark>') : esc(r[3])}</span></button>`).join('');
}

/* ---------- save everything for offline ---------- */
async function saveOffline() {
  const btn = $('#offBtn'), p = $('#offP'), note = $('#offN'); btn.disabled = true; p.hidden = false;
  try { await loadAll((d) => { p.firstElementChild.style.width = Math.round(d / 66 * 100) + '%'; note.textContent = T('offp') + d + '/66'; }); ls.set('bibleOff:' + TR, 1); note.textContent = T('offd'); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }
  catch (e) { note.textContent = T('err'); }
  p.hidden = true; btn.disabled = false;
}

/* ---------- routing ---------- */
function route() {
  chrome(); clearSel(); cur = null;
  let h = (location.hash || '').replace(/^#\/?/, ''); try { h = decodeURIComponent(h); } catch (e) {} const parts = h.split('/');
  if (!h) return viewBooks();
  if (parts[0] === 's') return viewSearch(parts.slice(1).join('/'));
  const n = +parts[0], c = +parts[1], v = +parts[2];
  if (!n) return viewBooks(); if (!c) return viewChapters(n); return viewRead(n, c, v || 0);
}
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (e.target.matches('input,textarea,select')) return; if (viewRead.step && cur) { if (e.key === 'ArrowLeft') viewRead.step(-1); if (e.key === 'ArrowRight') viewRead.step(1); } });
route();
})();
</script>
<script src="sharebox.js" defer></script>
<script src="fanmenu.js" defer></script>
