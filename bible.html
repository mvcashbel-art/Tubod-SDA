<style>
:root{--surface:#fff;--accent:#1D6A8A;--accent-d:color-mix(in srgb,var(--accent) 72%,#000);--bg:#EEF4F7;--card:#fff;--ink:#17324D;--muted:#5B7083;--line:#D9E4EA;--soft:color-mix(in srgb,var(--accent) 10%,#fff);--hl:#fff3c4;--sel:#d6ebf5;--fs:1.18rem}

*{box-sizing:border-box}html,body{margin:0}

.sp{flex:1}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;padding:0 10px;font-weight:700;display:inline-grid;place-items:center}
.ib:hover{border-color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 120px}
.hero{padding:6px 2px 12px}.hero h1{font-size:clamp(1.9rem,6vw,2.5rem)}.hero p{margin:4px 0 0;color:var(--muted);font-size:.95rem}

html[data-theme=dark] .v[data-hl=y]{background:#5a4a12}html[data-theme=dark] .v[data-hl=g]{background:#2b4a2d}html[data-theme=dark] .v[data-hl=b]{background:#1f4256}html[data-theme=dark] .v[data-hl=p]{background:#5a2a40}

.planbar{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px}

</style>

<script>
(() => {

"3 Juan","ch":1,"ot":false},{"n":65,"en":"Jude","ceb":"Judas","ch":1,"ot":false},{"n":66,"en":"Revelation","ceb":"Pinadayag","ch":22,"ot":false}]};

  ceb: { title: 'Biblia', sub: 'Basaha, pangitaa ug ipaambit ang Pulong.', ph: 'Pangitag pulong o bersikulo, sama sa Juan 3:16', go: 'Pangita', cont: 'Padayon sa pagbasa', ot: 'Daang Tugon', nt: 'Bag-ong Tugon', chap: 'Kapitulo', prev: 'Nauna', next: 'Sunod', chs: 'Mga kapitulo', copy: 'I-copy', share: 'Ipaambit', copied: 'Na-copy na', none: 'Walay nakit-an. Sulayi ang lain nga pulong.', found: n => n + ' ka bersikulo ang nakit-an', more: 'Gipakita ang unang 150. Dugangi og pulong aron paliton.',
    load: 'Gikarga ang Biblia para sa pagpangita…', err: 'Wala maablihi kini. Susiha ang internet ug sulayi pag-usab.', off: 'I-save ang tibuok Biblia para mabasa bisan walay internet', offp: 'Gi-save… ', offd: 'Na-save na ang tibuok Biblia niining telepono. Mabasa nimo bisan walay internet.', offn: 'Mga 4 MB ang kinahanglan. Sa kini nga device ra kini ma-save.', ver: 'Bersyon', home: 'Tanang libro', sz: 'Gidak-on sa letra' }
};
let UI = (() => { const u = ls.get('bibleUi', null); if (u === 'ceb' || u === 'en') return u; try { return localStorage.getItem(LANGKEY) === 'ceb' ? 'ceb' : 'en'; } catch (e) { return 'en'; } })();
const T = k => TX[UI][k];
const bname = b => UI === 'ceb' ? b.ceb : b.en;
const tname = b => (TRS.find(t => t.id === TR) || TRS[0]).lang === 'ceb' ? b.ceb : b.en;

/* ---------- look ---------- */
(() => {
  const lk = ls.get(KEY + 'Look', null); if (lk && /^#[0-9a-f]{6}$/i.test(lk.accent || '')) document.documentElement.style.setProperty('--accent', lk.accent);
  const th = ls.get('bibleTheme', null) || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');

/* the picture */
const mixHex = (hex, to, t) => { const a = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), b = [1, 3, 5].map(i => parseInt(to.slice(i, i + 2), 16)); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
async function drawPic(look, text, ref, tname2) {
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  let ac = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); if (!/^#[0-9a-f]{6}$/i.test(ac)) ac = '#1D6A8A';
  const L = { soft: { c1: mixHex(ac, '#ffffff', .93), c2: mixHex(ac, '#ffffff', .8), ink: '#17324D', mute: mixHex(ac, '#17324D', .45), bar: ac, q: mixHex(ac, '#ffffff', .65) },
    dark: { c1: '#0f1a24', c2: mixHex(ac, '#0f1a24', .6), ink: '#f1f6fa', mute: '#b8c8d6', bar: '#e3a72b', q: mixHex(ac, '#0f1a24', .35) },
    accent: { c1: ac, c2: mixHex(ac, '#000000', .4), ink: '#ffffff', mute: 'rgba(255,255,255,.82)', bar: '#e3a72b', q: 'rgba(255,255,255,.18)' } }[look] || null;
  try { await Promise.all([document.fonts.load('500 56px Alegreya'), document.fonts.load('700 40px Alegreya'), document.fonts.load('600 30px "Public Sans"')]); } catch (e) {}
  const gr = g.createLinearGradient(0, 0, W * .6, H); gr.addColorStop(0, L.c1); gr.addColorStop(1, L.c2); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = L.bar; g.fillRect(96, 110, 120, 10);
  g.fillStyle = L.q; g.font = '700 300px Alegreya, Georgia, serif'; g.textBaseline = 'alphabetic'; g.fillText('“', 84, 400);
  const box = { x: 96, y: 370, w: W - 192, h: 660 }; let size = 70, lines = [];
  const wrap = sz => { g.font = '500 ' + sz + 'px Alegreya, Georgia, serif'; const out = []; let line = ''; text.split(/\s+/).forEach(w => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > box.w && line) { out.push(line); line = w; } else line = t; }); if (line) out.push(line); return out; };
  for (; size >= 30; size -= 2) { lines = wrap(size); if (lines.length * size * 1.38 <= box.h) break; }
  g.fillStyle = L.ink; g.textAlign = 'left'; const lh = size * 1.38, top = box.y + (box.h - lines.length * lh) / 2 + size;
  lines.forEach((ln, i) => g.fillText(ln, box.x, top + i * lh));

  g.fillStyle = L.mute; g.font = '600 28px "Public Sans", system-ui, sans-serif'; g.fillText(tname2, 96, 1146);
  g.fillStyle = L.bar; g.fillRect(96, 1214, W - 192, 3);

}
async function openPic() {
